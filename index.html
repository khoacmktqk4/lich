      "<div class='rk-body'><div class='rk-top'><span class='rk-name'>"+escapeHtml(t.name)+"</span><span class='rk-p'><b>"+t.p+"</b> tiết</span></div>" +
      "<div class='rk-track'><div class='rk-fill' style='--w:"+(t.p/maxP*100)+"%; --h:"+hue+"'></div></div>" +
      "<div class='rk-meta'><span>"+t.n+" buổi</span><span>"+t.d.size+" ngày</span></div></div>";
    lst.appendChild(row);
  });
  tp.appendChild(lst);
  root.appendChild(tp);
}
function countUp(scope){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  scope.querySelectorAll(".stat-num[data-n]").forEach(el=>{
    const target = +el.dataset.n; if(!isFinite(target) || target<=0) return;
    const t0 = performance.now(), dur = 700;
    const step = (t)=>{ const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(target*e); if(k<1) requestAnimationFrame(step); };
    el.textContent = "0"; requestAnimationFrame(step);
  });
}
/* ---- Mật khẩu xuất PDF ---- */
const PDF_PASS_HASH = "919261ba";
function passHash(str){ let h = 0x811c9dc5; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }
function pdfUnlocked(){ try{ return sessionStorage.getItem("pdfOK") === PDF_PASS_HASH; }catch(e){ return false; } }
function requestPdfExport(){
  if(!toolData().rows.length){ toast("Không có dữ liệu để xuất"); return; }
  if(pdfUnlocked()){ exportToolsPDF(); return; }
  const ov = document.getElementById("pwOverlay"), inp = document.getElementById("pwInput"), err = document.getElementById("pwErr"), box = ov.querySelector(".pw-modal");
  inp.value = ""; err.textContent = ""; ov.classList.add("show");
  setTimeout(()=>inp.focus(), 60);
  const close = ()=>{ ov.classList.remove("show"); cleanup(); };
  const submit = ()=>{
    if(passHash(inp.value.trim()) === PDF_PASS_HASH){
      try{ sessionStorage.setItem("pdfOK", PDF_PASS_HASH); }catch(e){}
      close(); toast("Đã mở khóa xuất PDF"); exportToolsPDF();
    } else {
      err.textContent = "Mật khẩu không đúng, vui lòng thử lại.";
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      inp.select();
    }
  };
  const onKey = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } else if(e.key==="Escape") close(); };
  const onBg = (e)=>{ if(e.target===ov) close(); };
  const okB = document.getElementById("pwOk"), noB = document.getElementById("pwCancel");
  function cleanup(){ inp.removeEventListener("keydown",onKey); ov.removeEventListener("click",onBg); okB.removeEventListener("click",submit); noB.removeEventListener("click",close); }
  inp.addEventListener("keydown",onKey); ov.addEventListener("click",onBg); okB.addEventListener("click",submit); noB.addEventListener("click",close);
}
function exportToolsPDF(){
  const d = toolData(), f = state.tool;
  if(!d.rows.length){ toast("Không có dữ liệu để xuất"); return; }
  const now = new Date(), pad = n=>String(n).padStart(2,"0");
  const stamp = pad(now.getDate())+"/"+pad(now.getMonth()+1)+"/"+now.getFullYear()+" "+pad(now.getHours())+":"+pad(now.getMinutes());
  const GC = {QY:"#16A34A", QNhu:"#DB2777", QKhi:"#7C3AED", TChinh:"#D97706"};
  const one = !!f.teacher;
  const tName = one ? teacherNameOf(f.teacher) : "Tất cả giáo viên";
  const gl = f.group ? (GROUPS.find(g=>g.key===f.group)||{}).label : "Tất cả";
  const period = (f.from||f.to) ? ((f.from?fmtVN(f.from):"…")+" – "+(f.to?fmtVN(f.to):"…")) : "Toàn bộ ("+fmtVN(d.rows[0].date)+" – "+fmtVN(d.rows[d.rows.length-1].date)+")";
  const stat = (n,l,k)=>"<div class='pr-stat "+k+"'><b>"+n+"</b><span>"+l+"</span></div>";
  const gtag = (key,label)=>"<span class='gtag' style='background:"+(GC[key]||"#5B7B80")+"'>"+escapeHtml(label)+"</span>";
  let h =
    "<div class='pr-band'><div><h1>LỊCH GIẢNG DẠY</h1><div class='pr-sub'>Báo cáo thống kê giờ giảng</div></div><span class='pr-org'>K.CMKT/TQS</span></div>" +
    "<div class='pr-who'><div class='pr-label'>Giáo viên</div><div class='pr-name'>"+escapeHtml(tName)+"</div>" +
    "<div class='pr-meta'><span>Ngành: <b>"+escapeHtml(gl)+"</b></span><span>Thời gian: <b>"+escapeHtml(period)+"</b></span></div></div>" +
    "<div class='pr-stats'>"+stat(d.rows.length,"Số buổi dạy","s1")+stat(d.sumP,"Tổng số tiết","s2")+stat(d.days,"Số ngày có lịch","s3")+(one?"":stat(d.nTeachers,"Số giáo viên","s4"))+"</div>";
  if(!one){
    const mx = Math.max(1,...d.tRows.map(t=>t.p));
    h += "<h2>Thống kê theo giáo viên</h2><table><thead><tr><th class='ctr' style='width:34px'>STT</th><th>Giáo viên</th><th class='ctr'>Số buổi</th><th class='ctr'>Số tiết</th><th class='ctr'>Số ngày</th><th style='width:28%'>Tỷ lệ tiết</th></tr></thead><tbody>" +
      d.tRows.map((t,i)=>"<tr"+(i%2?" class='alt'":"")+"><td class='ctr'>"+(i+1)+"</td><td><b>"+escapeHtml(t.name)+"</b></td><td class='ctr'>"+t.n+"</td><td class='ctr'><b>"+t.p+"</b></td><td class='ctr'>"+t.d.size+"</td><td><div class='pbar'><i style='width:"+(t.p/mx*100)+"%; background:#0E8C8A'></i></div></td></tr>").join("") + "</tbody></table>";
  }
  const gTot = Math.max(1, d.sumP);
  h += "<h2>Thống kê theo ngành</h2><table><thead><tr><th>Ngành</th><th class='ctr'>Số buổi</th><th class='ctr'>Số tiết</th><th class='ctr'>Tỷ lệ</th><th style='width:32%'></th></tr></thead><tbody>" +
    d.gRows.map((g,i)=>"<tr class='"+(i%2?"alt":"")+(g.p?"":" zero")+"'><td>"+gtag(g.key,g.label)+"</td><td class='ctr'>"+g.n+"</td><td class='ctr'><b>"+g.p+"</b></td><td class='ctr'>"+Math.round(g.p/gTot*100)+"%</td><td><div class='pbar'><i style='width:"+(g.p/gTot*100)+"%; background:"+GC[g.key]+"'></i></div></td></tr>").join("") + "</tbody></table>";
  let lastDate = "", dayIdx = -1;
  h += "<h2>Lịch dạy chi tiết <small>("+d.rows.length+" buổi · "+d.sumP+" tiết)</small></h2><table><thead><tr><th class='ctr' style='width:30px'>STT</th><th>Ngày</th><th class='ctr'>Tiết</th><th class='ctr'>Số tiết</th><th>Ngành</th><th>Ký hiệu môn</th><th>Tên môn học</th>"+(one?"":"<th>Giáo viên</th>")+"<th>Địa điểm</th></tr></thead><tbody>" +
    d.rows.map((l,i)=>{
      const nd = l.date !== lastDate; if(nd){ dayIdx++; lastDate = l.date; }
      const cls = [(dayIdx%2?"alt":""),(nd && i?"newday":"")].join(" ").trim();
      return "<tr"+(cls?" class='"+cls+"'":"")+"><td class='ctr'>"+(i+1)+"</td><td class='dt'>"+(nd?escapeHtml(weekdayNameOf(l.date)+", "+fmtVN(l.date)):"")+"</td><td class='ctr'>"+escapeHtml(l.period||"–")+"</td><td class='ctr'>"+periodCount(l.period)+"</td><td>"+gtag(groupOf(l),groupLabel(l))+"</td><td class='code'>"+escapeHtml(l.code)+"</td><td>"+escapeHtml(l.subject && l.subject!==l.code ? l.subject : "–")+"</td>"+(one?"":"<td>"+escapeHtml(l.teacher||"Chưa rõ")+"</td>")+"<td>"+escapeHtml(l.location||"–")+"</td></tr>";
    }).join("") + "</tbody></table>";
  h += "<div class='pr-sign'><div><i>Ngày ..... tháng ..... năm "+now.getFullYear()+"</i><b>NGƯỜI LẬP</b></div></div>";
  h += "<div class='pr-foot'>Xuất từ Lịch công tác K.CMKT/TQS lúc "+stamp+"</div>";
  document.getElementById("printArea").innerHTML = h;
  const oldTitle = document.title;
  document.title = "Lich-giang-day-" + (one ? tName.replace(/[^\p{L}\p{N}]+/gu,"-") + "-" : "") + TODAY;
  const restore = ()=>{ document.title = oldTitle; window.removeEventListener("afterprint", restore); };
  window.addEventListener("afterprint", restore);
  setTimeout(()=>window.print(), 150);
}

  const i = Math.max(0, tabs.findIndex(t=>t.dataset.tab===state.tab));
  const nav = document.querySelector("nav.tabs"); if(nav) nav.style.setProperty("--ti", i);
}
function updateTaskTabLabel(){
  const n = (typeof taskCountFor === "function" && tasksStatus === "ok") ? taskCountFor(TODAY) : 0;

  updateTaskTabLabel();
  renderLegend();

/* ================= Header: ẩn thanh công cụ khi cuộn xuống ================= */
(function(){
  const hdr = document.querySelector("header.top"), wrap = document.getElementById("toolbarWrap");
  if(!hdr || !wrap) return;
  let hidden = false, busy = false, lastY = window.scrollY || 0, busyTimer = null;
  function measure(){ if(hidden || busy) return; document.documentElement.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); }
  function setHidden(v){
    if(v === hidden) return;
    hidden = v; busy = true;
    wrap.classList.toggle("is-hidden", hidden);
    clearTimeout(busyTimer);
    busyTimer = setTimeout(()=>{ busy = false; measure(); }, 340);
  }
  window.addEventListener("scroll", ()=>{
    const y = Math.max(0, window.scrollY || 0), dy = y - lastY;
    if(Math.abs(dy) < 6) return;
    lastY = y;
    if(y <= 24 || dy < 0) setHidden(false);
    else if(y > 120 && dy > 0 && document.activeElement !== document.getElementById("teacherSelect")) setHidden(true);
  }, {passive:true});
  window.addEventListener("resize", ()=>{ setHidden(false); setTimeout(measure, 360); });
  if(window.ResizeObserver) new ResizeObserver(measure).observe(hdr);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();
})();

/* ================= Đồng hồ số ================= */
(function(){
  const t = document.getElementById("clockTime"), d = document.getElementById("clockDate");
  if(!t || !d) return;
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const now = new Date();
    t.innerHTML = pad(now.getHours()) + '<span class="colon">:</span>' + pad(now.getMinutes()) + '<span class="colon">:</span>' + pad(now.getSeconds());
    d.textContent = weekdayNameOf(toISO(now)) + ", " + pad(now.getDate()) + "/" + pad(now.getMonth()+1);
  }
  tick();
  setInterval(tick, 1000);
})();

loadAllData();

})();
