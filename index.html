<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0E1411">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lịch công tác — K.CMKT/TQS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   LỊCH CÔNG TÁC — v2 "Bảng điều hành": thanh bên tối · bảng thời khoá biểu
   ===================================================================== */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
  --serif:var(--font); --font-num:var(--mono);
  --bg:#F1F2EE; --card:#FFFFFF; --paper:#F7F8F5; --paper-2:#ECEEE8; --line:#E0E3DC; --line-soft:#ECEEE9;
  --ink:#101713; --ink-2:#38433D; --muted:#7A847E;
  --side:#0E1411; --side-2:#161F1A; --side-line:#ffffff14; --side-ink:#E8EDE9; --side-muted:#8D9991;
  --hl:#1D7556; --hl-2:#2C9E74; --on-hl:#FFFFFF; --hl-soft:#E1F0E9; --task-soft:#EFF6F2;
  --amber:#E7A033; --amber-soft:#FCF1DC; --gold:#A6690A; --gold-soft:#FBF0DA; --brass:#E7A033; --brass-2:#F2BD62;
  --blue:#2F70B0;
  --p301:#1E8A5D; --p301-soft:#E0F2E9; --p303:#CD8710; --p303-soft:#FBEFD6;
  --nhu:#C23F6E; --nhu-soft:#F9E2EA; --khi:#5A53D4; --khi-soft:#E9E8FB; --red:#D0443A; --red-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(16,23,19,.05),0 1px 1px rgba(16,23,19,.03);
  --shadow-md:0 1px 2px rgba(16,23,19,.04),0 12px 32px -8px rgba(16,23,19,.14);
  --shadow-lg:0 30px 60px -12px rgba(16,23,19,.3);
  --r:10px; --r-l:16px; --ease:cubic-bezier(.22,.8,.24,1); --side-w:288px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E0C; --card:#111714; --paper:#151C18; --paper-2:#1B241F; --line:#222C26; --line-soft:#1A221E;
  --ink:#E8EDE9; --ink-2:#BCC6BF; --muted:#86918A; --side:#060908; --side-2:#0F1512;
  --hl:#5FCB9C; --hl-2:#86DDB7; --on-hl:#062014; --hl-soft:#15291F; --task-soft:#122019;
  --amber:#F0B04F; --amber-soft:#2A2010; --gold:#F0B860; --gold-soft:#2A2010; --brass:#F0B04F; --brass-2:#F6C878; --blue:#6EA9E0;
  --p301:#4FC48D; --p303:#E8A63A; --nhu:#EC7AA2; --khi:#9B95F5; --red:#EF7A6E;
  --p301-soft:#12271C; --p303-soft:#2A2111; --nhu-soft:#2D1520; --khi-soft:#1E1C38; --red-soft:#2E1714;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 12px 32px -8px rgba(0,0,0,.6); --shadow-lg:0 30px 60px -12px rgba(0,0,0,.75);}}
:root[data-theme="dark"]{
  --bg:#0A0E0C; --card:#111714; --paper:#151C18; --paper-2:#1B241F; --line:#222C26; --line-soft:#1A221E;
  --ink:#E8EDE9; --ink-2:#BCC6BF; --muted:#86918A; --side:#060908; --side-2:#0F1512;
  --hl:#5FCB9C; --hl-2:#86DDB7; --on-hl:#062014; --hl-soft:#15291F; --task-soft:#122019;
  --amber:#F0B04F; --amber-soft:#2A2010; --gold:#F0B860; --gold-soft:#2A2010; --brass:#F0B04F; --brass-2:#F6C878; --blue:#6EA9E0;
  --p301:#4FC48D; --p303:#E8A63A; --nhu:#EC7AA2; --khi:#9B95F5; --red:#EF7A6E;
  --p301-soft:#12271C; --p303-soft:#2A2111; --nhu-soft:#2D1520; --khi-soft:#1E1C38; --red-soft:#2E1714;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 12px 32px -8px rgba(0,0,0,.6); --shadow-lg:0 30px 60px -12px rgba(0,0,0,.75);}

/* ===== Nền ===== */
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top:16px;}
html.theming *{transition:background-color .35s,color .35s,border-color .35s !important;}
body{margin:0; color:var(--ink); background:var(--bg); font:14.5px/1.55 var(--font); letter-spacing:-.006em; -webkit-font-smoothing:antialiased; font-feature-settings:'cv11','ss03'; font-variant-numeric:tabular-nums;}
h1,h2,h3{margin:0; font-family:var(--font); font-weight:700; letter-spacing:-.022em;}
button{font-family:var(--font); cursor:pointer;}
::selection{background:var(--amber); color:#1A1204;}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
.mono{font-family:var(--mono);}

/* ===== Khung ứng dụng ===== */
.app{min-height:100vh;}
@media (min-width:1024px){
  .app{display:grid; grid-template-columns:var(--side-w) minmax(0,1fr);}
}

/* ===== Thanh bên ===== */
.side{position:relative; z-index:30; display:flex; flex-direction:column; gap:18px; padding:20px 18px; color:var(--side-ink); background:var(--side); overflow:hidden;}
.side::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(120% 50% at 0% 0%,rgba(44,158,116,.20),transparent 60%),radial-gradient(90% 40% at 100% 100%,rgba(231,160,51,.13),transparent 60%);}
.side::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:radial-gradient(#ffffff10 1px,transparent 1px); background-size:16px 16px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 55%); mask-image:linear-gradient(180deg,#000,transparent 55%);}
.side > *{position:relative; z-index:1;}
@media (min-width:1024px){
  .side{position:sticky; top:0; height:100vh; overflow-y:auto; scrollbar-width:none; padding:24px 20px 20px; border-right:1px solid #000;}
  .side::-webkit-scrollbar{display:none;}
}
.side-top{display:flex; flex-direction:column; gap:20px;}
.brand{display:flex; align-items:center; gap:12px; min-width:0;}
.brand-logo{flex:none; width:42px; height:42px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(145deg,var(--hl-2),var(--hl)); box-shadow:inset 0 1px 0 #ffffff40,0 8px 20px -6px rgba(44,158,116,.6);}
.brand-logo svg{width:22px; height:22px;} .brand-logo svg, .brand-logo svg *{stroke:#fff;}
.brand-text{min-width:0;}
.brand-eyebrow{display:flex; align-items:center; gap:7px; font:600 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--side-muted); white-space:nowrap;}
.flag-vn{flex:none; width:16px; height:11px; border-radius:2px;}
.brand h1{margin-top:2px; font-size:19px; line-height:1.15; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.clock{padding:16px 16px 14px; border:1px solid var(--side-line); border-radius:14px; background:linear-gradient(160deg,#ffffff0a,#ffffff03);}
.clock-time{font:500 40px/1 var(--mono); letter-spacing:-.04em; color:#fff; white-space:nowrap;}
.clock-time .colon{color:var(--amber); animation:blink 1s steps(1,end) infinite; margin:0 1px;}
.clock-date{margin-top:8px; font-size:12.5px; font-weight:500; color:var(--side-muted); white-space:nowrap;}
@keyframes blink{50%{opacity:.25;}}

.side-tools{display:flex; flex-direction:column; gap:8px;}
.side-label{font:600 10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--side-muted);}
select.sel{width:100%; min-width:0; height:40px; padding:0 12px; font:500 14px var(--font); color:#fff; background:#ffffff0a; border:1px solid var(--side-line); border-radius:10px; text-overflow:ellipsis;}
select.sel:hover{border-color:#ffffff30;}
select.sel option{color:#101713; background:#fff;}
.side-btns{display:grid; grid-template-columns:1fr 1fr 40px; gap:6px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; height:36px; padding:0 14px; white-space:nowrap; font:600 13px var(--font); border:1px solid transparent; border-radius:10px; transition:background .2s,border-color .2s,color .2s,transform .15s;}
.btn:active,.iconbtn:active{transform:scale(.96);}
.btn-ghost{color:var(--side-ink); background:#ffffff0a; border-color:var(--side-line);}
.btn-ghost:hover{background:#ffffff16; border-color:#ffffff30;}
.btn-gold{color:#1A1204; background:var(--amber); border-color:#0000000d;}
.btn-gold:hover{filter:brightness(1.06);}
.btn-outline{color:var(--ink); background:var(--card); border-color:var(--line);}
.btn-outline:hover{border-color:var(--ink-2);}
.btn-sm{height:32px; padding:0 12px; font-size:12.5px;}
.btn svg{width:15px; height:15px;}
#themeBtn{padding:0;}

nav.tabs{display:flex; flex-direction:column; gap:2px;}
.side-section{font:600 10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--side-muted); margin:4px 0 4px 2px;}
.tab{position:relative; display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; font:500 14px var(--font); text-align:left; color:var(--side-muted); background:transparent; border:none; border-radius:10px; transition:background .2s,color .2s;}
.tab svg{flex:none; width:18px; height:18px;}
.tab:hover{color:#fff; background:#ffffff08;}
.tab[aria-selected="true"]{color:#fff; background:#ffffff12; font-weight:600;}
.tab[aria-selected="true"]::before{content:""; position:absolute; left:-20px; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--amber);}
.tab-l{flex:1;}
.tab-badge{min-width:20px; padding:1px 7px; font:600 11px var(--mono); text-align:center; color:#1A1204; background:var(--amber); border-radius:999px;}
.tab-badge:empty{display:none;}
.side-foot{margin-top:auto; padding-top:14px; font-size:11.5px; color:var(--side-muted); border-top:1px solid var(--side-line); display:flex; align-items:center; gap:8px;}
.side-foot::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--hl-2); box-shadow:0 0 0 3px rgba(44,158,116,.25);}

/* Thanh bên → thanh trên khi màn hình hẹp */
@media (max-width:1023px){
  .side{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 14px; padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;}
  .side-top{display:contents;}
  .clock{padding:0; border:none; background:none; text-align:right;}
  .clock-time{font-size:24px;} .clock-date{margin-top:3px; font-size:11px;}
  .side-tools{grid-column:1 / -1; flex-direction:row; align-items:center;}
  .side-label{display:none;}
  select.sel{flex:1 1 auto; height:36px;}
  .side-btns{display:flex;} .side-btns .btn{height:36px;}
  nav.tabs{grid-column:1 / -1; flex-direction:row; gap:4px; padding:4px; background:#ffffff08; border:1px solid var(--side-line); border-radius:12px;}
  .side-section,.side-foot{display:none;}
  .tab{flex:1; justify-content:center; gap:7px; padding:9px 6px; font-size:13px;}
  .tab-l{flex:none;}
  .tab[aria-selected="true"]{background:#fff; color:var(--side);}
  :root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}
  .tab[aria-selected="true"]::before{display:none;}
}
@media (max-width:640px){
  .side{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px; gap:10px;}
  .brand-logo{width:36px; height:36px; border-radius:10px;} .brand h1{font-size:17px;}
  .clock-time{font-size:20px;}
  #refreshBtn .lbl{display:none;} #refreshBtn,#themeBtn{width:36px; padding:0;}
  #todayBtn{padding:0 12px;}
  nav.tabs{position:fixed; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); z-index:80; padding:6px; gap:2px;
    background:color-mix(in srgb,var(--side) 92%,transparent); border-color:#ffffff1a; border-radius:18px; box-shadow:0 16px 40px -8px rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.4); backdrop-filter:blur(16px) saturate(1.4);}
  .tab{flex-direction:column; gap:3px; padding:7px 2px 6px; font-size:10.5px; border-radius:12px;}
  .tab svg{width:20px; height:20px;}
  .tab-badge{position:absolute; top:3px; left:calc(50% + 6px); min-width:16px; padding:0 4px; font-size:9.5px;}
}

/* ===== Vùng nội dung ===== */
main{min-width:0; max-width:1240px; width:100%; margin:0 auto; padding:28px 32px 60px;}
@media (max-width:1023px){main{padding:20px 18px 60px;}}
@media (max-width:640px){main{padding:14px 12px 112px;}}
.status-panel{margin-bottom:16px; padding:18px 20px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow);}
.status-panel h3{font-size:16px; margin-bottom:6px;}
.status-panel p{margin:0 0 8px; font-size:13.5px; color:var(--muted);}
.status-panel ol{margin:8px 0 0; padding-left:20px; font-size:13px; line-height:1.8;}
.status-panel code{padding:1px 6px; font:12px var(--mono); background:var(--paper-2); border-radius:4px;}
.status-panel.error{border-left:3px solid var(--red);} .status-panel.setup{border-left:3px solid var(--amber);}
.spinner{width:22px; height:22px; margin-bottom:10px; border:2.5px solid var(--line); border-top-color:var(--hl); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; padding:10px 2px 0; font-size:12px; color:var(--muted);}
.legend span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%;}

/* ===== Ô "Hôm nay" (hero) ===== */
body:not([data-tab="week"]) #pinToday{display:none !important;}
.pin{display:grid; grid-template-columns:auto minmax(0,1fr); gap:0; margin-bottom:22px; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow-md);}
.pin-date{position:relative; display:flex; flex-direction:column; justify-content:center; min-width:170px; padding:20px 24px; color:#fff; overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(231,160,51,.35),transparent 60%),linear-gradient(150deg,#1D7556,#0E3B2B);}
.pin-date::after{content:""; position:absolute; inset:0; background-image:radial-gradient(#ffffff14 1px,transparent 1px); background-size:14px 14px; -webkit-mask-image:linear-gradient(90deg,transparent,#000); mask-image:linear-gradient(90deg,transparent,#000);}
.pin-date > *{position:relative;}
.pd-tag{display:inline-flex; align-items:center; gap:6px; width:fit-content; padding:3px 9px; font:600 10.5px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:#1A1204; background:var(--amber); border-radius:999px;}
.pd-tag::before{content:""; width:6px; height:6px; border-radius:50%; background:#1A1204; animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,18,4,.55);}100%{box-shadow:0 0 0 6px rgba(26,18,4,0);}}
.pd-wd{margin-top:14px; font-size:14px; font-weight:600; color:#CFE8DC;}
.pd-dd{font:600 64px/0.95 var(--mono); letter-spacing:-.06em;}
.pd-mm{margin-top:6px; font-size:12.5px; color:#CFE8DC;}
.pin-main{min-width:0; padding:18px 20px;}
.pin-head,.pin-head-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pin-head{justify-content:space-between;}
.pin-tag{display:none;}
.pin-title{font-size:17px; font-weight:700; letter-spacing:-.02em;}
.pin-lessons{display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 10px; font-size:13px; font-weight:500; color:var(--ink-2); background:var(--paper); border:1px solid var(--line-soft); border-radius:999px;}
.pin-lessons .pl-ico{display:none;}
.pin-lessons::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--hl-2);}
.pin-lessons.none::before{background:var(--muted);}
.pin-lessons b{font:600 15px var(--mono); color:var(--hl); margin-right:1px;}
.pin-body{margin-top:14px;}
.pin-empty{font-size:13.5px; color:var(--muted);}
.pin .task-list{gap:8px; margin:0;}
.pin .task-item{padding:11px 13px; background:var(--paper); border:1px solid var(--line-soft); border-radius:12px; box-shadow:none;}
.pin .task-num{background:var(--amber); color:#1A1204;}
.pin .task-title:empty{display:none;}
.pin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px;}
.pin-noterow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px;}
.pin-noterow .task-note{flex:1 1 auto; min-width:0; margin:0;}
.pin-tasklink{display:inline-flex; align-items:center; margin-top:10px; padding:6px 13px; font:600 12.5px var(--font); color:var(--hl); background:var(--hl-soft); border:none; border-radius:8px; white-space:nowrap; transition:filter .2s;}
.pin-tasklink::after{content:"→"; margin-left:6px;}
.pin-tasklink:hover{filter:brightness(.97);}
.pin-noterow .pin-tasklink{margin:0 0 0 auto;}
@media (max-width:640px){
  .pin{grid-template-columns:1fr; border-radius:16px; margin-bottom:16px;}
  .pin-date{flex-direction:row; flex-wrap:wrap; align-items:baseline; gap:4px 10px; min-width:0; padding:14px 16px;}
  .pd-tag{order:0;} .pd-wd{order:1; margin:0;} .pd-dd{order:2; font-size:30px; margin-left:auto;} .pd-mm{order:3; width:100%; margin:0;}
  .pin-main{padding:14px;}
}

/* ===== Thanh tiêu đề mỗi màn hình ===== */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.bar h2{font-size:24px; line-height:1.2;}
.bar h2 small{display:block; margin-top:3px; font-size:13px; font-weight:500; letter-spacing:0; color:var(--muted);}
.nav-group{display:flex; gap:6px;}
.iconbtn{display:grid; place-items:center; width:38px; height:38px; font-size:18px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); transition:border-color .2s,background .2s,transform .15s;}
.iconbtn:hover{border-color:var(--ink-2);}
#view-week .bar{flex-wrap:nowrap;} #view-week .bar h2{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} #view-week .bar .nav-group{flex-shrink:0;}
@media (max-width:640px){.bar h2{font-size:19px;} #view-week .bar h2{font-size:min(18px,4.6vw);} .iconbtn{width:36px; height:36px;}}

/* ===== Bảng thời khoá biểu tuần (máy tính) ===== */
.board{display:grid; grid-template-columns:84px repeat(5,minmax(0,1fr)); overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow-md);}
.board > div{min-width:0; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);}
.board > div:nth-child(6n){border-right:none;}
.board > div:nth-last-child(-n+6){border-bottom:none;}
.b-corner{display:flex; align-items:flex-end; padding:12px; font:600 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); background:var(--paper);}
.bh{position:relative; padding:14px 14px 12px; background:var(--paper);}
.bh .wd{font-size:12px; font-weight:600; color:var(--muted);}
.bh .dd{display:flex; align-items:baseline; gap:6px; margin-top:2px;}
.bh .dd b{font:600 26px/1 var(--mono); letter-spacing:-.05em; color:var(--ink);}
.bh .dd span{font:500 12px var(--mono); color:var(--muted);}
.bh .n{margin-top:6px; font-size:11.5px; font-weight:500; color:var(--muted);}
.bh .n b{font-family:var(--mono); color:var(--ink-2);}
.bh .bars{display:flex; gap:3px; margin-top:8px; height:4px;}
.bh .bars i{flex:1; border-radius:2px;}
.bh.is-today{background:var(--amber-soft);}
.bh.is-today::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--amber);}
.bh.is-today .dd b{color:var(--gold);}
.bh .today-pill{position:absolute; top:14px; right:12px; padding:1px 7px; font:600 9.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:#1A1204; background:var(--amber); border-radius:999px;}
.bs{display:flex; flex-direction:column; justify-content:center; gap:2px; padding:12px; background:var(--paper);}
.bs .k{font:600 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
.bs b{font:600 18px/1.1 var(--mono); letter-spacing:-.04em; color:var(--ink);}
.bs span{font-size:11.5px; font-weight:600; color:var(--hl);}
.bs.pm span{color:var(--gold);}
.bc{display:flex; flex-direction:column; gap:6px; min-height:118px; padding:8px;}
.bc.is-today{background:color-mix(in srgb,var(--amber) 5%,var(--card));}
.bc-empty{margin:auto; width:18px; height:2px; border-radius:2px; background:var(--line);}
.board .chip{padding:8px 9px 8px 12px;}
.board .chip-grid{flex-direction:column; gap:5px;}

/* ===== Danh sách tuần (máy tính bảng / điện thoại) ===== */
.week-strip{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; margin-bottom:16px;}
.ws-day{position:relative; display:flex; flex-direction:column; align-items:center; gap:1px; padding:9px 2px 8px; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); transition:background .2s,border-color .2s,transform .15s;}
.ws-day:hover{border-color:var(--ink-2);} .ws-day:active{transform:scale(.95);}
.ws-wd{font-size:10.5px; font-weight:600; color:var(--muted);}
.ws-dd{font:600 15px/1.3 var(--mono); letter-spacing:-.04em;}
.ws-all .ws-dd{font:700 12px/1.6 var(--font); letter-spacing:0; text-transform:uppercase;}
.ws-n{font-size:10px; color:var(--muted); white-space:nowrap;}
.ws-bars{display:flex; gap:2px; width:56%; height:3px; margin:4px 0 3px;}
.ws-bars i{flex:1; border-radius:2px;} .ws-bars i.none{background:var(--line);}
.ws-day.empty{opacity:.55;}
.ws-day.is-today{background:var(--amber-soft); border-color:var(--amber);}
.ws-day.active{background:var(--ink); border-color:var(--ink); color:var(--card); opacity:1; box-shadow:var(--shadow-md);}
.ws-day.active .ws-wd,.ws-day.active .ws-n{color:var(--card); opacity:.7;}
.ws-day.active.is-today::after{content:""; position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--amber);}
.week-cards .day-card{animation:cardIn .45s var(--ease) both; animation-delay:calc(var(--i,0) * 40ms);}
@keyframes cardIn{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:none;}}
.day-card{display:grid; grid-template-columns:72px 1fr; margin-bottom:12px; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow);}
.day-head{grid-row:1 / span 20; display:flex; flex-direction:column; align-items:center; gap:2px; padding:14px 4px; text-align:center; background:var(--paper); border-right:1px solid var(--line-soft);}
.day-head .wd{font-size:11px; font-weight:600; color:var(--muted); line-height:1.3;}
.day-head .dd{font:600 30px/1 var(--mono); letter-spacing:-.06em;}
.day-head .dt{font:500 10.5px var(--mono); color:var(--muted); white-space:nowrap;}
.day-card.is-today{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber),var(--shadow-md);}
.day-card.is-today .day-head{background:var(--amber-soft);} .day-card.is-today .dd{color:var(--gold);}
.today-badge{margin-top:6px; padding:1px 6px; font:600 8.5px var(--mono); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; color:#1A1204; background:var(--amber); border-radius:999px;}
.day-card.flash{animation:flash 1.1s ease;}
@keyframes flash{30%{box-shadow:0 0 0 2px var(--hl),var(--shadow-lg);}}
.slot-block{grid-column:2; display:grid; grid-template-columns:56px 1fr; gap:10px; padding:10px 12px 10px 10px; border-top:1px solid var(--line-soft);}
.day-head + .slot-block{border-top:none;}
.slot-period{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 2px; text-align:center; background:var(--paper); border-radius:10px;}
.slot-period .sp-k{font:600 9px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
.slot-period .sp-n{font:600 15px/1.3 var(--mono); letter-spacing:-.04em; color:var(--ink); white-space:nowrap;}
.slot-period .sp-s{font-size:10px; font-weight:600; color:var(--hl);}
.slot-chips{display:flex; flex-direction:column; gap:6px;}
.slot-block .chip-code{display:none;}
.slot-empty{grid-column:2; padding:16px !important; font-size:13px; color:var(--muted);}
@media (min-width:641px){.slot-block .slot-chips{flex-direction:row; flex-wrap:wrap;} .slot-block .slot-chips > .chip{flex:1 1 240px;} .slot-block{grid-template-columns:66px 1fr;}}
@media (max-width:640px){
  .week-strip{gap:4px;} .ws-day{padding:7px 1px 6px; border-radius:10px;} .ws-dd{font-size:13px;} .ws-wd,.ws-n{font-size:9.5px;}
  .day-card{grid-template-columns:54px 1fr;} .day-head .dd{font-size:24px;} .day-head .wd{font-size:10px;}

}

/* ===== Thẻ buổi học ===== */
.chip{--tc:var(--muted); position:relative; overflow:hidden; cursor:pointer; padding:9px 11px 9px 14px; background:color-mix(in srgb,var(--tc) 7%,var(--card));
  border:1px solid color-mix(in srgb,var(--tc) 16%,var(--line-soft)); border-radius:10px; transition:border-color .2s,box-shadow .2s,opacity .3s,transform .15s;}

.chip:hover{border-color:color-mix(in srgb,var(--tc) 50%,var(--line)); box-shadow:var(--shadow-md); transform:translateY(-1px);}
.chip.track-P301,.chip.track-P302,.chip.track-P303,.chip.track-QY{--tc:var(--p301);}
.chip.track-QNhu{--tc:var(--nhu);} .chip.track-QKhi{--tc:var(--khi);} .chip.track-TChinh{--tc:var(--p303);}

.chip-top{display:flex; align-items:center; flex-wrap:wrap; gap:3px 8px;}

.chip-teacher::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--tc);}
.chip-teacher:empty{display:none;}
.chip-loc{font-size:11.5px; font-weight:500; line-height:1.35; color:var(--gold); word-break:break-word;}
.chip.match{box-shadow:0 0 0 2px var(--amber);} .chip.match .chip-teacher{color:#1A1204; background:var(--amber); border-color:var(--amber);}
.chip.dim{opacity:.28;}

@media (max-width:640px){.tc-list{grid-template-columns:1fr;}}
.tcard{--uc:var(--blue); position:relative; display:flex; gap:14px; padding:16px; cursor:pointer; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow);

.rk-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}

.rk-p{flex:none; font-size:12px; color:var(--muted);} .rk-p b{font:600 15px var(--mono); color:var(--ink); margin-right:2px;}
.rk-track{height:6px; margin:7px 0 5px; overflow:hidden; background:var(--paper-2); border-radius:999px;}
.rk-fill{width:var(--w); height:100%; background:linear-gradient(90deg,var(--hl),var(--hl-2)); border-radius:999px; transform-origin:left; animation:grow 1s var(--ease) both; animation-delay:calc(var(--i,0) * 35ms + 150ms);}
@keyframes grow{from{transform:scaleX(0);}}
.rk-meta{display:flex; gap:12px; font-size:11.5px; color:var(--muted);}
@media (max-width:640px){.donut-wrap{flex-direction:column; align-items:stretch;} .donut{align-self:center;} .donut-legend{min-width:0;} .tool-pdf{margin-left:0;}}

/* ===== Cửa sổ, thông báo, mật khẩu ===== */
.overlay{position:fixed; inset:0; z-index:200; display:none; align-items:flex-end; justify-content:center; background:rgba(6,9,8,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
.overlay.show{display:flex; animation:fadeIn .25s ease both;}
.modal{width:100%; max-width:460px; max-height:85vh; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom,0px); background:var(--card); border-radius:20px 20px 0 0; box-shadow:var(--shadow-lg); animation:sheet .38s var(--ease) both;}
@media (min-width:641px){.overlay{align-items:center; padding:16px;} .modal{border-radius:20px;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 12px;}
.modal-head h3{font-size:18px;}
.modal-close{width:32px; height:32px; font-size:20px; line-height:1; color:var(--ink-2); background:var(--paper); border:1px solid var(--line); border-radius:10px;}
.modal-body{padding:0 20px 20px;}
.kv{display:flex; justify-content:space-between; gap:14px; padding:11px 0; font-size:14px; border-top:1px solid var(--line-soft);}
.kv .k{flex:none; color:var(--muted);}
.kv .v{font-weight:600; text-align:right; color:var(--ink);}
#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 96px); z-index:300; padding:10px 18px; font-size:13px; font-weight:500; color:var(--bg); background:var(--ink); border-radius:999px; box-shadow:var(--shadow-lg);
  opacity:0; transform:translateX(-50%) translateY(16px); transition:opacity .25s,transform .3s var(--ease); pointer-events:none;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#pwOverlay{align-items:center; padding:16px;}
.pw-modal{max-width:360px; padding:26px 22px 20px; text-align:center; border-radius:20px !important;}
.pw-ico{width:52px; height:52px; margin:0 auto 12px; display:grid; place-items:center; color:#fff; background:linear-gradient(145deg,var(--hl-2),var(--hl)); border-radius:14px;}
.pw-ico svg{width:24px; height:24px;}
.pw-modal h3{font-size:18px; margin-bottom:4px;}
.pw-modal p{margin:0 0 14px; font-size:13px; color:var(--muted);}
#pwInput{width:100%; height:44px; padding:0 14px; font:600 16px var(--mono); letter-spacing:.2em; text-align:center; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:10px; outline:none;}
#pwInput:focus{border-color:var(--hl); box-shadow:0 0 0 3px var(--hl-soft);}
.pw-err{min-height:18px; margin:7px 0 4px; font-size:12.5px; font-weight:600; color:var(--red);}
.pw-actions{display:flex; gap:10px;} .pw-actions .btn{flex:1; height:42px; font-size:14px;}
.pw-modal.shake{animation:shake .4s ease;}
@keyframes shake{20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}

/* ===== Chuyển động ===== */
@keyframes rise{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes sheet{from{opacity:0; transform:translateY(30px);}to{opacity:1; transform:none;}}
.pin,.month-layout,#view-tasks > *,#view-tools > .panel{animation:rise .45s var(--ease) both;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important; transition:none !important; scroll-behavior:auto !important;}}

/* =====================================================================
   v2.1 — header/thanh điều hướng xanh, dòng ngày, ô tiết nổi, thẻ 3D
   ===================================================================== */
:root{--g1:#23885F; --g2:#1D7556; --g3:#0E3B2B;}
.side{background:radial-gradient(120% 70% at 100% 0%,rgba(231,160,51,.30),transparent 60%),linear-gradient(150deg,var(--g2) 0%,var(--g3) 100%);
  --side-muted:#B9DCCB; --side-line:#ffffff26; border-right-color:#0A2C20;}
.side::before{display:none;}
.side::after{opacity:1; background-image:radial-gradient(#ffffff1c 1px,transparent 1px); background-size:14px 14px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 70%); mask-image:linear-gradient(90deg,transparent,#000 70%);}
.brand-logo{background:linear-gradient(145deg,#ffffff38,#ffffff12); border:1px solid #ffffff40; box-shadow:inset 0 1px 0 #ffffff40;}
.clock{background:#00000018;}
select.sel,.btn-ghost{background:#ffffff17; border-color:#ffffff30;}
.btn-ghost:hover{background:#ffffff26;}
.tab{color:#CFE8DC;}
.tab[aria-selected="true"]{background:#ffffff22;}
@media (max-width:1023px){
  nav.tabs{background:#00000022; border-color:#ffffff26;}
  .tab[aria-selected="true"]{background:#fff; color:var(--g3); box-shadow:0 4px 12px rgba(0,0,0,.25);}
}
@media (max-width:640px){
  nav.tabs{background:radial-gradient(90% 140% at 100% 0%,rgba(231,160,51,.28),transparent 60%),linear-gradient(150deg,var(--g2),var(--g3)); border-color:#ffffff30; box-shadow:0 16px 40px -8px rgba(14,59,43,.6);}
  .tab{color:#CFE8DC;}
}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:#fff; color:var(--g3);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:#fff; color:var(--g3);}}
@media (min-width:1024px){.tab[aria-selected="true"]{background:#ffffff22 !important; color:#fff !important;}}

/* Dòng thứ – ngày thay cho ô ngày bên trái */
.day-line{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; margin:6px 2px 10px; animation:cardIn .45s var(--ease) both; animation-delay:calc(var(--i,0) * 40ms);}
.day-line::before{content:""; width:4px; height:20px; border-radius:3px; background:linear-gradient(180deg,var(--g1),var(--g3));}
.day-line.is-today::before{background:linear-gradient(180deg,var(--brass-2),var(--amber));}
.dln-wd{font-size:16px; font-weight:700; letter-spacing:-.02em;}
.dln-date{font:600 14px var(--mono); letter-spacing:-.03em; color:var(--ink-2);}
.dln-today{padding:2px 9px; font-size:11px; font-weight:700; color:#1A1204; background:var(--amber); border-radius:999px;}
.dln-n{margin-left:auto; padding:2px 10px; font-size:12px; font-weight:600; color:var(--hl); background:var(--hl-soft); border-radius:999px;}
.day-card{grid-template-columns:1fr !important;}
.day-card .slot-block,.day-card .slot-empty{grid-column:1;}
.day-card > .slot-block:first-child{border-top:none;}

/* Ô tiết nổi bật */
.slot-period,.bs{color:#fff; background:linear-gradient(160deg,#2FA06F,var(--g2) 55%,var(--g3)); border:none;
  box-shadow:inset 0 1px 0 #ffffff40,0 3px 0 #0B3A29,0 8px 16px -6px rgba(14,59,43,.55);}
.slot-period.pm,.bs.pm{background:linear-gradient(160deg,#F4B34A,#DD8A15 60%,#B86A06); box-shadow:inset 0 1px 0 #ffffff55,0 3px 0 #8A4E04,0 8px 16px -6px rgba(184,106,6,.5);}
.slot-period .sp-k,.slot-period .sp-s,.bs .k,.bs span{color:#ffffffd9 !important;}
.slot-period .sp-n,.bs b{color:#fff;}
.slot-period .sp-n{font-size:16px;}
.slot-block{align-items:stretch;}
.bs{margin:8px; border-radius:12px; align-items:center; text-align:center;}
.board > .bs{border-right:none; border-bottom:none;}

/* Thẻ công việc 3D */
.tc-list{gap:18px;}
.tcard{border:1.5px solid color-mix(in srgb,var(--uc) 50%,var(--line)); margin-bottom:6px;
  box-shadow:inset 0 1px 0 #ffffff90,0 5px 0 color-mix(in srgb,var(--uc) 42%,var(--line)),0 18px 28px -8px color-mix(in srgb,var(--uc) 32%,transparent);}
.tcard::before{display:none;}
.tcard.is-current{box-shadow:inset 0 1px 0 #ffffff90,0 6px 0 color-mix(in srgb,var(--uc) 45%,var(--line)),0 22px 34px -8px color-mix(in srgb,var(--uc) 38%,transparent);}
@media (hover:hover){.tcard:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 #ffffff90,0 8px 0 color-mix(in srgb,var(--uc) 42%,var(--line)),0 24px 34px -8px color-mix(in srgb,var(--uc) 36%,transparent);}}
.tcard:active{transform:translateY(4px) !important; box-shadow:inset 0 1px 0 #ffffff90,0 1px 0 color-mix(in srgb,var(--uc) 42%,var(--line)),0 6px 12px -4px color-mix(in srgb,var(--uc) 25%,transparent) !important;}
.tc-date{color:#fff; background:linear-gradient(160deg,var(--uc),color-mix(in srgb,var(--uc) 65%,#000)); box-shadow:inset 0 1px 0 #ffffff40,0 6px 14px -4px color-mix(in srgb,var(--uc) 55%,transparent);}
.tc-wd,.tc-mm{opacity:.9;}

/* Đếm ngược nổi bật */
.cd{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; font:700 12.5px var(--font); letter-spacing:0; color:#fff;
  background:linear-gradient(135deg,#3B82C4,#245E96); border-radius:999px; box-shadow:inset 0 1px 0 #ffffff40,0 3px 0 #1B4772,0 8px 14px -6px rgba(36,94,150,.6);}
.cd::before{content:""; width:7px; height:7px; border-radius:50%; background:#fff; opacity:.9;}
.cd.now{color:#fff; background:linear-gradient(135deg,#2FA06F,#1D7556); box-shadow:inset 0 1px 0 #ffffff40,0 3px 0 #0E3B2B,0 8px 14px -6px rgba(29,117,86,.6);}
.cd.soon{color:#fff; background:linear-gradient(135deg,#EF5A4E,#C2342A); box-shadow:inset 0 1px 0 #ffffff40,0 3px 0 #8E2119,0 8px 14px -6px rgba(194,52,42,.6);}
.cd.near{color:#2A1800; background:linear-gradient(135deg,#FFC965,#EC9A1E); box-shadow:inset 0 1px 0 #ffffff60,0 3px 0 #A86507,0 8px 14px -6px rgba(236,154,30,.6);}
.cd.near::before{background:#2A1800;}
.cd.now::before,.cd.soon::before{animation:cdpulse 1.6s ease-out infinite;}
@keyframes cdpulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8);}100%{box-shadow:0 0 0 7px rgba(255,255,255,0);}}
.ws-day.active{background:linear-gradient(160deg,#2FA06F,var(--g2) 55%,var(--g3)); border-color:transparent; color:#fff; box-shadow:inset 0 1px 0 #ffffff40,0 3px 0 #0B3A29,0 10px 18px -6px rgba(14,59,43,.55);}
.ws-day.active .ws-wd,.ws-day.active .ws-n{color:#fff;}

/* ===== In / xuất PDF ===== */
#printArea{display:none;}
@media print{
  @page{size:A4; margin:12mm 11mm 13mm;}
  html,body{height:auto !important; padding:0 !important; background:#fff !important;}
  body > *:not(#printArea){display:none !important;}
  #printArea{display:block !important; color:#16201A; font:10.5px/1.45 var(--font); -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #printArea *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .pr-band{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; color:#fff; border-radius:6px; border-bottom:3px solid #B08A3E; background:linear-gradient(120deg,#14211A,#1E3127 60%,#2A4535) !important;}
  .pr-band h1{margin:0; font:600 19px var(--serif); letter-spacing:.06em; color:#fff;}
  .pr-band .pr-org{padding:3px 10px; font-size:10.5px; font-weight:700; letter-spacing:.1em; color:#1A1406; background:#D6B66E !important; border-radius:3px;}
  .pr-band .pr-sub{margin-top:2px; font-size:10px; color:#C9D3CA;}
  .pr-who{margin:12px 0 4px; padding:10px 14px; background:#F7F5EF !important; border:1px solid #E2DDD1; border-left:4px solid #B08A3E; border-radius:6px;}
  .pr-who .pr-label{font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#78837A;}
  .pr-who .pr-name{margin-top:1px; font:600 19px var(--serif); color:#14211A;}
  .pr-who .pr-meta{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:8px; padding-top:7px; font-size:10.5px; color:#3B4840; border-top:1px dashed #D6CFBE;}
  .pr-who .pr-meta b{color:#2F6B4F;}
  .pr-stats{display:flex; gap:8px; margin:10px 0 4px;}
  .pr-stat{flex:1; padding:8px 6px 7px; text-align:center; color:#14211A; background:#F7F5EF !important; border:1px solid #E2DDD1; border-top:3px solid #2F6B4F; border-radius:6px;}
  .pr-stat b{display:block; font:600 19px/1.1 var(--serif);}
  .pr-stat span{font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#78837A;}
  .pr-stat.s2{border-top-color:#2C6E9B;} .pr-stat.s3{border-top-color:#B08A3E;} .pr-stat.s4{border-top-color:#5A4DB5;}
  #printArea h2{display:flex; align-items:center; gap:7px; margin:14px 0 6px; font:600 13px var(--serif); color:#14211A; break-after:avoid;}
  #printArea h2::before{content:""; width:3px; height:13px; border-radius:2px; background:#B08A3E !important;}
  #printArea h2 small{font:600 10px var(--font); color:#78837A;}
  #printArea table{width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; font-size:10px; border:1px solid #DFD9CB; border-radius:6px;}
  #printArea th,#printArea td{padding:4px 6px; text-align:left; vertical-align:top; border-bottom:1px solid #ECE8DE;}
  #printArea th{font-weight:700; color:#fff; background:#1E3127 !important; border-bottom:none;}
  #printArea tbody tr:last-child td{border-bottom:none;}
  #printArea tr.alt td{background:#F7F5EF !important;}
  #printArea tr.newday td{border-top:1.5px solid #C9BFA6;}
  #printArea td.dt{font-weight:700; color:#2F6B4F; white-space:nowrap;}
  #printArea td.code{font-weight:700;}
  #printArea .ctr{text-align:center;}
  #printArea .gtag{display:inline-block; padding:0 7px; font-size:9.5px; font-weight:700; color:#fff; border-radius:3px;}
  #printArea .pbar{height:6px; overflow:hidden; background:#ECE8DE !important; border-radius:999px;}
  #printArea .pbar i{display:block; height:100%; border-radius:999px;}
  #printArea tr.zero td{color:#A7AFA8;}
  #printArea thead{display:table-header-group;}
  #printArea tr{break-inside:avoid;}
  #printArea .pr-sign{display:flex; justify-content:flex-end; margin-top:16px; break-inside:avoid;}
  #printArea .pr-sign div{width:220px; text-align:center; font-size:10.5px;}
  #printArea .pr-sign b{display:block; margin-bottom:40px;}
  #printArea .pr-foot{margin-top:10px; padding-top:5px; font-size:9px; text-align:right; color:#78837A; border-top:1px solid #ECE8DE;}
}
</style>

<script>

   CẤU HÌNH — dán 4 link "Xuất bản lên web" (định dạng CSV) từ Google

const CSV_URL_TASKS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1365016418&single=true&output=csv";

<script>
(function(){
"use strict";

/* ================= CSV parsing ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c=>c!==""));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = (r[i]!==undefined ? r[i].trim() : ""));
    return o;
  });
}
async function fetchCSV(url){
  const bust = url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now();
  const res = await fetch(bust, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  let text = await res.text();
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  return csvToObjects(text);
}

/* ================= Date parsing ================= */
function normalizeDate(s){
  if(!s) return null;
  s = s.trim().replace(/^"|"$/g,"");
  // ISO: 2026-06-19 or 2026/06/19
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  // D/M/Y or M/D/Y — ambiguous, resolve using validity (day<=31, month<=12)
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/);
  if(m){
    let a = parseInt(m[1],10), b = parseInt(m[2],10);
    const y = m[3];
    let day, month;
    if(a>12 && b<=12){ day=a; month=b; }               // must be D/M/Y
    else if(b>12 && a<=12){ day=b; month=a; }           // must be M/D/Y
    else { day=a; month=b; }                            // ambiguous -> assume D/M/Y (VN convention)
    if(month>=1 && month<=12 && day>=1 && day<=31){
      return y+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    }
  }
  return null;
}

/* ================= Build data model from sheet rows ================= */
function buildLessons(rows, subjMap, teachMap){
  const out = [];
  let id = 1;
  let skippedNoDate = 0, skippedNoCode = 0;
  rows.forEach(r=>{
    const rawDate = r["Ngày"] || r["Ngay"] || "";
    const date = normalizeDate(rawDate);
    const code = (r["Mã môn"]||r["Ma mon"]||"").trim();
    if(!date){ if(rawDate) skippedNoDate++; return; }
    if(!code){ skippedNoCode++; return; }
    const nhom = (r["Nhóm"]||r["Nhom"]||"").trim();
    const lop = (r["Lớp/Phòng"]||r["Lop/Phong"]||"").trim();
    let room = "";
    if(["P301","P303","P302"].includes(lop)) room = lop;
    else if(/quân nhu|quan nhu/i.test(nhom)) room = "QNhu";
    else if(/quân khí|quan khi/i.test(nhom)) room = "QKhi";
    else if(/tài chính|tai chinh/i.test(nhom) || /tài chính|tai chinh/i.test(lop)) room = "TChinh";
    else room = "QY";

    const teacherCodeRaw = (r["Mã GV"]||r["Ma GV"]||"").trim();
    const subjFromMap = subjMap[code.toLowerCase()];
    const teachFromMap = teacherCodeRaw ? teachMap[teacherCodeRaw.toLowerCase()] : null;
    const sheetSubjectName = (r["Tên môn học"]||r["Ten mon hoc"]||"").trim();
    const sheetTeacherName = (r["Tên giáo viên"]||r["Ten giao vien"]||"").trim();
    const looksLikeError = (t)=> /^#|chưa có trong danh mục/i.test(t||"");

    out.push({
      id: id++,
      date,
      period: (r["Tiết"]||r["Tiet"]||"").trim(),
      room,
      code,
      subject: (subjFromMap && subjFromMap.name) || (!looksLikeError(sheetSubjectName) && sheetSubjectName) || code,
      teacherCode: teacherCodeRaw || null,
      teacher: (teachFromMap && teachFromMap.name) || (!looksLikeError(sheetTeacherName) && sheetTeacherName) || null,
      location: (r["Địa điểm / Ghi chú"]||r["Dia diem / Ghi chu"]||"").trim(),
      isHoliday: code === "NGHI_LE" || /nghỉ lễ/i.test(sheetSubjectName),
    });
  });
  return {lessons: out, skippedNoDate, skippedNoCode};
}
function buildCatalogMap(rows, codeKeys, nameKeys, extra){
  const map = {};
  rows.forEach(r=>{
    let code = "", name = "";
    for(const k of codeKeys){ if(r[k]){ code=r[k].trim(); break; } }
    for(const k of nameKeys){ if(r[k]){ name=r[k].trim(); break; } }
    if(code) map[code.toLowerCase()] = {code, name};
  });
  return map;
}
function buildSubjects(rows){
  return buildCatalogMap(rows, ["Mã môn","Ma mon"], ["Tên bài / môn học","Tên môn học","Ten bai / mon hoc"]);
}
function buildTeachers(rows){
  const map = buildCatalogMap(rows, ["Mã GV","Ma GV"], ["Tên giáo viên","Ten giao vien"]);
  return Object.values(map);
}

/* ================= Constants ================= */
const TRACKS = [
  {key:"P301", label:"Quân y · L1 (P301)"},
  {key:"P303", label:"Quân y · L2 (P303)"},
  {key:"P302", label:"Quân y · L3 (P302)"},
  {key:"QY", label:"Quân y"},
  {key:"QNhu", label:"Quân nhu"},
  {key:"QKhi", label:"Quân khí"},
  {key:"TChinh", label:"Tài chính"},
];
const QUAN_Y = ["P301","P302","P303","QY"];
const SHORT_GROUP = {QY:"Q.y", QNhu:"Q.n", QKhi:"Q.k", TChinh:"T.c"};
const SLOTS = [
  {key:"s1", periods:["1-3","2-3"]},
  {key:"s2", periods:["4-5"]},
  {key:"s3", periods:["6-8"]},
];
function slotOf(period){ return SLOTS.find(s=>s.periods.includes(period)) || SLOTS[0]; }
function trackVar(key){ return {P301:"p301", P303:"p301", P302:"p301", QY:"p301", QNhu:"nhu", QKhi:"khi", TChinh:"p303"}[key] || "p301"; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtVN(iso){ if(!iso) return ""; const d=parseISO(iso); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function mondayOf(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return toISO(d); }
function weekdayNameOf(iso){ const d=parseISO(iso); const names=["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"]; return names[d.getDay()]; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function periodStart(p){ return parseInt(String(p).split("-")[0],10) || 0; }
function sortLessons(a,b){ const pa=periodStart(a.period), pb=periodStart(b.period); if(pa!==pb) return pa-pb; return TRACKS.findIndex(t=>t.key===a.room)-TRACKS.findIndex(t=>t.key===b.room); }
const TODAY = todayISO();

let lessons = [];
let teachers = [];
let IDX = {byDate:{}, MIN_DATE:null, MAX_DATE:null};
function reindex(){
  const byDate = {}; let MIN_DATE=null, MAX_DATE=null;
  lessons.forEach(l=>{
    (byDate[l.date] = byDate[l.date] || []).push(l);
    if(!MIN_DATE || l.date<MIN_DATE) MIN_DATE=l.date;
    if(!MAX_DATE || l.date>MAX_DATE) MAX_DATE=l.date;
  });
  IDX = {byDate, MIN_DATE, MAX_DATE};
}

const state = {
  tab:"week", teacher:"", selectedDay:null,
  weekAnchor: TODAY, monthAnchor: TODAY.slice(0,7)+"-01",
  pinOpen: localStorage.getItem("pinOpen") !== "0",
  taskDate: TODAY, openSlots: {}, pinLessons: false, weekDay: null, slideDir: 0,
  tool: {teacher:"", group:"", from:"", to:""},
};

/* ================= Toast ================= */
let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);

/* ================= Theme ================= */
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme(localStorage.getItem("theme") || "");
document.getElementById("themeBtn").addEventListener("click", ()=>{
  document.documentElement.classList.add("theming"); setTimeout(()=>document.documentElement.classList.remove("theming"),450);
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
  applyTheme(next);
  try{ localStorage.setItem("theme", next); }catch(e){}
});

/* ================= Status panel (loading / setup / error) ================= */
function showStatus(kind, html){
  const el = document.getElementById("statusArea");
  el.innerHTML = "<div class='status-panel "+(kind||"")+"'>"+html+"</div>";
}
function clearStatus(){ document.getElementById("statusArea").innerHTML = ""; }
function isConfigured(){
  return CSV_URL_LESSONS && !CSV_URL_LESSONS.includes("PASTE_LINK") &&
         CSV_URL_SUBJECTS && !CSV_URL_SUBJECTS.includes("PASTE_LINK") &&
         CSV_URL_TEACHERS && !CSV_URL_TEACHERS.includes("PASTE_LINK");
}
function showSetupInstructions(){
  showStatus("setup",
    "<h3>Chưa kết nối dữ liệu</h3>" +
    "<p>Trang này cần 4 link CSV từ Google Sheet của Trưởng khoa. Mở file HTML này bằng trình soạn thảo văn bản, tìm phần <code>CẤU HÌNH</code> ở đầu &lt;script&gt; và dán 4 link đã lấy từ Google Sheet (File → Chia sẻ → Xuất bản lên web → chọn từng sheet → định dạng CSV) vào 4 biến:</p>" +
    "<ol><li><code>CSV_URL_LESSONS</code> — sheet \"Lich giang day\"</li>" +
    "<li><code>CSV_URL_SUBJECTS</code> — sheet \"DanhMucMonHoc\"</li>" +
    "<li><code>CSV_URL_TEACHERS</code> — sheet \"DanhMucGiaoVien\"</li></ol>"
  );
}
function showLoading(){
  showStatus("", "<div class='spinner'></div><p>Đang tải dữ liệu từ Google Sheet…</p>");
}
function showError(msg){
  showStatus("error",
    "<h3>Không tải được dữ liệu</h3><p>"+escapeHtml(msg)+"</p>" +
    "<p>Kiểm tra: link CSV đã được \"Xuất bản lên web\" đúng sheet chưa, và mạng có đang chặn docs.google.com không.</p>" +
    "<button class='btn btn-outline btn-sm' id='retryBtn'>Thử lại</button>"
  );
  const b = document.getElementById("retryBtn");
  if(b) b.addEventListener("click", loadAllData);
}

/* ================= Load data ================= */
async function loadAllData(){
  if(!isConfigured()){ showSetupInstructions(); return; }
  showLoading();
  document.getElementById("pinToday").style.display = "none";
  try{
    const [lessonRows, subjRows, teachRows] = await Promise.all([
      fetchCSV(CSV_URL_LESSONS), fetchCSV(CSV_URL_SUBJECTS), fetchCSV(CSV_URL_TEACHERS)
    ]);
    const subjMap = buildSubjects(subjRows);
    teachers = buildTeachers(teachRows);
    const teachMap = {}; teachers.forEach(t=>teachMap[t.code.toLowerCase()]=t);
    const built = buildLessons(lessonRows, subjMap, teachMap);
    lessons = built.lessons;
    reindex();
    clearStatus();
    document.getElementById("pinToday").style.display = "";
    const anchor = (IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE) ? TODAY : (IDX.MIN_DATE||TODAY);
    state.weekAnchor = mondayOf(anchor);
    state.weekDay = defaultWeekDay(state.weekAnchor);
    state.monthAnchor = anchor.slice(0,7)+"-01";
    refreshTeacherSelect();
    renderAll();
  }catch(err){
    showError(err.message || String(err));
  }
  await loadTasks();
}
async function loadTasks(){
  if(!CSV_URL_TASKS){ tasksStatus="nocfg"; tasks=[]; reindexTasks(); return; }
  tasksStatus = "loading";
  try{
    const rows = await fetchCSV(CSV_URL_TASKS);
    tasks = buildTasks(rows); reindexTasks(); tasksStatus = "ok";
  }catch(err){
    tasks = []; reindexTasks(); tasksStatus = "error"; tasksError = err.message || String(err);
  }
  renderAll();
}
document.getElementById("refreshBtn").addEventListener("click", loadAllData);

/* ================= Teacher select ================= */
function refreshTeacherSelect(){
  const sel = document.getElementById("teacherSelect");
  const cur = sel.value;
  sel.innerHTML = '<option value="">Tất cả GV</option>';
  teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'vi')).forEach(t=>{
    const opt=document.createElement("option"); opt.value=t.code; opt.textContent=t.name; sel.appendChild(opt);
  });
  sel.value = cur;
}
document.getElementById("teacherSelect").addEventListener("change", (e)=>{ state.teacher = e.target.value; renderAll(); });

/* ================= Chip + detail modal ================= */
const detailOverlay = document.getElementById("detailOverlay");
document.getElementById("detailClose").addEventListener("click", ()=>detailOverlay.classList.remove("show"));
detailOverlay.addEventListener("click", (e)=>{ if(e.target===detailOverlay) detailOverlay.classList.remove("show"); });

function openDetail(lesson){
  const body = document.getElementById("detailBody");
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  body.innerHTML = [
    ["Môn học", lesson.subject],
    ["Mã môn", lesson.code],
    ["Nhóm/Lớp", lesson.isHoliday ? "—" : (trackInfo?trackInfo.label:lesson.room)],
    ["Ngày", weekdayNameOf(lesson.date)+", "+fmtVN(lesson.date)],
    ["Tiết", lesson.period||"—"],
    ["Giáo viên", lesson.teacher || "Chưa rõ"],
    ["Địa điểm / Ghi chú", lesson.location || "—"],
  ].map(([k,v])=>"<div class='kv'><span class='k'>"+k+"</span><span class='v'>"+escapeHtml(v)+"</span></div>").join("");
  detailOverlay.classList.add("show");
}
function chipEl(lesson){
  const el = document.createElement("div");
  const trackClass = lesson.isHoliday ? "holiday" : "track-"+lesson.room;
  el.className = "chip " + trackClass;
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  const tagText = lesson.isHoliday ? "NGHỈ" : (SHORT_GROUP[groupOf(lesson)] || lesson.room);
  el.innerHTML =
    "<div class='chip-grid'>" +
    "<div class='chip-left'><div class='chip-top'><span class='chip-track-tag'>"+escapeHtml(tagText)+"</span>" +
    "<span class='chip-code'>tiết "+escapeHtml(lesson.period||"")+"</span></div>" +
    "<div class='chip-subject'>"+escapeHtml(lesson.isHoliday ? lesson.subject : lesson.code)+"</div></div>" +
    "<div class='chip-right'><span class='chip-teacher'>"+escapeHtml(lesson.teacher || (lesson.isHoliday? "" : "GV: chưa rõ"))+"</span>" +
    (lesson.location ? "<div class='chip-loc'>📍 "+escapeHtml(lesson.location)+"</div>" : "") + "</div></div>";
  if(state.teacher){
    if(lesson.teacherCode && lesson.teacherCode.toLowerCase() === state.teacher.toLowerCase()) el.classList.add("match");
    else el.classList.add("dim");
  }
  el.addEventListener("click", ()=>openDetail(lesson));
  return el;
}

/* ================= Legend ================= */
function renderLegend(){
  const lg = document.getElementById("legend");
  lg.style.display = "none";
  lg.innerHTML = "";
  return;
  lg.innerHTML = TRACKS.map(t=>"<span><span class='dot' style='background:var(--"+trackVar(t.key)+")'></span>"+t.label+"</span>").join("");
}

/* ================= Pinned today ================= */
function nextLessonFrom(iso){
  const dates = Object.keys(IDX.byDate).filter(d=>d>iso).sort();
  for(const d of dates){ if(IDX.byDate[d].length) return IDX.byDate[d].slice().sort(sortLessons)[0]; }
  return null;
}
function taskCountFor(dateIso){ return (TASKIDX[dateIso]||[]).length; }
function renderPin(){
  const inRange = IDX.MIN_DATE && TODAY >= IDX.MIN_DATE && TODAY <= IDX.MAX_DATE;
  const todays = (IDX.byDate[TODAY] || []).slice().sort(sortLessons);
  const nT = taskCountFor(TODAY);
  const body = document.getElementById("pinBody");
  const pd = document.getElementById("pinDate");
  if(pd){ const td=parseISO(TODAY); pd.innerHTML = "<span class='pd-tag'>Hôm nay</span><span class='pd-wd'>"+weekdayNameOf(TODAY)+"</span><span class='pd-dd'>"+String(td.getDate()).padStart(2,"0")+"</span><span class='pd-mm'>Tháng "+(td.getMonth()+1)+" · "+td.getFullYear()+"</span>"; }
  body.innerHTML = "";
  if(nT){
    const tl = document.createElement("div"); tl.className="task-list";
    TASKIDX[TODAY].forEach((t,i)=>tl.appendChild(taskItemEl(t,i)));
    body.appendChild(tl);
  } else {
    const p = document.createElement("div"); p.className="pin-empty";
    p.textContent = tasksStatus==="nocfg" ? "Chưa kết nối sheet công việc." : "Hôm nay chưa có công việc nào được ghi.";
    body.appendChild(p);
  }
  if(inRange){
    const line = document.createElement("div"); line.className = "pin-lessons" + (todays.length ? "" : " none");
    line.innerHTML = todays.length
      ? "<span class='pl-ico'>📚</span><span class='pl-txt'><b>" + todays.length + "</b> buổi học</span>"
      : "<span class='pl-ico'>📚</span><span class='pl-txt'>Không có buổi học</span>";
    const head = document.getElementById("pinHead");
    const old = head.querySelector(".pin-lessons"); if(old) old.remove();
    head.appendChild(line);
  }
  const linkBtn = document.createElement("button");
  linkBtn.className = "pin-tasklink";
  linkBtn.textContent = "Xem tất cả";
  linkBtn.setAttribute("aria-label","Xem tất cả công việc");
  linkBtn.addEventListener("click", (e)=>{ e.stopPropagation(); state.taskDate=TODAY; document.querySelector('.tab[data-tab="tasks"]').click(); });
  const lastBody = body.querySelector(".task-item:last-child .task-body");
  if(lastBody){
    const row = document.createElement("div"); row.className = "pin-noterow";
    const note = lastBody.querySelector(".task-note");
    if(note) row.appendChild(note);
    row.appendChild(linkBtn);
    lastBody.appendChild(row);
  } else {
    body.appendChild(linkBtn);
  }
}

  const anchor = (IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE) ? TODAY : (IDX.MIN_DATE||TODAY);
  state.weekAnchor = mondayOf(anchor); state.weekDay = defaultWeekDay(state.weekAnchor); state.monthAnchor = anchor.slice(0,7)+"-01"; state.selectedDay = anchor; state.taskDate = TODAY;

  requestAnimationFrame(()=>{
    let target = null;
    if(state.tab === "week") target = document.querySelector("#view-week .day-card.is-today") || document.querySelector("#view-week .bar");

    const hdr = document.querySelector("header.top");
    const offset = (hdr ? hdr.offsetHeight : 0) + 10;
    const top = target.getBoundingClientRect().top + (window.scrollY || 0) - offset;
    window.scrollTo({top:Math.max(0, top), behavior:"smooth"});
  });
});

/* ================= Week view ================= */
function lessonColor(l){ return l.isHoliday ? "red" : trackVar(l.room); }
function weekDaysOf(anchor){ return [0,1,2,3,4].map(i=>addDays(anchor,i)); }
function defaultWeekDay(anchor){ return weekDaysOf(anchor).includes(TODAY) ? TODAY : null; }
function animIn(el, dir){
  if(!el || !el.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  el.animate([{opacity:0, transform:"translate3d("+(dir*28)+"px,"+(dir?0:10)+"px,0) scale(.99)"},{opacity:1, transform:"none"}],

/* ================= Cong viec theo ngay (doc tu Google Sheet, chi xem) ================= */
let tasks = [];
let TASKIDX = {};
let tasksStatus = CSV_URL_TASKS ? "loading" : "nocfg";   // loading | ok | error | nocfg
let tasksError = "";
/* Ngày trong sheet CongViec bị lẫn kiểu: có ô là ngày thật bị đảo ngày/tháng
   (vd hiển thị 9/10/2026 nhưng giá trị là 10/09), có ô là chữ dạng M/D/Y (10/13/2026).
   Vì công việc được ghi theo thứ tự thời gian, ngày nào mơ hồ (cả hai số đều <= 12)
   sẽ được chọn cách hiểu khớp nhất với các dòng trước/sau. */
function dateCandidates(s){
  if(!s) return [];
  s = s.trim().replace(/^"|"$/g,"");
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return [m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0")];
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/);
  if(!m) return [];
  const a = +m[1], b = +m[2], y = m[3];
  const mk = (d,mo)=> (mo>=1&&mo<=12&&d>=1&&d<=31) ? y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0") : null;
  const out = [mk(a,b), mk(b,a)].filter(Boolean);   // [D/M, M/D]
  return [...new Set(out)];
}
function dayDiff(x,y){ return Math.abs(parseISO(x)-parseISO(y))/86400000; }
function buildTasks(rows){
  const raw = [];
  rows.forEach(r=>{
    const title = (r["Nội dung công việc"]||r["Noi dung cong viec"]||"").trim();
    const cands = dateCandidates(r["Ngày"]||r["Ngay"]||"");
    if(!cands.length || !title) return;
    raw.push({cands, title,
      people: (r["Thành phần"]||r["Thanh phan"]||"").trim(),
      note: (r["Ghi chú"]||r["Ghi chu"]||"").trim()});
  });
  // Ngày chắc chắn (chỉ có 1 cách hiểu) làm mốc
  const fixed = raw.map(x=> x.cands.length===1 ? x.cands[0] : null);
  const out = [];
  raw.forEach((x,i)=>{
    let date = x.cands[0];
    if(x.cands.length > 1){
      let prev = null, next = null;
      for(let j=i-1;j>=0;j--){ if(out[j]){ prev = out[j].date; break; } }
      for(let j=i+1;j<raw.length;j++){ if(fixed[j]){ next = fixed[j]; break; } }
      const score = c => {
        let sc = 0;
        if(prev && c < prev) sc += 1000;          // không được lùi về trước dòng trên
        if(next && c > next) sc += 1000;          // không được vượt dòng dưới
        if(next) sc += dayDiff(c,next); else if(prev) sc += dayDiff(c,prev);
        return sc;
      };
      date = x.cands.slice().sort((p,q)=>score(p)-score(q))[0];
    }
    out[i] = {date, title:x.title, people:x.people, note:x.note};
  });
  return out.filter(Boolean);
}
function reindexTasks(){
  TASKIDX = {};
  tasks.forEach(t=>{ (TASKIDX[t.date] = TASKIDX[t.date] || []).push(t); });
}

function urgencyOf(iso){
  const n = Math.round((parseISO(iso) - parseISO(TODAY)) / 86400000);
  return n < 0 ? "past" : n === 0 ? "now" : n === 1 ? "soon" : n <= 3 ? "near" : "far";
}
function taskCardEl(iso, list, opt){
  const d = parseISO(iso);
  const el = document.createElement("div");
  el.className = "tcard u-" + urgencyOf(iso) + (opt.current ? " is-current" : "");
  let h = "<div class='tc-date'><span class='tc-wd'>"+["CN","T2","T3","T4","T5","T6","T7"][d.getDay()]+"</span><span class='tc-dd'>"+String(d.getDate()).padStart(2,"0")+"</span><span class='tc-mm'>Th "+(d.getMonth()+1)+"</span></div>";
  h += "<div class='tc-body'><div class='tc-head'><span class='tc-full'>"+escapeHtml(weekdayNameOf(iso)+", "+fmtVN(iso))+"</span>"+countdownHtml(iso)+"</div>";
  list.forEach((t,i)=>{
    h += "<div class='tc-task'>" + (list.length>1 ? "<span class='tc-idx'>"+(i+1)+"</span>" : "") + "<div class='tc-main'><div class='tc-title'>"+escapeHtml(t.title)+"</div>";
    if(t.people || t.note){
      h += "<div class='tc-tags'>";
      if(t.people) h += "<span class='tc-tag who' title='Thành phần'>"+ICON.people+"<span>"+escapeHtml(t.people)+"</span></span>";
      if(t.note) h += "<span class='tc-tag note' title='Ghi chú'>"+ICON.note+"<span>"+escapeHtml(t.note)+"</span></span>";
      h += "</div>";
    }
    h += "</div></div>";
  });
  el.innerHTML = h + "</div>";
  return el;
}
function countdownHtml(iso){
  const n = Math.round((parseISO(iso) - parseISO(TODAY)) / 86400000);
  if(n < 0) return "";
  const cls = n === 0 ? "cd now" : (n === 1 ? "cd soon" : (n <= 3 ? "cd near" : "cd"));
  const txt = n === 0 ? "Hôm nay" : (n === 1 ? "Ngày mai" : "Còn " + n + " ngày");
  return "<span class='" + cls + "'>" + txt + "</span>";
}

const GROUPS = [
  {key:"QY", label:"Q.y", v:"p301"}, {key:"QNhu", label:"Q.n", v:"nhu"},
  {key:"QKhi", label:"Q.k", v:"khi"}, {key:"TChinh", label:"T.c", v:"p303"},
];
function groupOf(l){ return QUAN_Y.includes(l.room) ? "QY" : l.room; }
function groupLabel(l){ const g = GROUPS.find(x=>x.key===groupOf(l)); return g ? g.label : (l.room||"—"); }
function periodCount(p){
  const m = String(p||"").match(/(\d+)\s*-\s*(\d+)/);
  if(m) return Math.max(1, (+m[2]) - (+m[1]) + 1);
  return p ? 1 : 0;
}
function teacherNameOf(code){ const t = teachers.find(x=>x.code.toLowerCase()===String(code).toLowerCase()); return t ? t.name : code; }
function toolData(){
  const f = state.tool;
  const rows = lessons.filter(l=>{
    if(l.isHoliday) return false;
    if(f.teacher && !(l.teacherCode && l.teacherCode.toLowerCase()===f.teacher.toLowerCase())) return false;
    if(f.group && groupOf(l)!==f.group) return false;
    if(f.from && l.date<f.from) return false;
    if(f.to && l.date>f.to) return false;
    return true;
  }).sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : sortLessons(a,b));
  const sumP = rows.reduce((s,l)=>s+periodCount(l.period),0);
  const days = new Set(rows.map(l=>l.date)).size;
  const byT = {};
  rows.forEach(l=>{ const k=l.teacher||"Chưa rõ"; const o = byT[k] || (byT[k]={name:k,n:0,p:0,d:new Set()}); o.n++; o.p+=periodCount(l.period); o.d.add(l.date); });
  const tRows = Object.values(byT).sort((a,b)=> b.p-a.p || a.name.localeCompare(b.name,"vi"));
  const gRows = GROUPS.map(g=>{
    const rs = rows.filter(l=>groupOf(l)===g.key);
    return {key:g.key, label:g.label, v:g.v, n:rs.length, p:rs.reduce((s,l)=>s+periodCount(l.period),0)};
  });
  const gl = f.group ? (GROUPS.find(g=>g.key===f.group)||{}).label : "Tất cả";
  const filterText = [
    "Giáo viên: " + (f.teacher ? teacherNameOf(f.teacher) : "Tất cả"),
    "Ngành: " + gl,
    "Thời gian: " + ((f.from||f.to) ? ((f.from?fmtVN(f.from):"…") + " – " + (f.to?fmtVN(f.to):"…")) : "Toàn bộ"),
  ].join("  ·  ");
  return {rows, sumP, days, tRows, gRows, filterText, nTeachers: tRows.filter(t=>t.name!=="Chưa rõ").length};
}

function countUp(scope){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  scope.querySelectorAll(".stat-num[data-n]").forEach(el=>{
    const target = +el.dataset.n; if(!isFinite(target) || target<=0) return;
    const t0 = performance.now(), dur = 700;
    const step = (t)=>{ const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(target*e); if(k<1) requestAnimationFrame(step); };
    el.textContent = "0"; requestAnimationFrame(step);
  });
}
/* ---- Mật khẩu xuất PDF ---- */
const PDF_PASS_HASH = "919261ba";
function passHash(str){ let h = 0x811c9dc5; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }
function pdfUnlocked(){ try{ return sessionStorage.getItem("pdfOK") === PDF_PASS_HASH; }catch(e){ return false; } }
function requestPdfExport(){
  if(!toolData().rows.length){ toast("Không có dữ liệu để xuất"); return; }
  if(pdfUnlocked()){ exportToolsPDF(); return; }
  const ov = document.getElementById("pwOverlay"), inp = document.getElementById("pwInput"), err = document.getElementById("pwErr"), box = ov.querySelector(".pw-modal");
  inp.value = ""; err.textContent = ""; ov.classList.add("show");
  setTimeout(()=>inp.focus(), 60);
  const close = ()=>{ ov.classList.remove("show"); cleanup(); };
  const submit = ()=>{
    if(passHash(inp.value.trim()) === PDF_PASS_HASH){
      try{ sessionStorage.setItem("pdfOK", PDF_PASS_HASH); }catch(e){}
      close(); toast("Đã mở khóa xuất PDF"); exportToolsPDF();
    } else {
      err.textContent = "Mật khẩu không đúng, vui lòng thử lại.";
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      inp.select();
    }
  };
  const onKey = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } else if(e.key==="Escape") close(); };
  const onBg = (e)=>{ if(e.target===ov) close(); };
  const okB = document.getElementById("pwOk"), noB = document.getElementById("pwCancel");
  function cleanup(){ inp.removeEventListener("keydown",onKey); ov.removeEventListener("click",onBg); okB.removeEventListener("click",submit); noB.removeEventListener("click",close); }
  inp.addEventListener("keydown",onKey); ov.addEventListener("click",onBg); okB.addEventListener("click",submit); noB.addEventListener("click",close);
}
function exportToolsPDF(){
  const d = toolData(), f = state.tool;
  if(!d.rows.length){ toast("Không có dữ liệu để xuất"); return; }
  const now = new Date(), pad = n=>String(n).padStart(2,"0");
  const stamp = pad(now.getDate())+"/"+pad(now.getMonth()+1)+"/"+now.getFullYear()+" "+pad(now.getHours())+":"+pad(now.getMinutes());
  const GC = {QY:"#16A34A", QNhu:"#DB2777", QKhi:"#7C3AED", TChinh:"#D97706"};
  const one = !!f.teacher;
  const tName = one ? teacherNameOf(f.teacher) : "Tất cả giáo viên";
  const gl = f.group ? (GROUPS.find(g=>g.key===f.group)||{}).label : "Tất cả";
  const period = (f.from||f.to) ? ((f.from?fmtVN(f.from):"…")+" – "+(f.to?fmtVN(f.to):"…")) : "Toàn bộ ("+fmtVN(d.rows[0].date)+" – "+fmtVN(d.rows[d.rows.length-1].date)+")";
  const stat = (n,l,k)=>"<div class='pr-stat "+k+"'><b>"+n+"</b><span>"+l+"</span></div>";
  const gtag = (key,label)=>"<span class='gtag' style='background:"+(GC[key]||"#5B7B80")+"'>"+escapeHtml(label)+"</span>";
  let h =
    "<div class='pr-band'><div><h1>LỊCH GIẢNG DẠY</h1><div class='pr-sub'>Báo cáo thống kê giờ giảng</div></div><span class='pr-org'>K.CMKT/TQS</span></div>" +
    "<div class='pr-who'><div class='pr-label'>Giáo viên</div><div class='pr-name'>"+escapeHtml(tName)+"</div>" +
    "<div class='pr-meta'><span>Ngành: <b>"+escapeHtml(gl)+"</b></span><span>Thời gian: <b>"+escapeHtml(period)+"</b></span></div></div>" +
    "<div class='pr-stats'>"+stat(d.rows.length,"Số buổi dạy","s1")+stat(d.sumP,"Tổng số tiết","s2")+stat(d.days,"Số ngày có lịch","s3")+(one?"":stat(d.nTeachers,"Số giáo viên","s4"))+"</div>";
  if(!one){
    const mx = Math.max(1,...d.tRows.map(t=>t.p));
    h += "<h2>Thống kê theo giáo viên</h2><table><thead><tr><th class='ctr' style='width:34px'>STT</th><th>Giáo viên</th><th class='ctr'>Số buổi</th><th class='ctr'>Số tiết</th><th class='ctr'>Số ngày</th><th style='width:28%'>Tỷ lệ tiết</th></tr></thead><tbody>" +
      d.tRows.map((t,i)=>"<tr"+(i%2?" class='alt'":"")+"><td class='ctr'>"+(i+1)+"</td><td><b>"+escapeHtml(t.name)+"</b></td><td class='ctr'>"+t.n+"</td><td class='ctr'><b>"+t.p+"</b></td><td class='ctr'>"+t.d.size+"</td><td><div class='pbar'><i style='width:"+(t.p/mx*100)+"%; background:#0E8C8A'></i></div></td></tr>").join("") + "</tbody></table>";
  }
  const gTot = Math.max(1, d.sumP);
  h += "<h2>Thống kê theo ngành</h2><table><thead><tr><th>Ngành</th><th class='ctr'>Số buổi</th><th class='ctr'>Số tiết</th><th class='ctr'>Tỷ lệ</th><th style='width:32%'></th></tr></thead><tbody>" +
    d.gRows.map((g,i)=>"<tr class='"+(i%2?"alt":"")+(g.p?"":" zero")+"'><td>"+gtag(g.key,g.label)+"</td><td class='ctr'>"+g.n+"</td><td class='ctr'><b>"+g.p+"</b></td><td class='ctr'>"+Math.round(g.p/gTot*100)+"%</td><td><div class='pbar'><i style='width:"+(g.p/gTot*100)+"%; background:"+GC[g.key]+"'></i></div></td></tr>").join("") + "</tbody></table>";
  let lastDate = "", dayIdx = -1;
  h += "<h2>Lịch dạy chi tiết <small>("+d.rows.length+" buổi · "+d.sumP+" tiết)</small></h2><table><thead><tr><th class='ctr' style='width:30px'>STT</th><th>Ngày</th><th class='ctr'>Tiết</th><th class='ctr'>Số tiết</th><th>Ngành</th><th>Ký hiệu môn</th><th>Tên môn học</th>"+(one?"":"<th>Giáo viên</th>")+"<th>Địa điểm</th></tr></thead><tbody>" +
    d.rows.map((l,i)=>{
      const nd = l.date !== lastDate; if(nd){ dayIdx++; lastDate = l.date; }
      const cls = [(dayIdx%2?"alt":""),(nd && i?"newday":"")].join(" ").trim();
      return "<tr"+(cls?" class='"+cls+"'":"")+"><td class='ctr'>"+(i+1)+"</td><td class='dt'>"+(nd?escapeHtml(weekdayNameOf(l.date)+", "+fmtVN(l.date)):"")+"</td><td class='ctr'>"+escapeHtml(l.period||"–")+"</td><td class='ctr'>"+periodCount(l.period)+"</td><td>"+gtag(groupOf(l),groupLabel(l))+"</td><td class='code'>"+escapeHtml(l.code)+"</td><td>"+escapeHtml(l.subject && l.subject!==l.code ? l.subject : "–")+"</td>"+(one?"":"<td>"+escapeHtml(l.teacher||"Chưa rõ")+"</td>")+"<td>"+escapeHtml(l.location||"–")+"</td></tr>";
    }).join("") + "</tbody></table>";
  h += "<div class='pr-sign'><div><i>Ngày ..... tháng ..... năm "+now.getFullYear()+"</i><b>NGƯỜI LẬP</b></div></div>";
  h += "<div class='pr-foot'>Xuất từ Lịch công tác K.CMKT/TQS lúc "+stamp+"</div>";
  document.getElementById("printArea").innerHTML = h;
  const oldTitle = document.title;
  document.title = "Lich-giang-day-" + (one ? tName.replace(/[^\p{L}\p{N}]+/gu,"-") + "-" : "") + TODAY;
  const restore = ()=>{ document.title = oldTitle; window.removeEventListener("afterprint", restore); };
  window.addEventListener("afterprint", restore);
  setTimeout(()=>window.print(), 150);
}

/* ================= Orchestrator ================= */
function setTabIndicator(){
  const tabs = [...document.querySelectorAll(".tab")];
  const i = Math.max(0, tabs.findIndex(t=>t.dataset.tab===state.tab));
  const nav = document.querySelector("nav.tabs"); if(nav) nav.style.setProperty("--ti", i);
}
function updateTaskTabLabel(){
  const n = (typeof taskCountFor === "function" && tasksStatus === "ok") ? taskCountFor(TODAY) : 0;
  const tab = document.querySelector('.tab[data-tab="tasks"]');
  const b = document.getElementById("taskBadge"); if(b) b.textContent = n ? String(n) : "";
}
function renderAll(){
  document.body.dataset.tab = state.tab;
  setTabIndicator();
  updateTaskTabLabel();
  renderLegend();
  renderPin();
  if(state.tab==="week") renderWeek();
  if(state.tab==="month") renderMonth();
  if(state.tab==="tasks") renderTasks();
  if(state.tab==="tools") renderTools();
}

/* ================= Header: ẩn thanh công cụ khi cuộn xuống ================= */
(function(){
  const hdr = document.querySelector("header.top"), wrap = document.getElementById("toolbarWrap");
  if(!hdr || !wrap) return;
  let hidden = false, busy = false, lastY = window.scrollY || 0, busyTimer = null;
  function measure(){ if(hidden || busy) return; document.documentElement.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); }
  function setHidden(v){
    if(v === hidden) return;
    hidden = v; busy = true;
    wrap.classList.toggle("is-hidden", hidden);
    clearTimeout(busyTimer);
    busyTimer = setTimeout(()=>{ busy = false; measure(); }, 340);
  }
  window.addEventListener("scroll", ()=>{
    const y = Math.max(0, window.scrollY || 0), dy = y - lastY;
    if(Math.abs(dy) < 6) return;
    lastY = y;
    if(y <= 24 || dy < 0) setHidden(false);
    else if(y > 120 && dy > 0 && document.activeElement !== document.getElementById("teacherSelect")) setHidden(true);
  }, {passive:true});
  window.addEventListener("resize", ()=>{ setHidden(false); setTimeout(measure, 360); });
  if(window.ResizeObserver) new ResizeObserver(measure).observe(hdr);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();
})();

/* ================= Đồng hồ số ================= */
(function(){
  const t = document.getElementById("clockTime"), d = document.getElementById("clockDate");
  if(!t || !d) return;
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const now = new Date();
    t.innerHTML = pad(now.getHours()) + '<span class="colon">:</span>' + pad(now.getMinutes()) + '<span class="colon">:</span>' + pad(now.getSeconds());
    d.textContent = weekdayNameOf(toISO(now)) + ", " + pad(now.getDate()) + "/" + pad(now.getMonth()+1);
  }
  tick();
  setInterval(tick, 1000);
})();

loadAllData();

})();
</script>
