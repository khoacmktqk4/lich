<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lịch công tác — K.CMKT/TQS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif; --font-num:'Chakra Petch','Be Vietnam Pro',sans-serif;
  --ink:#0C1A2E; --ink-2:#37475E; --muted:#68788F; --paper:#EDF1F8; --paper-2:#E1E8F3; --card:#FFFFFF; --line:#D3DCEA; --line-soft:#E5EBF4;
  --brand:#0A1A3A; --brand-2:#17357A; --hl:#3F4FD8; --on-hl:#fff; --hl-soft:#E6E9FC; --task-soft:#EEF0FD; --grid:rgba(63,79,216,.05);
  --amber:#FFB020; --gold:#B86E00; --gold-soft:#FFF0D2;
  --p301:#0E9F76; --p301-soft:#DDF5EC; --p302:#0A8FC2; --p302-soft:#D9F0FA; --p303:#D48806; --p303-soft:#FDF0D0;
  --nhu:#DC3F7C; --nhu-soft:#FBDFEA; --khi:#8B4FE6; --khi-soft:#EBE2FC; --red:#D93A31; --red-soft:#FCE0DD;
  --shadow:0 1px 2px rgba(12,26,46,.05),0 6px 18px rgba(12,26,46,.07); --shadow-lg:0 14px 34px rgba(12,26,46,.16);
  --radius-s:12px; --radius-m:18px; --ease:cubic-bezier(.22,.8,.24,1); --hdr-h:150px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E7EDF8; --ink-2:#BCC8DA; --muted:#8A9AB2; --paper:#070D1A; --paper-2:#101A2E; --card:#0E1627; --line:#1F2D47; --line-soft:#162239;
  --brand:#050C1D; --brand-2:#11265A; --hl:#8E9BFF; --on-hl:#0A1030; --hl-soft:#1A2150; --task-soft:#141C3A; --grid:rgba(142,155,255,.05);
  --gold:#FFB84D; --gold-soft:#35260C; --p301:#34D399; --p302:#38BDF8; --p303:#FBBF24; --nhu:#F472B6; --khi:#B18CFF; --red:#F87171;
  --p301-soft:#0F2C26; --p302-soft:#0F2A3A; --p303-soft:#33290F; --nhu-soft:#35172A; --khi-soft:#251F47; --red-soft:#3A1A1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 14px 34px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{
  --ink:#E7EDF8; --ink-2:#BCC8DA; --muted:#8A9AB2; --paper:#070D1A; --paper-2:#101A2E; --card:#0E1627; --line:#1F2D47; --line-soft:#162239;
  --brand:#050C1D; --brand-2:#11265A; --hl:#8E9BFF; --on-hl:#0A1030; --hl-soft:#1A2150; --task-soft:#141C3A; --grid:rgba(142,155,255,.05);
  --gold:#FFB84D; --gold-soft:#35260C; --p301:#34D399; --p302:#38BDF8; --p303:#FBBF24; --nhu:#F472B6; --khi:#B18CFF; --red:#F87171;
  --p301-soft:#0F2C26; --p302-soft:#0F2A3A; --p303-soft:#33290F; --nhu-soft:#35172A; --khi-soft:#251F47; --red-soft:#3A1A1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 14px 34px rgba(0,0,0,.55);}

/* ===== Nền & chữ ===== */
*{box-sizing:border-box;}
html{height:100%; scroll-behavior:smooth; scroll-padding-top:calc(var(--hdr-h) + 10px);}
html.theming *{transition:background-color .35s,color .35s,border-color .35s,box-shadow .35s !important;}
body{margin:0; min-height:100%; padding-top:var(--hdr-h); color:var(--ink); font:15px/1.5 var(--font); letter-spacing:-.003em; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px, linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px, var(--paper);}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:-.02em;}
button{font-family:var(--font); cursor:pointer;}
::selection{background:var(--hl); color:var(--on-hl);}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px;}

/* ===== Header ===== */
header.top{position:fixed; top:0; left:0; right:0; z-index:40; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2)); border-bottom:1px solid #ffffff1f; box-shadow:0 10px 30px rgba(10,26,58,.28);}
header.top::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/22px 22px, linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/22px 22px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 75%); mask-image:linear-gradient(90deg,transparent,#000 75%);}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1080px; margin:0 auto 10px;}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto;}
.brand-logo{flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(145deg,#ffffff38,#ffffff0d); border:1px solid #ffffff33;}
.brand-logo svg{width:22px; height:22px;}
.brand-text{min-width:0;}
.brand-eyebrow{font-size:11.5px; font-weight:500; color:#B3C2EA; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand h1{font-size:18px; line-height:1.15; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand h1 .yr{color:var(--amber);}
.clock{flex:none; text-align:right; padding:6px 12px 5px; border-radius:14px; background:#ffffff14; border:1px solid #ffffff26;}
.clock-time{font:700 22px/1.1 var(--font-num); letter-spacing:.04em; color:#fff; white-space:nowrap;}
.clock-time .colon{color:var(--amber); animation:blink 1s steps(1,end) infinite;}
.clock-date{font-size:10.5px; color:#B3C2EA; margin-top:2px; white-space:nowrap;}
@keyframes blink{50%{opacity:.25;}}
.toolbar-wrap{display:grid; grid-template-rows:1fr; max-width:1080px; margin:0 auto; transition:grid-template-rows .3s var(--ease),opacity .22s ease;}
.toolbar-wrap.is-hidden{grid-template-rows:0fr; opacity:0; pointer-events:none;}
.toolbar{display:flex; align-items:center; gap:8px; min-height:0; overflow:hidden; padding:2px;}
select.sel{flex:0 1 210px; min-width:0; height:34px; padding:0 12px; text-overflow:ellipsis; font:600 13px var(--font); color:#fff; background:#ffffff1a; border:1px solid #ffffff30; border-radius:12px;}
select.sel option{color:#0C1A2E; background:#fff;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; min-height:34px; padding:0 13px; font:600 13px var(--font); border-radius:12px; border:1px solid transparent; transition:transform .2s var(--ease),background .2s,box-shadow .2s;}
.btn:active,.iconbtn:active{transform:scale(.94);}
.btn-ghost{background:#ffffff1a; color:#fff; border-color:#ffffff30;}
.btn-ghost:hover{background:#ffffff2e;}
.btn-gold{background:var(--amber); color:#2B1A00;}
.btn-outline{background:var(--card); color:var(--ink); border-color:var(--line);}
.btn-sm{min-height:32px; font-size:12px; padding:0 12px;}
#refreshBtn,#themeBtn{width:40px; padding:0; font-size:15px;}

nav.tabs{display:flex; gap:4px; max-width:1080px; margin:10px auto 0; padding:4px; border-radius:14px; background:#00000040; border:1px solid #ffffff1a;}
.tab{flex:1; padding:9px 6px; font:700 13.5px var(--font); color:#C3D0F0; background:transparent; border:none; border-radius:11px; white-space:nowrap; transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--ease);}
.tab:active{transform:scale(.96);}
.tab[aria-selected="true"]{background:#fff; color:var(--brand); box-shadow:0 4px 14px rgba(0,0,0,.25);}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}}

/* ===== Khung chính ===== */
main{max-width:1080px; margin:0 auto; padding:16px 14px 60px;}
footer{max-width:1080px; margin:0 auto; padding:0 14px 110px; color:var(--muted); font-size:12px;}
.status-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; margin-bottom:16px; box-shadow:var(--shadow);}
.status-panel h3{font-size:15px; margin-bottom:6px;}
.status-panel p{font-size:13.5px; color:var(--muted); line-height:1.6; margin:0 0 8px;}
.status-panel ol{margin:8px 0 0; padding-left:20px; font-size:13px; line-height:1.8;}
.status-panel code{background:var(--paper-2); padding:1px 6px; border-radius:5px; font-size:12px;}
.status-panel.error{border-color:var(--red);} .status-panel.setup{border-color:var(--amber);}
.spinner{width:22px; height:22px; margin-bottom:10px; border:3px solid var(--line); border-top-color:var(--hl); border-right-color:var(--amber); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== Ô "Hôm nay" ===== */
body:not([data-tab="week"]) #pinToday{display:none !important;}
.pin{position:relative; overflow:hidden; margin-bottom:16px; padding:14px; color:#fff; border-radius:22px; border:1px solid #ffffff1f; box-shadow:0 16px 36px rgba(10,26,58,.3);
  background:radial-gradient(120% 140% at 100% 0%,#4F63FF55,transparent 55%),linear-gradient(150deg,var(--brand-2),var(--brand));}
.pin::before{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/22px 22px;}
.pin > *{position:relative;}
.pin-head,.pin-head-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pin-tag{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:800; padding:3px 11px 3px 9px; border-radius:999px; background:var(--amber); color:#2B1A00;}
.pin-tag::before{content:""; width:7px; height:7px; border-radius:50%; background:#2B1A00; animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,26,0,.55);}100%{box-shadow:0 0 0 7px rgba(43,26,0,0);}}
.pin-title{font-size:15px; font-weight:800; color:#fff;}
.pin-date{font-weight:800; font-size:16px;} .pin-sub{font-size:13px; color:#B3C2EA; width:100%;}
.pin-body{margin-top:12px;}
.pin-h{font-size:12.5px; font-weight:700; color:#B3C2EA; margin:0 0 8px;}
.pin-empty{font-size:13.5px; color:#B3C2EA; padding:2px 0;}
.pin-lessons{display:flex; align-items:center; gap:10px; width:100%; margin-top:0; padding:10px 12px; font:600 14px var(--font); color:#fff; background:#ffffff14; border:1px solid #ffffff26; border-radius:14px;}
.pin-lessons .pl-ico{font-size:16px;} .pin-lessons .pl-txt{font-size:14px; font-weight:600;}
.pin-lessons b{font:700 20px var(--font-num); color:var(--amber); margin-right:3px;}
.pin-lessons.none{color:#B3C2EA; font-weight:500;}
.pin-lessons + .pin-grid{margin-top:10px;}
.pin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px;}
.pin .chip{box-shadow:0 6px 16px rgba(0,0,0,.2); color:var(--ink);}
.pin .task-list{margin-bottom:0;}
.pin .task-item{box-shadow:0 8px 20px rgba(0,0,0,.22); border-color:transparent; align-items:center;}
.pin .task-num{background:var(--amber); color:#2B1A00;}
.pin-noterow{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px;}
.pin-noterow .task-note{margin:0; flex:1 1 auto; min-width:0; color:#B3C2EA;}
.pin-tasklink{display:inline-block; margin-top:10px; padding:6px 13px; font:700 12.5px var(--font); color:#fff; background:#ffffff1f; border:1px solid #ffffff2e; border-radius:999px; white-space:nowrap; transition:background .2s;}
.pin-tasklink:hover{background:#ffffff33;}
.pin-noterow .pin-tasklink{margin:0 0 0 auto;}

/* ===== Chú giải, thanh điều hướng ===== */
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:14px; padding:10px 14px; font-size:12.5px; color:var(--ink-2); background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow);}
.legend span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.legend-month{margin:10px 0 0;}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%;}
.bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.bar h2{font-size:17px;}
.nav-group{display:flex; gap:8px;}
.iconbtn{display:flex; align-items:center; justify-content:center; width:38px; height:38px; font-size:18px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; transition:transform .2s var(--ease),background .2s,border-color .2s;}
.iconbtn:hover{background:var(--hl-soft); border-color:var(--hl);}
#view-week .bar{flex-wrap:nowrap;} #view-week .bar h2{font-size:min(16px,4.2vw); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;} #view-week .bar .nav-group{flex-shrink:0;}
#view-tasks .bar{justify-content:center;} #view-tasks .bar h2{width:100%; text-align:center;}

/* ===== Tuần ===== */
.day-card{display:grid; grid-template-columns:68px 1fr; margin-bottom:12px; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow); transition:transform .3s var(--ease),box-shadow .3s var(--ease);}
.day-head{grid-row:1 / span 20; display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 4px; text-align:center; background:var(--paper-2); border-right:1px solid var(--line-soft);}
.day-head .wd{font-size:12px; font-weight:700; color:var(--muted);}
.day-head .dd{font:700 26px/1.05 var(--font-num);}
.day-head .dt{font-size:11px; color:var(--muted); white-space:nowrap;}
.day-card.is-today{border-color:var(--amber); box-shadow:0 0 0 2px var(--amber),0 14px 30px rgba(255,176,32,.25);}
.day-card.is-today .day-head{background:linear-gradient(170deg,#FFCB52,#FF9F1C); color:#2B1A00;}
.day-card.is-today .wd,.day-card.is-today .dt{color:#5A3A00;}
.today-badge{margin-top:6px; padding:1px 8px; font-size:10.5px; font-weight:800; white-space:nowrap; color:#FFD27A; background:#2B1A00; border-radius:999px;}
.slot-block{grid-column:2; padding:9px 11px; border-top:1px solid var(--line-soft);}
.slot-block:first-of-type{border-top:none;}
.slot-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px; font-weight:700; color:var(--muted);}
.slot-count{font-size:12px; font-weight:600; color:var(--muted);}
.slot-toggle{min-height:28px; padding:4px 12px; font:700 12px var(--font); color:var(--hl); background:var(--hl-soft); border:none; border-radius:999px;}
.slot-chips{display:flex; flex-wrap:wrap; gap:6px;}
.slot-chips > .chip{flex:1 1 210px;}
.slot-empty{grid-column:2; padding:12px !important; font-size:13px; color:var(--muted);}

/* ===== Thẻ buổi học ===== */
.chip{--tc:var(--muted); position:relative; cursor:pointer; padding:7px 10px 8px 17px; border:1px solid var(--line-soft); border-radius:14px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 13%,var(--card)),var(--card) 72%); transition:transform .22s var(--ease),box-shadow .22s var(--ease),opacity .3s;}
.chip::before{content:""; position:absolute; left:6px; top:8px; bottom:8px; width:4px; border-radius:4px; background:var(--tc);}
.chip:active{transform:scale(.985);}
.chip.track-P301,.chip.track-P302,.chip.track-P303,.chip.track-QY{--tc:var(--p301);} .chip.track-TChinh{--tc:var(--p303);}
.chip-loc{margin-top:4px; font-size:13px; font-weight:700; line-height:1.3; color:var(--gold);}
.chip.track-QNhu{--tc:var(--nhu);} .chip.track-QKhi{--tc:var(--khi);} .chip.holiday{--tc:var(--red); background:var(--red-soft);}
.chip-top{display:flex; align-items:center; flex-wrap:wrap; gap:3px 8px;}
.chip-track-tag{font-size:12px; font-weight:800; color:var(--tc);}
.chip-code{font-size:11.5px; font-weight:500; color:var(--muted);}
.chip-teacher{margin-left:auto; padding:1px 10px; font-size:12.5px; font-weight:700; line-height:1.5; color:var(--on-hl); background:var(--hl); border-radius:999px;}
.chip-teacher:empty{display:none;}
.chip-subject{margin-top:3px; font-size:13.5px; font-weight:600; line-height:1.3;}
.chip.match{box-shadow:0 0 0 2px var(--hl);} .chip.match .chip-teacher{background:var(--amber); color:#2B1A00;}
.chip.dim{opacity:.28;}

/* ===== Ô tiết + bố cục thẻ ===== */
.slot-block{display:grid; grid-template-columns:58px 1fr; gap:8px; align-items:stretch; padding:8px 10px 8px 8px;}
.slot-period{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:6px 2px; text-align:center;
  background:var(--hl-soft); border:1.5px solid color-mix(in srgb,var(--hl) 45%,var(--line)); border-radius:12px;}
.slot-period .sp-k{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.slot-period .sp-n{font:700 17px/1.1 var(--font-num); color:var(--hl); white-space:nowrap;}
.slot-period .sp-s{font-size:11px; font-weight:600; color:var(--ink-2);}
.slot-block .slot-chips{flex-direction:column;}
.slot-block .slot-chips > .chip{flex:none;}
.slot-block .chip-code{display:none;}
.chip-grid{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.chip-left{min-width:0; flex:1 1 auto;}
.chip-right{flex:0 1 auto; max-width:58%; display:flex; flex-direction:column; align-items:flex-end; gap:4px; text-align:right;}
.chip-right .chip-teacher{margin-left:0;}
.chip-right .chip-loc{margin-top:0; font-size:12px; text-align:right; word-break:break-word;}
@media (min-width:641px){.slot-block .slot-chips{flex-direction:row; flex-wrap:wrap;} .slot-block .slot-chips > .chip{flex:1 1 230px;} .slot-block{grid-template-columns:70px 1fr;}}

/* ===== Tháng ===== */
.month-scroll{margin:0;}
.month-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px;}
.wd-label{padding-bottom:2px; font-size:11px; font-weight:700; text-align:center; color:var(--muted);}
.month-grid > .wd-label:nth-child(7n+6){color:var(--gold);} .month-grid > .wd-label:nth-child(7n){color:var(--red);}
.month-cell{display:flex; flex-direction:column; gap:2px; min-height:44px; padding:4px; overflow:hidden; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:12px; transition:transform .2s var(--ease),box-shadow .2s,background .2s;}
.month-cell:active{transform:scale(.94);}
.month-grid > .month-cell:nth-child(7n+6){background:color-mix(in srgb,var(--amber) 11%,var(--card));}
.month-grid > .month-cell:nth-child(7n){background:color-mix(in srgb,var(--red) 9%,var(--card));}
.month-cell.out{opacity:.35;}
.month-cell .num{font:700 12.5px/1.2 var(--font-num);}
.month-dots{display:flex; gap:2px; min-height:6px; overflow:hidden;}
.month-dots .dot{width:6px; height:6px; flex:none;}
.month-count{font-size:11px; color:var(--muted);} .month-cell .month-task{font-size:10px; line-height:1.2; font-weight:700; color:var(--gold);}
.month-grid > .month-cell.is-today{border:2px solid var(--amber); padding:3px;}
.month-grid > .month-cell.selected{border:2px solid var(--hl); padding:3px; background:var(--hl-soft); box-shadow:0 0 0 3px color-mix(in srgb,var(--hl) 22%,transparent);}
.month-grid > .month-cell.teach-hit{background:linear-gradient(145deg,var(--hl),var(--brand-2)); border-color:var(--hl); color:var(--on-hl);}
.month-cell.teach-hit .num,.month-cell.teach-hit .month-count,.month-cell.teach-hit .month-task{color:var(--on-hl);}
.month-cell.teach-hit .num{font-size:13.5px;} .month-cell.teach-hit .dot{box-shadow:0 0 0 1.5px #fff;}
.month-cell.teach-off:not(.out){opacity:.5;}
.teach-banner{margin-bottom:12px; padding:9px 12px; font-size:13.5px; font-weight:600; background:var(--card); border:1px solid var(--hl); border-radius:var(--radius-s);}
#monthDayDetail{margin:0 0 8px; max-height:150px; overflow-y:auto; border-radius:14px;}
#monthDayDetail .panel{padding:9px 12px;} #monthDayDetail .panel h3{margin:0; font-size:13.5px; line-height:1.3;}
#monthDayDetail .task-block{margin:0;} #monthDayDetail .task-item{padding:6px 10px; gap:8px;} #monthDayDetail .task-num{display:none;}
#monthDayDetail .task-title{font-size:14px;} #monthDayDetail .task-meta,#monthDayDetail .task-note{font-size:12.5px; margin-top:3px;}

/* ===== Thống kê ===== */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px;}
.stat-card,.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow);}

.stat-num{font:700 28px/1.1 var(--font-num); color:var(--hl);} .stat-label{margin-top:5px; font-size:13px; color:var(--muted);}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
.bar-row .name{width:110px; flex:none; font-weight:600;} .bar-row .n{width:32px; flex:none; text-align:right; font:700 13px var(--font-num);}
.bar-row .track{flex:1; height:12px; overflow:hidden; background:var(--paper-2); border-radius:999px;}
.bar-row .fill{height:100%; background:var(--hl); border-radius:999px; transition:width .9s var(--ease);}

/* ===== Công việc ===== */
.log-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:6px 8px; background:linear-gradient(135deg,var(--brand-2),var(--brand)); border-radius:var(--radius-m); box-shadow:0 10px 24px rgba(10,26,58,.25);}

.log-note{margin-bottom:14px; font-size:12.5px; color:var(--muted);}
.task-list{display:flex; flex-direction:column; gap:9px; margin-bottom:20px;}
.task-item{display:flex; gap:11px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);}
#view-tasks .task-item{background:linear-gradient(90deg,var(--task-soft),var(--card) 78%);}
.task-num{flex:none; width:26px; height:26px; display:flex; align-items:center; justify-content:center; margin-top:1px; font:700 12.5px var(--font-num); color:var(--on-hl); background:var(--hl); border-radius:50%;}
.task-body{flex:1; min-width:0;}
.task-title{font-size:15px; font-weight:700; line-height:1.4; word-break:break-word;}
.task-meta{margin-top:6px; font-size:13.5px; font-weight:600; color:var(--ink-2);}
.task-note{margin-top:3px; font-size:13.5px; color:var(--muted); word-break:break-word;}
.task-meta .k,.task-note .k{margin-right:6px; font-size:12px; font-weight:700; color:var(--hl);} .task-meta .k::after,.task-note .k::after{content:":";}
.task-empty{padding:18px 2px; text-align:center; font-size:14px; color:var(--ink-2); background:var(--task-soft); border:1px dashed var(--hl); border-radius:16px;}
.upcoming-row{display:flex; align-items:center; gap:10px; padding:11px 0; font-size:14px; cursor:pointer; border-bottom:1px solid var(--line-soft);}
.upcoming-row:last-child{border-bottom:none;} .upcoming-row .d{flex:1;} .upcoming-row .n{font-size:12.5px; font-weight:700; color:var(--gold);}
.tbl-wrap{margin-bottom:18px;}
.tbl-title{display:flex; align-items:center; gap:9px; margin:8px 0 10px; font-size:16px;}
.tbl-title::before{content:""; width:5px; height:18px; border-radius:4px; background:linear-gradient(180deg,var(--hl),var(--amber));}
.tbl{width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow);}

.tbl tbody tr:nth-child(even) td{background:var(--paper);}
.tbl tbody tr[data-date]{cursor:pointer;} .tbl tbody tr[data-date]:hover td{background:var(--hl-soft);}
.tbl .c-stt{width:52px; text-align:center; font:600 14px var(--font-num); color:var(--muted);}

.cd.near{background:#E8890C;} .cd.soon{background:var(--red);} .cd.now{background:var(--p301);}

  .tbl tbody tr{margin-bottom:10px; padding-bottom:8px; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);}

/* ===== Chi tiết & thông báo ===== */
.overlay{position:fixed; inset:0; z-index:200; display:none; align-items:flex-end; justify-content:center; background:rgba(7,13,26,.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);}
.overlay.show{display:flex; animation:fadeIn .25s ease both;}
.modal{width:100%; max-width:440px; max-height:85vh; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom,0px); background:var(--card); border-radius:24px 24px 0 0; box-shadow:var(--shadow-lg); animation:sheet .38s var(--ease) both;}

.modal-body{padding:6px 20px 20px;}

#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); z-index:300; padding:10px 18px; font-size:13px; color:var(--paper); background:var(--ink); border-radius:999px; box-shadow:var(--shadow-lg); opacity:0; transform:translateX(-50%) translateY(20px); transition:opacity .25s,transform .35s var(--ease); pointer-events:none;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ===== Chuyển động ===== */
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.985);}to{opacity:1; transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes sheet{from{opacity:0; transform:translateY(40px) scale(.98);}to{opacity:1; transform:none;}}
#view-week > *,#view-month > *,#view-tasks > *,.pin{animation:rise .55s var(--ease) both;}
#view-week > :nth-child(2),#view-tasks > :nth-child(2){animation-delay:.05s;} #view-week > :nth-child(3),#view-tasks > :nth-child(3){animation-delay:.1s;}
#view-week > :nth-child(4),#view-tasks > :nth-child(4){animation-delay:.15s;} #view-week > :nth-child(5),#view-tasks > :nth-child(5){animation-delay:.2s;}
#view-week > :nth-child(6),#view-tasks > :nth-child(6){animation-delay:.25s;} #view-week > :nth-child(n+7){animation-delay:.3s;}
@media (hover:hover){.day-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);} .chip:hover{transform:translateY(-2px); box-shadow:var(--shadow);} .month-cell:hover{transform:translateY(-1px);}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none !important; transition:none !important; scroll-behavior:auto !important;}}

/* ===== Thanh công cụ: chọn GV ngắn lại, nút Tải lại trang có nhãn ===== */
select.sel{flex:0 1 170px;}
#refreshBtn{width:auto; padding:0 12px; gap:5px; flex:none;}

  select.sel{flex:1 1 0; min-width:84px; max-width:135px; padding:0 8px; font-size:12.5px;}

/* =====================================================================
   GIAO DIỆN MỚI — bảng màu, dải ngày, hiệu ứng
   ===================================================================== */
:root{
  --ink:#0B1530; --ink-2:#334064; --muted:#6A7696; --paper:#F1F4FB; --paper-2:#E6EBF7; --card:#FFFFFF; --line:#D9E0F0; --line-soft:#E8ECF7;
  --brand:#0A1236; --brand-2:#1B2F8F; --brand-3:#0C7FA8;
  --hl:#4A4DE8; --hl-2:#7A3FF0; --on-hl:#fff; --hl-soft:#ECEBFF; --task-soft:#F0EFFF; --grid:rgba(74,77,232,.045);
  --amber:#FFB21E; --gold:#C46A00; --gold-soft:#FFF1D6;
  --p301:#0FAF7E; --p301-soft:#DDF7EE; --nhu:#E5337C; --nhu-soft:#FDE2EE; --khi:#8247F0; --khi-soft:#EEE5FF; --p303:#E99100; --p303-soft:#FFF0D3; --red:#E5413A; --red-soft:#FDE3E1;
  --shadow:0 1px 2px rgba(11,21,48,.05),0 8px 22px rgba(36,44,120,.08); --shadow-lg:0 18px 40px rgba(36,44,120,.18);
  --ease:cubic-bezier(.22,.8,.24,1); --spring:cubic-bezier(.34,1.32,.5,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9EEFB; --ink-2:#BAC5E0; --muted:#8792B2; --paper:#060A1A; --paper-2:#0F1630; --card:#0C1328; --line:#1E2847; --line-soft:#151E3A;
  --brand:#040820; --brand-2:#14216A; --brand-3:#0A5F80;
  --hl:#8F93FF; --hl-2:#B48CFF; --on-hl:#0A0E2E; --hl-soft:#1A1D4E; --task-soft:#15183F; --grid:rgba(143,147,255,.05);
  --gold:#FFBE4D; --p301:#34D8A2; --nhu:#FF6BA8; --khi:#AE8BFF; --p303:#FFB938; --red:#FF7A72;
  --p301-soft:#0D2C25; --nhu-soft:#34142A; --khi-soft:#221A46; --p303-soft:#33270C; --red-soft:#3A1718;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.4); --shadow-lg:0 18px 40px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --ink:#E9EEFB; --ink-2:#BAC5E0; --muted:#8792B2; --paper:#060A1A; --paper-2:#0F1630; --card:#0C1328; --line:#1E2847; --line-soft:#151E3A;
  --brand:#040820; --brand-2:#14216A; --brand-3:#0A5F80;
  --hl:#8F93FF; --hl-2:#B48CFF; --on-hl:#0A0E2E; --hl-soft:#1A1D4E; --task-soft:#15183F; --grid:rgba(143,147,255,.05);
  --gold:#FFBE4D; --p301:#34D8A2; --nhu:#FF6BA8; --khi:#AE8BFF; --p303:#FFB938; --red:#FF7A72;
  --p301-soft:#0D2C25; --nhu-soft:#34142A; --khi-soft:#221A46; --p303-soft:#33270C; --red-soft:#3A1718;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.4); --shadow-lg:0 18px 40px rgba(0,0,0,.6);}

body{background:
  radial-gradient(60% 40% at 100% 0%, color-mix(in srgb,var(--hl-2) 12%,transparent), transparent 70%) fixed,
  radial-gradient(50% 35% at 0% 30%, color-mix(in srgb,var(--brand-3) 11%,transparent), transparent 70%) fixed,
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px, linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px, var(--paper);}

/* Header & ô ghim: dải màu xanh đêm → lam → ngọc */
header.top{background:
  radial-gradient(70% 140% at 100% 0%, #7A3FF055, transparent 60%),
  linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 58%,var(--brand-3) 100%);
  box-shadow:0 10px 30px rgba(10,18,54,.32);}
header.top::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg,transparent,var(--amber),#FF6BA8,var(--hl-2),transparent); opacity:.85;}
.brand-eyebrow{background:linear-gradient(135deg,#ffffff2e,#ffffff0d);}
.pin{background:
  radial-gradient(90% 120% at 100% 0%, #7A3FF066, transparent 55%),
  radial-gradient(70% 90% at 0% 100%, #0C7FA855, transparent 60%),
  linear-gradient(150deg,var(--brand-2),var(--brand));
  box-shadow:0 14px 34px rgba(27,47,143,.32);}

/* Nút & thanh điều hướng */
.iconbtn{transition:transform .25s var(--spring),background .2s,border-color .2s,box-shadow .2s;}
.iconbtn:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--hl) 25%,transparent);}
.btn-gold{background:linear-gradient(135deg,#FFC94A,#FF9F1C);}
.stat-num{background:linear-gradient(135deg,var(--hl),var(--hl-2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.bar-row .fill{background:linear-gradient(90deg,var(--hl),var(--hl-2));}
.tbl th{background:linear-gradient(120deg,var(--brand),var(--brand-2) 70%,var(--brand-3));}
.log-nav{background:linear-gradient(120deg,var(--brand-2),var(--brand) 60%,var(--brand-3));}
.chip-teacher{background:linear-gradient(135deg,var(--hl),var(--hl-2));}

/* Tab: viên chọn trượt mượt */
nav.tabs{isolation:isolate;}
@media (min-width:641px){nav.tabs{position:relative;}}
.tab{position:relative; z-index:1; background:transparent !important; box-shadow:none !important; transition:color .3s var(--ease),transform .2s var(--ease);}
.tab-ind{position:absolute; z-index:0; top:4px; bottom:4px; left:4px; width:calc((100% - 8px - 12px) / 4); border-radius:11px; background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.25); transform:translateX(calc(var(--ti,0) * (100% + 4px))); transition:transform .5s var(--spring);}
:root[data-theme="dark"] .tab-ind{background:var(--hl);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab-ind{background:var(--hl);}}
@media (max-width:640px){
  .tab-ind{top:5px; bottom:5px; left:5px; width:calc((100% - 10px - 12px) / 4); border-radius:17px !important;
    background:linear-gradient(135deg,#4A4DE8,#7A3FF0) !important; box-shadow:0 6px 18px rgba(74,77,232,.45);}
  .tab[aria-selected="true"]{color:#fff !important;}
}

/* Dải ô ngày (Cả tuần + T2…T6) */
.week-strip{grid-template-columns:repeat(6,minmax(0,1fr)); gap:5px;}
.ws-day{position:relative; gap:1px; padding:6px 1px 5px; border-radius:13px; overflow:hidden;
  transition:transform .3s var(--spring),border-color .25s,background .25s,box-shadow .25s,color .25s;}
.ws-day:active{transform:scale(.92);}
.ws-wd{font-size:11px;} .ws-dd{font-size:13.5px;} .ws-n{font-size:9.5px;}
.ws-bars{display:flex; gap:2px; height:5px; width:72%; margin:2px 0 1px;}
.ws-bars i{flex:1; border-radius:3px; box-shadow:0 0 0 .5px #00000012;}
.ws-bars i.none{background:var(--line);}
.ws-day.empty{opacity:.55;}
.ws-all .ws-wd{color:var(--ink-2);} .ws-all .ws-dd{font:800 12.5px/1.25 var(--font); text-transform:uppercase; letter-spacing:.02em;}
.ws-day.is-today{background:linear-gradient(170deg,#FFF3D0,#FFE2A6); border-color:var(--amber); color:#3A2400;}
:root[data-theme="dark"] .ws-day.is-today{background:linear-gradient(170deg,#3A2A08,#2A1E06); color:#FFD27A;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ws-day.is-today{background:linear-gradient(170deg,#3A2A08,#2A1E06); color:#FFD27A;}}
.ws-day.is-today .ws-wd,.ws-day.is-today .ws-n{color:inherit; opacity:.85;}
.ws-day.active{background:linear-gradient(150deg,var(--hl),var(--hl-2)); border-color:transparent; color:#fff; opacity:1;
  transform:translateY(-2px); box-shadow:0 10px 22px color-mix(in srgb,var(--hl) 40%,transparent);}
.ws-day.active .ws-wd,.ws-day.active .ws-n{color:#fff; opacity:.9;}
.ws-day.active .ws-bars i{box-shadow:0 0 0 1.5px #ffffffd0;}
.ws-day.active.is-today::after{content:""; position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 2px #fff;}

/* Thẻ ngày & buổi học */
#view-week > *{animation:none;}
.week-cards{will-change:transform,opacity;}
.week-cards .day-card{animation:cardIn .5s var(--ease) both; animation-delay:calc(var(--i,0) * 45ms);}
@keyframes cardIn{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:none;}}
.day-card{border-color:var(--line-soft);}
.day-head{background:linear-gradient(180deg,var(--paper-2),color-mix(in srgb,var(--hl-soft) 60%,var(--paper-2)));}
.day-card.is-today .day-head{background:linear-gradient(170deg,#FFCF5C,#FF9A1F);}
.slot-period{background:linear-gradient(170deg,var(--hl-soft),color-mix(in srgb,var(--hl-2) 10%,var(--card))); border-color:color-mix(in srgb,var(--hl) 35%,var(--line));}
.slot-period .sp-n{background:linear-gradient(135deg,var(--hl),var(--hl-2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.chip{background:linear-gradient(95deg,color-mix(in srgb,var(--tc) 16%,var(--card)),var(--card) 78%); border-color:color-mix(in srgb,var(--tc) 22%,var(--line-soft));}
.chip::before{background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#fff));}
.chip-track-tag{letter-spacing:.02em;}
@media (hover:hover){.chip:hover{box-shadow:0 8px 18px color-mix(in srgb,var(--tc) 22%,transparent);}}

/* Cửa sổ chi tiết mượt hơn */
.overlay.show{animation:fadeIn .3s ease both;}
.modal{animation:sheet .45s var(--spring) both;}
.kv .v{color:var(--ink);}
@media (prefers-reduced-motion:reduce){.tab-ind,.ws-day{transition:none !important;}}

/* ===== Thẻ công việc (tab Công việc) ===== */
.tc-list{display:flex; flex-direction:column; gap:14px; margin-bottom:20px;}
.tcard{--uc:var(--hl); --uc2:var(--hl-2); display:flex; gap:12px; padding:12px; cursor:pointer; background:var(--card);
  border:1.5px solid color-mix(in srgb,var(--uc) 45%,var(--line)); border-radius:18px;
  box-shadow:0 1px 0 #ffffff80 inset,0 4px 0 color-mix(in srgb,var(--uc) 32%,var(--line)),0 14px 24px color-mix(in srgb,var(--uc) 18%,transparent);
  animation:cardIn .5s var(--ease) both; animation-delay:calc(var(--i,0) * 50ms); transition:transform .25s var(--ease),box-shadow .25s var(--ease);}
.tcard:active{transform:translateY(3px); box-shadow:0 1px 0 #ffffff80 inset,0 1px 0 color-mix(in srgb,var(--uc) 32%,var(--line)),0 4px 10px color-mix(in srgb,var(--uc) 14%,transparent);}
@media (hover:hover){.tcard:hover{transform:translateY(-3px);}}
.tcard.is-current{cursor:default; margin-bottom:6px;}
.tcard.u-now{--uc:#0FAF7E; --uc2:#0C7FA8;} .tcard.u-soon{--uc:#E5413A; --uc2:#E5337C;} .tcard.u-near{--uc:#F08A0C; --uc2:#E5413A;}
.tc-date{flex:none; width:56px; align-self:flex-start; display:flex; flex-direction:column; align-items:center; padding:7px 0 6px; color:#fff; border-radius:13px;
  background:linear-gradient(160deg,var(--uc),var(--uc2)); box-shadow:0 6px 14px color-mix(in srgb,var(--uc) 35%,transparent);}
.tc-wd{font-size:11px; font-weight:700; opacity:.9; letter-spacing:.04em;}
.tc-dd{font:700 24px/1.05 var(--font-num);}
.tc-mm{font-size:10.5px; font-weight:600; opacity:.85;}
.tc-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;}
.tc-head{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:22px;}
.tc-full{font-size:12.5px; font-weight:600; color:var(--muted);}
.tc-head .cd{margin:0; flex:none; font-size:11px;}
.tc-task{display:flex; gap:8px; align-items:flex-start;}
.tc-task + .tc-task{padding-top:8px; border-top:1px dashed var(--line);}
.tc-idx{flex:none; width:20px; height:20px; display:grid; place-items:center; margin-top:1px; font:700 11px var(--font-num); color:var(--uc); background:color-mix(in srgb,var(--uc) 13%,var(--card)); border-radius:7px;}
.tc-main{min-width:0; flex:1;}
.tc-title{font-size:15px; font-weight:700; line-height:1.35; letter-spacing:-.01em; color:var(--ink); word-break:break-word;}
.tc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.tc-tag{display:inline-flex; align-items:center; gap:5px; max-width:100%; padding:3px 9px 3px 7px; font-size:12px; font-weight:600; line-height:1.3; border-radius:999px; word-break:break-word;}
.tc-tag svg{flex:none; width:14px; height:14px;}
.tc-tag.who{color:color-mix(in srgb,var(--hl) 85%,var(--ink)); background:var(--hl-soft);}
.tc-tag.note{color:var(--gold); background:var(--gold-soft);}
.tc-empty{display:flex; flex-direction:column; align-items:center; gap:3px; padding:22px 14px; text-align:center; color:var(--muted); font-size:13px;
  background:linear-gradient(170deg,var(--task-soft),var(--card)); border:1.5px dashed color-mix(in srgb,var(--hl) 45%,var(--line)); border-radius:18px;}
.tc-empty b{font-size:14.5px; color:var(--ink-2);}
.tc-empty-ico{width:38px; height:38px; margin-bottom:4px; color:var(--hl); opacity:.75;}
.log-nav{border-radius:16px; padding:5px 6px;} .log-nav .datelabel{font-size:14.5px;}
.log-nav{background:linear-gradient(120deg,var(--brand),var(--brand-2) 55%,var(--brand-3));}

/* ===== Tab Công cụ: KPI, vành khuyên, xếp hạng ===== */
.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media (min-width:641px){.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
.kpi{--kc:var(--hl); --kc2:var(--hl-2); position:relative; overflow:hidden; display:flex; align-items:center; gap:11px; padding:13px 14px;
  animation:cardIn .5s var(--ease) both; animation-delay:calc(var(--i,0) * 60ms);}
.kpi::after{content:""; position:absolute; right:-24px; top:-24px; width:84px; height:84px; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--kc) 22%,transparent),transparent 70%);}
.kpi.k2{--kc:#0C7FA8; --kc2:#0FAF7E;} .kpi.k3{--kc:#F08A0C; --kc2:#E5337C;} .kpi.k4{--kc:#8247F0; --kc2:#E5337C;}
.kpi-ico{flex:none; width:40px; height:40px; display:grid; place-items:center; color:#fff; border-radius:12px; background:linear-gradient(145deg,var(--kc),var(--kc2)); box-shadow:0 6px 14px color-mix(in srgb,var(--kc) 35%,transparent);}
.kpi-ico svg{width:21px; height:21px;}
.kpi-txt{min-width:0;}
.kpi .stat-num{font-size:24px; background:linear-gradient(135deg,var(--kc),var(--kc2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.kpi .stat-label{margin-top:2px; font-size:12px; font-weight:600;}

.viz-panel h3{display:flex; align-items:center; gap:9px; font-size:15px; margin-bottom:12px;}
.viz-panel h3::before{content:""; width:5px; height:17px; border-radius:4px; background:linear-gradient(180deg,var(--hl),var(--amber));}
.donut-wrap{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.donut{flex:none; width:132px; height:132px; filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--hl) 18%,transparent));}
.donut-seg{animation:donutIn .9s var(--ease) both; animation-delay:var(--d,0ms); stroke-linecap:butt;}
@keyframes donutIn{from{stroke-dasharray:0 999;}}
.donut-n{font:700 26px var(--font-num); fill:var(--ink);} .donut-l{font:600 10.5px var(--font); fill:var(--muted);}
.donut-legend{flex:1; min-width:170px; display:flex; flex-direction:column; gap:7px;}
.dl-row{display:grid; grid-template-columns:12px auto 1fr auto; align-items:center; gap:8px; padding:7px 10px; font-size:13px; background:var(--paper); border-radius:11px;}
.dl-row.zero{opacity:.5;}
.dl-dot{width:11px; height:11px; border-radius:4px;}
.dl-name{font-weight:700;} .dl-val{color:var(--muted); font-size:12px; text-align:right;} .dl-val b{color:var(--ink); font-family:var(--font-num);}
.dl-pct{min-width:36px; padding:1px 6px; font:700 11.5px var(--font-num); text-align:center; color:var(--hl); background:var(--hl-soft); border-radius:999px;}

.rank-list{display:flex; flex-direction:column; gap:8px;}
.rank-row{display:flex; align-items:center; gap:11px; padding:9px 11px; background:linear-gradient(95deg,var(--paper),var(--card)); border:1px solid var(--line-soft); border-radius:14px;
  animation:cardIn .45s var(--ease) both; animation-delay:calc(var(--i,0) * 40ms);}
.rk-ava{position:relative; flex:none; width:40px; height:40px; display:grid; place-items:center; font:800 16px var(--font); color:#fff; border-radius:50%;
  background:linear-gradient(145deg,hsl(var(--h) 75% 60%),hsl(calc(var(--h) + 35) 70% 46%)); box-shadow:0 5px 12px hsl(var(--h) 70% 50% / .35);}
.rank-row.unknown .rk-ava{background:linear-gradient(145deg,#9AA3BD,#6A7696); box-shadow:none;}
.rk-medal{position:absolute; right:-4px; bottom:-3px; width:17px; height:17px; display:grid; place-items:center; font:800 10px var(--font-num); color:#3A2400; border:2px solid var(--card); border-radius:50%;}
.rk-medal.m1{background:linear-gradient(145deg,#FFE27A,#F5A300);} .rk-medal.m2{background:linear-gradient(145deg,#EEF1F7,#AEB7C9);} .rk-medal.m3{background:linear-gradient(145deg,#F6C79B,#C8783A);}
.rk-body{flex:1; min-width:0;}
.rk-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.rk-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rk-p{flex:none; font-size:12px; color:var(--muted);} .rk-p b{font:700 16px var(--font-num); color:var(--ink); margin-right:2px;}
.rk-track{height:8px; margin:6px 0 5px; overflow:hidden; background:var(--paper-2); border-radius:999px;}
.rk-fill{height:100%; width:var(--w); border-radius:999px; background:linear-gradient(90deg,hsl(var(--h) 75% 60%),hsl(calc(var(--h) + 35) 70% 50%)); animation:grow 1s var(--ease) both; animation-delay:calc(var(--i,0) * 40ms + 150ms); transform-origin:left;}
@keyframes grow{from{transform:scaleX(0);}}
.rk-meta{display:flex; gap:12px; font-size:11.5px; font-weight:600; color:var(--muted);}
.rk-meta span::before{content:"•"; margin-right:5px; color:var(--hl);}

@media (max-width:640px){
  .donut-wrap{flex-direction:column; align-items:stretch;}
  .donut{align-self:center; width:150px; height:150px;}
  .donut-legend{min-width:0;}
}
.dl-val{white-space:nowrap;}

/* =====================================================================
   BẢNG MÀU CHÍNH: xanh ngọc đậm + vàng đồng
   ===================================================================== */
:root{
  --ink:#0A1F26; --ink-2:#2E4A52; --muted:#61797F; --paper:#EFF5F4; --paper-2:#E1ECEA; --card:#FFFFFF; --line:#D2E2DF; --line-soft:#E4EEEC;
  --brand:#04222A; --brand-2:#0A4A57; --brand-3:#0E8C8A;
  --hl:#0B8A8C; --hl-2:#0A6FA6; --on-hl:#fff; --hl-soft:#DDF1EF; --task-soft:#E8F5F3; --grid:rgba(11,138,140,.05);
  --amber:#F2B33D; --gold:#B7660A; --gold-soft:#FDF0D6;
  --p301:#16A34A; --p301-soft:#DCF5E4;
  --shadow:0 1px 2px rgba(4,34,42,.05),0 8px 22px rgba(4,60,70,.09); --shadow-lg:0 18px 40px rgba(4,60,70,.2);

   Sheet của bạn vào đây. Xem hướng dẫn Trưởng khoa đã nhận kèm file này.
   ===================================================================== */
const CSV_URL_LESSONS  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=589329369&single=true&output=csv";

const CSV_URL_TEACHERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1579967289&single=true&output=csv";
const CSV_URL_TASKS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1365016418&single=true&output=csv";

<script>
(function(){
"use strict";

/* ================= CSV parsing ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c=>c!==""));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = (r[i]!==undefined ? r[i].trim() : ""));
    return o;
  });
}
async function fetchCSV(url){
  const bust = url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now();
  const res = await fetch(bust, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  let text = await res.text();
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  return csvToObjects(text);
}

/* ================= Date parsing ================= */
function normalizeDate(s){
  if(!s) return null;
  s = s.trim().replace(/^"|"$/g,"");
  // ISO: 2026-06-19 or 2026/06/19
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  // D/M/Y or M/D/Y — ambiguous, resolve using validity (day<=31, month<=12)
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/);
  if(m){
    let a = parseInt(m[1],10), b = parseInt(m[2],10);
    const y = m[3];
    let day, month;
    if(a>12 && b<=12){ day=a; month=b; }               // must be D/M/Y
    else if(b>12 && a<=12){ day=b; month=a; }           // must be M/D/Y
    else { day=a; month=b; }                            // ambiguous -> assume D/M/Y (VN convention)
    if(month>=1 && month<=12 && day>=1 && day<=31){
      return y+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    }
  }
  return null;
}

/* ================= Build data model from sheet rows ================= */
function buildLessons(rows, subjMap, teachMap){
  const out = [];
  let id = 1;
  let skippedNoDate = 0, skippedNoCode = 0;
  rows.forEach(r=>{
    const rawDate = r["Ngày"] || r["Ngay"] || "";
    const date = normalizeDate(rawDate);
    const code = (r["Mã môn"]||r["Ma mon"]||"").trim();
    if(!date){ if(rawDate) skippedNoDate++; return; }
    if(!code){ skippedNoCode++; return; }
    const nhom = (r["Nhóm"]||r["Nhom"]||"").trim();
    const lop = (r["Lớp/Phòng"]||r["Lop/Phong"]||"").trim();
    let room = "";
    if(["P301","P303","P302"].includes(lop)) room = lop;
    else if(/quân nhu|quan nhu/i.test(nhom)) room = "QNhu";
    else if(/quân khí|quan khi/i.test(nhom)) room = "QKhi";
    else if(/tài chính|tai chinh/i.test(nhom) || /tài chính|tai chinh/i.test(lop)) room = "TChinh";
    else room = "QY";

    const teacherCodeRaw = (r["Mã GV"]||r["Ma GV"]||"").trim();
    const subjFromMap = subjMap[code.toLowerCase()];
    const teachFromMap = teacherCodeRaw ? teachMap[teacherCodeRaw.toLowerCase()] : null;
    const sheetSubjectName = (r["Tên môn học"]||r["Ten mon hoc"]||"").trim();
    const sheetTeacherName = (r["Tên giáo viên"]||r["Ten giao vien"]||"").trim();
    const looksLikeError = (t)=> /^#|chưa có trong danh mục/i.test(t||"");

    out.push({
      id: id++,
      date,
      period: (r["Tiết"]||r["Tiet"]||"").trim(),
      room,
      code,
      subject: (subjFromMap && subjFromMap.name) || (!looksLikeError(sheetSubjectName) && sheetSubjectName) || code,
      teacherCode: teacherCodeRaw || null,
      teacher: (teachFromMap && teachFromMap.name) || (!looksLikeError(sheetTeacherName) && sheetTeacherName) || null,
      location: (r["Địa điểm / Ghi chú"]||r["Dia diem / Ghi chu"]||"").trim(),
      isHoliday: code === "NGHI_LE" || /nghỉ lễ/i.test(sheetSubjectName),
    });
  });
  return {lessons: out, skippedNoDate, skippedNoCode};
}
function buildCatalogMap(rows, codeKeys, nameKeys, extra){
  const map = {};
  rows.forEach(r=>{
    let code = "", name = "";
    for(const k of codeKeys){ if(r[k]){ code=r[k].trim(); break; } }
    for(const k of nameKeys){ if(r[k]){ name=r[k].trim(); break; } }
    if(code) map[code.toLowerCase()] = {code, name};
  });
  return map;
}
function buildSubjects(rows){
  return buildCatalogMap(rows, ["Mã môn","Ma mon"], ["Tên bài / môn học","Tên môn học","Ten bai / mon hoc"]);
}
function buildTeachers(rows){
  const map = buildCatalogMap(rows, ["Mã GV","Ma GV"], ["Tên giáo viên","Ten giao vien"]);
  return Object.values(map);
}

/* ================= Constants ================= */
const TRACKS = [
  {key:"P301", label:"Quân y · L1 (P301)"},
  {key:"P303", label:"Quân y · L2 (P303)"},
  {key:"P302", label:"Quân y · L3 (P302)"},
  {key:"QY", label:"Quân y"},
  {key:"QNhu", label:"Quân nhu"},
  {key:"QKhi", label:"Quân khí"},
  {key:"TChinh", label:"Tài chính"},
];
const QUAN_Y = ["P301","P302","P303","QY"];
const SHORT_GROUP = {QY:"Q.y", QNhu:"Q.n", QKhi:"Q.k", TChinh:"T.c"};
const SLOTS = [
  {key:"s1", periods:["1-3","2-3"]},
  {key:"s2", periods:["4-5"]},
  {key:"s3", periods:["6-8"]},
];
function slotOf(period){ return SLOTS.find(s=>s.periods.includes(period)) || SLOTS[0]; }
function trackVar(key){ return {P301:"p301", P303:"p301", P302:"p301", QY:"p301", QNhu:"nhu", QKhi:"khi", TChinh:"p303"}[key] || "p301"; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtVN(iso){ if(!iso) return ""; const d=parseISO(iso); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function mondayOf(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return toISO(d); }
function weekdayNameOf(iso){ const d=parseISO(iso); const names=["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"]; return names[d.getDay()]; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function periodStart(p){ return parseInt(String(p).split("-")[0],10) || 0; }
function sortLessons(a,b){ const pa=periodStart(a.period), pb=periodStart(b.period); if(pa!==pb) return pa-pb; return TRACKS.findIndex(t=>t.key===a.room)-TRACKS.findIndex(t=>t.key===b.room); }
const TODAY = todayISO();

let lessons = [];
let teachers = [];
let IDX = {byDate:{}, MIN_DATE:null, MAX_DATE:null};
function reindex(){
  const byDate = {}; let MIN_DATE=null, MAX_DATE=null;
  lessons.forEach(l=>{

  IDX = {byDate, MIN_DATE, MAX_DATE};
}

function showSetupInstructions(){
  showStatus("setup",
    "<h3>Chưa kết nối dữ liệu</h3>" +
    "<p>Trang này cần 4 link CSV từ Google Sheet của Trưởng khoa. Mở file HTML này bằng trình soạn thảo văn bản, tìm phần <code>CẤU HÌNH</code> ở đầu &lt;script&gt; và dán 4 link đã lấy từ Google Sheet (File → Chia sẻ → Xuất bản lên web → chọn từng sheet → định dạng CSV) vào 4 biến:</p>" +
    "<ol><li><code>CSV_URL_LESSONS</code> — sheet \"Lich giang day\"</li>" +
    "<li><code>CSV_URL_SUBJECTS</code> — sheet \"DanhMucMonHoc\"</li>" +
    "<li><code>CSV_URL_TEACHERS</code> — sheet \"DanhMucGiaoVien\"</li></ol>"
  );
}
function showLoading(){
  showStatus("", "<div class='spinner'></div><p>Đang tải dữ liệu từ Google Sheet…</p>");
}
function showError(msg){
  showStatus("error",
    "<h3>Không tải được dữ liệu</h3><p>"+escapeHtml(msg)+"</p>" +
    "<p>Kiểm tra: link CSV đã được \"Xuất bản lên web\" đúng sheet chưa, và mạng có đang chặn docs.google.com không.</p>" +
    "<button class='btn btn-outline btn-sm' id='retryBtn'>Thử lại</button>"
  );
  const b = document.getElementById("retryBtn");
  if(b) b.addEventListener("click", loadAllData);
}

/* ================= Load data ================= */
async function loadAllData(){
  if(!isConfigured()){ showSetupInstructions(); return; }
  showLoading();
  document.getElementById("pinToday").style.display = "none";
  try{
    const [lessonRows, subjRows, teachRows] = await Promise.all([
      fetchCSV(CSV_URL_LESSONS), fetchCSV(CSV_URL_SUBJECTS), fetchCSV(CSV_URL_TEACHERS)
    ]);
    const subjMap = buildSubjects(subjRows);
    teachers = buildTeachers(teachRows);
    const teachMap = {}; teachers.forEach(t=>teachMap[t.code.toLowerCase()]=t);
    const built = buildLessons(lessonRows, subjMap, teachMap);
    lessons = built.lessons;
    reindex();
    clearStatus();
    document.getElementById("pinToday").style.display = "";
    const anchor = (IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE) ? TODAY : (IDX.MIN_DATE||TODAY);
    state.weekAnchor = mondayOf(anchor);
    state.weekDay = defaultWeekDay(state.weekAnchor);
    state.monthAnchor = anchor.slice(0,7)+"-01";
    refreshTeacherSelect();
    renderAll();
  }catch(err){
    showError(err.message || String(err));
  }
  await loadTasks();
}
async function loadTasks(){
  if(!CSV_URL_TASKS){ tasksStatus="nocfg"; tasks=[]; reindexTasks(); return; }
  tasksStatus = "loading";
  try{
    const rows = await fetchCSV(CSV_URL_TASKS);
    tasks = buildTasks(rows); reindexTasks(); tasksStatus = "ok";
  }catch(err){
    tasks = []; reindexTasks(); tasksStatus = "error"; tasksError = err.message || String(err);
  }
  renderAll();
}
document.getElementById("refreshBtn").addEventListener("click", loadAllData);

/* ================= Teacher select ================= */
function refreshTeacherSelect(){
  const sel = document.getElementById("teacherSelect");
  const cur = sel.value;
  sel.innerHTML = '<option value="">Tất cả GV</option>';
  teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'vi')).forEach(t=>{
    const opt=document.createElement("option"); opt.value=t.code; opt.textContent=t.name; sel.appendChild(opt);
  });
  sel.value = cur;
}
document.getElementById("teacherSelect").addEventListener("change", (e)=>{ state.teacher = e.target.value; renderAll(); });

/* ================= Chip + detail modal ================= */
const detailOverlay = document.getElementById("detailOverlay");
document.getElementById("detailClose").addEventListener("click", ()=>detailOverlay.classList.remove("show"));
detailOverlay.addEventListener("click", (e)=>{ if(e.target===detailOverlay) detailOverlay.classList.remove("show"); });

function openDetail(lesson){
  const body = document.getElementById("detailBody");
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  body.innerHTML = [
    ["Môn học", lesson.subject],
    ["Mã môn", lesson.code],
    ["Nhóm/Lớp", lesson.isHoliday ? "—" : (trackInfo?trackInfo.label:lesson.room)],
    ["Ngày", weekdayNameOf(lesson.date)+", "+fmtVN(lesson.date)],
    ["Tiết", lesson.period||"—"],
    ["Giáo viên", lesson.teacher || "Chưa rõ"],
    ["Địa điểm / Ghi chú", lesson.location || "—"],
  ].map(([k,v])=>"<div class='kv'><span class='k'>"+k+"</span><span class='v'>"+escapeHtml(v)+"</span></div>").join("");
  detailOverlay.classList.add("show");
}
function chipEl(lesson){
  const el = document.createElement("div");
  const trackClass = lesson.isHoliday ? "holiday" : "track-"+lesson.room;
  el.className = "chip " + trackClass;
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  const tagText = lesson.isHoliday ? "NGHỈ" : (SHORT_GROUP[groupOf(lesson)] || lesson.room);
  el.innerHTML =
    "<div class='chip-grid'>" +
    "<div class='chip-left'><div class='chip-top'><span class='chip-track-tag'>"+escapeHtml(tagText)+"</span>" +
    "<span class='chip-code'>tiết "+escapeHtml(lesson.period||"")+"</span></div>" +
    "<div class='chip-subject'>"+escapeHtml(lesson.isHoliday ? lesson.subject : lesson.code)+"</div></div>" +
    "<div class='chip-right'><span class='chip-teacher'>"+escapeHtml(lesson.teacher || (lesson.isHoliday? "" : "GV: chưa rõ"))+"</span>" +
    (lesson.location ? "<div class='chip-loc'>📍 "+escapeHtml(lesson.location)+"</div>" : "") + "</div></div>";
  if(state.teacher){
    if(lesson.teacherCode && lesson.teacherCode.toLowerCase() === state.teacher.toLowerCase()) el.classList.add("match");
    else el.classList.add("dim");
  }
  el.addEventListener("click", ()=>openDetail(lesson));
  return el;
}

/* ================= Pinned today ================= */
function nextLessonFrom(iso){
  const dates = Object.keys(IDX.byDate).filter(d=>d>iso).sort();
  for(const d of dates){ if(IDX.byDate[d].length) return IDX.byDate[d].slice().sort(sortLessons)[0]; }
  return null;
}
function taskCountFor(dateIso){ return (TASKIDX[dateIso]||[]).length; }
function renderPin(){
  const inRange = IDX.MIN_DATE && TODAY >= IDX.MIN_DATE && TODAY <= IDX.MAX_DATE;
  const todays = (IDX.byDate[TODAY] || []).slice().sort(sortLessons);
  const nT = taskCountFor(TODAY);
  const body = document.getElementById("pinBody");
  body.innerHTML = "";
  if(nT){
    const tl = document.createElement("div"); tl.className="task-list";
    TASKIDX[TODAY].forEach((t,i)=>tl.appendChild(taskItemEl(t,i)));
    body.appendChild(tl);
  } else {
    const p = document.createElement("div"); p.className="pin-empty";
    p.textContent = tasksStatus==="nocfg" ? "Chưa kết nối sheet công việc." : "Hôm nay chưa có công việc nào được ghi.";
    body.appendChild(p);
  }
  if(inRange){
    const line = document.createElement("div"); line.className = "pin-lessons" + (todays.length ? "" : " none");
    line.innerHTML = todays.length
      ? "<span class='pl-ico'>📚</span><span class='pl-txt'><b>" + todays.length + "</b> buổi học</span>"
      : "<span class='pl-ico'>📚</span><span class='pl-txt'>Không có buổi học</span>";
    const head = document.getElementById("pinHead");
    const old = head.querySelector(".pin-lessons"); if(old) old.remove();
    head.appendChild(line);
  }
  const linkBtn = document.createElement("button");
  linkBtn.className = "pin-tasklink";
  linkBtn.textContent = "Xem tất cả";
  linkBtn.setAttribute("aria-label","Xem tất cả công việc");
  linkBtn.addEventListener("click", (e)=>{ e.stopPropagation(); state.taskDate=TODAY; document.querySelector('.tab[data-tab="tasks"]').click(); });
  const lastBody = body.querySelector(".task-item:last-child .task-body");
  if(lastBody){
    const row = document.createElement("div"); row.className = "pin-noterow";
    const note = lastBody.querySelector(".task-note");
    if(note) row.appendChild(note);
    row.appendChild(linkBtn);
    lastBody.appendChild(row);
  } else {
    body.appendChild(linkBtn);
  }
}

document.getElementById("todayBtn").addEventListener("click", ()=>{
  const anchor = (IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE) ? TODAY : (IDX.MIN_DATE||TODAY);
  state.weekAnchor = mondayOf(anchor); state.weekDay = defaultWeekDay(state.weekAnchor); state.monthAnchor = anchor.slice(0,7)+"-01"; state.selectedDay = anchor; state.taskDate = TODAY;

    let target = null;
    if(state.tab === "week") target = document.querySelector("#view-week .day-card.is-today") || document.querySelector("#view-week .bar");

    const offset = (hdr ? hdr.offsetHeight : 0) + 10;
    const top = target.getBoundingClientRect().top + (window.scrollY || 0) - offset;
    window.scrollTo({top:Math.max(0, top), behavior:"smooth"});
  });
});

/* ================= Week view ================= */
function lessonColor(l){ return l.isHoliday ? "red" : trackVar(l.room); }
function weekDaysOf(anchor){ return [0,1,2,3,4].map(i=>addDays(anchor,i)); }
function defaultWeekDay(anchor){ return weekDaysOf(anchor).includes(TODAY) ? TODAY : null; }
function animIn(el, dir){
  if(!el || !el.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  el.animate([{opacity:0, transform:"translate3d("+(dir*28)+"px,"+(dir?0:10)+"px,0) scale(.99)"},{opacity:1, transform:"none"}],
    {duration:420, easing:"cubic-bezier(.22,.8,.24,1)"});
}
function renderWeek(){
  const root = document.getElementById("view-week");
  root.innerHTML = "";
  if(!IDX.MIN_DATE) return;
  const days = weekDaysOf(state.weekAnchor);
  if(state.weekDay && !days.includes(state.weekDay)) state.weekDay = null;
  const dir = state.slideDir || 0; state.slideDir = 0;

  /* --- Hàng ô chọn ngày --- */
  const strip = document.createElement("div"); strip.className="week-strip";
  const mkCell = (iso)=>{
    const b = document.createElement("button");
    const all = !iso;
    const list = all ? days.flatMap(d=>IDX.byDate[d]||[]) : (IDX.byDate[iso]||[]);
    const active = all ? !state.weekDay : state.weekDay===iso;
    b.className = "ws-day" + (all?" ws-all":"") + (iso===TODAY?" is-today":"") + (list.length?"":" empty") + (active?" active":"");
    const colors = []; ["p301","nhu","khi","p303","red"].forEach(c=>{ if(list.some(l=>lessonColor(l)===c)) colors.push(c); });
    const bars = "<span class='ws-bars'>"+(colors.length ? colors.map(c=>"<i style='background:var(--"+c+")'></i>").join("") : "<i class='none'></i>")+"</span>";
    if(all){
      b.innerHTML = "<span class='ws-wd'>Cả</span><span class='ws-dd'>tuần</span>"+bars+"<span class='ws-n'>"+list.length+" buổi</span>";
    } else {
      const d = parseISO(iso);
      b.innerHTML = "<span class='ws-wd'>"+["CN","T2","T3","T4","T5","T6","T7"][d.getDay()]+"</span><span class='ws-dd'>"+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"</span>"+bars+"<span class='ws-n'>"+(list.length? list.length+" buổi" : "trống")+"</span>";
    }
    b.addEventListener("click", ()=>{
      if((iso||null) === state.weekDay) return;
      const order = [null].concat(days);
      state.slideDir = order.indexOf(iso||null) > order.indexOf(state.weekDay) ? 1 : -1;
      state.weekDay = iso || null;
      renderWeek();
      const st = document.querySelector("#view-week .week-strip"), hdr = document.querySelector("header.top");
      if(st){ const top = st.getBoundingClientRect().top - (hdr?hdr.offsetHeight:0) - 8; if(top < 0) window.scrollTo({top:Math.max(0,(window.scrollY||0)+top), behavior:"smooth"}); }
    });
    return b;
  };
  strip.appendChild(mkCell(null));
  days.forEach(iso=>strip.appendChild(mkCell(iso)));
  root.appendChild(strip);

  /* --- Thanh tuần --- */
  const bar = document.createElement("div"); bar.className="bar";
  bar.innerHTML = "<h2>Tuần "+fmtVN(state.weekAnchor)+" – "+fmtVN(addDays(state.weekAnchor,4))+"</h2>";
  const navGroup = document.createElement("div"); navGroup.className="nav-group";
  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹"; prev.setAttribute("aria-label","Tuần trước");
  const next = document.createElement("button"); next.className="iconbtn"; next.textContent="›"; next.setAttribute("aria-label","Tuần sau");
  const go = (n)=>{ state.weekAnchor=addDays(state.weekAnchor,7*n); state.weekDay=defaultWeekDay(state.weekAnchor); state.slideDir=n; renderAll(); };
  prev.addEventListener("click", ()=>go(-1)); next.addEventListener("click", ()=>go(1));
  navGroup.appendChild(prev); navGroup.appendChild(next); bar.appendChild(navGroup);
  root.appendChild(bar);

  /* --- Thẻ ngày --- */
  const wrap = document.createElement("div"); wrap.className="week-cards";
  (state.weekDay ? [state.weekDay] : days).forEach((iso, idx)=>{
    const dayLessons = IDX.byDate[iso]||[];
    const card = document.createElement("div");
    card.className = "day-card" + (iso===TODAY?" is-today":""); card.id = "day-"+iso;
    card.style.setProperty("--i", idx);
    const d = parseISO(iso);
    const head = document.createElement("div"); head.className="day-head";
    head.innerHTML = "<span class='wd'>"+weekdayNameOf(iso)+"</span><span class='dd'>"+d.getDate()+"</span><span class='dt'>"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+"</span>"+(iso===TODAY?"<span class='today-badge'>Hôm nay</span>":"");
    card.appendChild(head);
    SLOTS.forEach(slot=>{
      const slotLessons = dayLessons.filter(l=>l.period && slotOf(l.period).key===slot.key).sort((a,b)=>TRACKS.findIndex(t=>t.key===a.room)-TRACKS.findIndex(t=>t.key===b.room));
      if(!slotLessons.length) return;
      const block = document.createElement("div"); block.className="slot-block";
      block.innerHTML = "<div class='slot-period'><span class='sp-k'>Tiết</span><span class='sp-n'>"+escapeHtml(slotLessons[0].period)+"</span><span class='sp-s'>"+(slot.key==="s3"?"Chiều":"Sáng")+"</span></div>";
      const chips = document.createElement("div"); chips.className="slot-chips";
      slotLessons.forEach(l=>chips.appendChild(chipEl(l)));
      block.appendChild(chips);
      card.appendChild(block);
    });
    if(!dayLessons.length){
      const empty = document.createElement("div"); empty.className="slot-empty"; empty.textContent="Không có lịch học.";
      card.appendChild(empty);
    }
    wrap.appendChild(card);
  });
  root.appendChild(wrap);
  animIn(wrap, dir);
}

/* ================= Month view ================= */
function renderMonth(){
  const root = document.getElementById("view-month");
  root.innerHTML = "";
  if(!IDX.MIN_DATE) return;
  const [y,m] = state.monthAnchor.split("-").map(Number);
  const monthDate = new Date(y, m-1, 1);
  const bar = document.createElement("div"); bar.className="bar";
  bar.innerHTML = "<h2>Tháng "+m+"/"+y+"</h2>";
  const navGroup = document.createElement("div"); navGroup.className="nav-group";
  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹";
  const next = document.createElement("button"); next.className="iconbtn"; next.textContent="›";
  prev.addEventListener("click", ()=>{ const d=new Date(y,m-2,1); state.monthAnchor=toISO(d).slice(0,7)+"-01"; renderAll(); });
  next.addEventListener("click", ()=>{ const d=new Date(y,m,1); state.monthAnchor=toISO(d).slice(0,7)+"-01"; renderAll(); });
  navGroup.appendChild(prev); navGroup.appendChild(next); bar.appendChild(navGroup);
  const detail = document.createElement("div"); detail.className="day-detail"; detail.id="monthDayDetail";
  root.appendChild(detail);
  root.appendChild(bar);

  const mine = (l)=> state.teacher && l.teacherCode && l.teacherCode.toLowerCase()===state.teacher.toLowerCase();
  if(state.teacher){
    const tName = (teachers.find(t=>t.code.toLowerCase()===state.teacher.toLowerCase())||{}).name || state.teacher;
    const prefix = state.monthAnchor.slice(0,7);
    const mm = lessons.filter(l=>l.date.startsWith(prefix) && mine(l));
    const nDays = new Set(mm.map(l=>l.date)).size;
    const banner = document.createElement("div"); banner.className="teach-banner";
    banner.textContent = "Đang tô sáng ngày dạy của "+tName+": "+nDays+" ngày · "+mm.length+" buổi trong tháng "+m+"/"+y+".";
    root.appendChild(banner);
  }
  const scrollWrap = document.createElement("div"); scrollWrap.className="month-scroll";
  const grid = document.createElement("div"); grid.className="month-grid";
  ["T2","T3","T4","T5","T6","T7","CN"].forEach(l=>{ const el=document.createElement("div"); el.className="wd-label"; el.textContent=l; grid.appendChild(el); });
  const firstDow = (monthDate.getDay()+6)%7;
  const startIso = toISO(new Date(y, m-1, 1-firstDow));
  for(let i=0;i<42;i++){
    const iso = addDays(startIso, i);
    const inMonth = iso.slice(0,7) === state.monthAnchor.slice(0,7);
    const cell = document.createElement("div");
    cell.className = "month-cell"+(inMonth?"":" out")+(iso===TODAY?" is-today":"")+(iso===state.selectedDay?" selected":"");
    const allDay = IDX.byDate[iso]||[];
    const dayLessons = state.teacher ? allDay.filter(mine) : allDay;
    if(state.teacher){ cell.classList.add(dayLessons.length ? "teach-hit" : "teach-off"); }
    const num = document.createElement("div"); num.className="num"; num.textContent=String(parseISO(iso).getDate());
    cell.appendChild(num);
    {
      const dots = document.createElement("div"); dots.className="month-dots"; const seen={};
      dayLessons.forEach(l=>{ const k=l.isHoliday?"holiday":trackVar(l.room); if(seen[k])return; seen[k]=1;
        const d=document.createElement("span"); d.className="dot"; d.style.background=l.isHoliday?"var(--red)":"var(--"+trackVar(l.room)+")"; dots.appendChild(d); });
      cell.appendChild(dots);
      if(dayLessons.length){
        const cnt = document.createElement("div"); cnt.className="month-count"; cnt.textContent=dayLessons.length+" buổi";
        cell.appendChild(cnt);
      }
    }
    if(taskCountFor(iso)){
      const tk = document.createElement("div"); tk.className="month-task"; tk.textContent="📝 "+taskCountFor(iso);
      cell.appendChild(tk);
    }
    cell.addEventListener("click", ()=>{ state.selectedDay=iso; renderMonth(); renderDayDetail(); });
    grid.appendChild(cell);
  }
  scrollWrap.appendChild(grid); root.appendChild(scrollWrap);
  const lgM = document.createElement("div"); lgM.className="legend legend-month";
  lgM.innerHTML = [["p301","Q.y"],["nhu","Q.n"],["khi","Q.k"],["p303","T.c"]].map(([v,label])=>"<span><span class='dot' style='background:var(--"+v+")'></span>"+label+"</span>").join("");
  root.appendChild(lgM);
  const lessonDetail = document.createElement("div"); lessonDetail.className="day-detail"; lessonDetail.id="monthLessonDetail";
  root.appendChild(lessonDetail);
  renderDayDetail();
}
function renderDayDetail(){
  const elT = document.getElementById("monthDayDetail");
  const elL = document.getElementById("monthLessonDetail");
  if(!elT && !elL) return;
  const iso = state.selectedDay || ((IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE)?TODAY:(IDX.MIN_DATE||TODAY));
  const dateLabel = weekdayNameOf(iso)+", "+fmtVN(iso);
  if(elT){
    const panel = document.createElement("div"); panel.className="panel panel-compact";
    panel.innerHTML = "<h3>Công việc triển khai · "+dateLabel+"</h3>";
    const dayTasks = TASKIDX[iso]||[];
    if(dayTasks.length){
      const tl = document.createElement("div"); tl.className="task-list"; tl.style.marginTop="6px"; tl.style.marginBottom="0";
      dayTasks.forEach(t=>tl.appendChild(taskItemEl(t)));
      panel.appendChild(tl);
    } else {
      const e=document.createElement("div"); e.className="pin-empty"; e.textContent="Không có công việc triển khai ngày này.";
      panel.appendChild(e);
    }
    elT.innerHTML=""; elT.appendChild(panel);
  }
  if(elL){
    const lessonsHere = (IDX.byDate[iso]||[]).slice().sort(sortLessons);
    const panel = document.createElement("div"); panel.className="panel";
    panel.innerHTML = "<h3>Lịch học · "+dateLabel+"</h3>";
    const wrap = document.createElement("div"); wrap.className="md-slots";
    SLOTS.forEach(slot=>{
      const sl = lessonsHere.filter(l=>l.period && slotOf(l.period).key===slot.key);
      if(!sl.length) return;
      const block = document.createElement("div"); block.className="slot-block";
      block.innerHTML = "<div class='slot-period'><span class='sp-k'>Tiết</span><span class='sp-n'>"+escapeHtml(sl[0].period)+"</span><span class='sp-s'>"+(slot.key==="s3"?"Chiều":"Sáng")+"</span></div>";
      const chips = document.createElement("div"); chips.className="slot-chips";
      sl.forEach(l=>chips.appendChild(chipEl(l)));
      block.appendChild(chips); wrap.appendChild(block);
    });
    const noPeriod = lessonsHere.filter(l=>!l.period);
    if(noPeriod.length){ const g=document.createElement("div"); g.className="pin-grid"; noPeriod.forEach(l=>g.appendChild(chipEl(l))); wrap.appendChild(g); }
    if(!lessonsHere.length){ const e=document.createElement("div"); e.className="pin-empty"; e.textContent="Không có lịch học ngày này."; wrap.appendChild(e); }
    panel.appendChild(wrap);
    if(wrap.animate) wrap.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:350,easing:"cubic-bezier(.22,.8,.24,1)"});
    elL.innerHTML=""; elL.appendChild(panel);
  }
}

/* ================= Stats view ================= */
function renderStats(){
  const root = document.getElementById("view-stats");
  root.innerHTML = "";
  if(!IDX.MIN_DATE) return;
  const total = lessons.length;
  const weekEnd = addDays(state.weekAnchor,4);
  const thisWeek = lessons.filter(l=>l.date>=state.weekAnchor && l.date<=weekEnd).length;
  const monthPrefix = state.monthAnchor.slice(0,7);
  const thisMonth = lessons.filter(l=>l.date && l.date.startsWith(monthPrefix)).length;

    const date = normalizeDate(r["Ngày"]||r["Ngay"]||"");
    const title = (r["Nội dung công việc"]||r["Noi dung cong viec"]||"").trim();
    if(!date || !title) return;
    out.push({

      people: (r["Thành phần"]||r["Thanh phan"]||"").trim(),
      note: (r["Ghi chú"]||r["Ghi chu"]||"").trim(),
    });
  });
  return out;
}

}

function countdownHtml(iso){

/* ================= Công cụ: thống kê, lọc theo giáo viên, xuất PDF ================= */
const GROUPS = [
  {key:"QY", label:"Q.y", v:"p301"}, {key:"QNhu", label:"Q.n", v:"nhu"},
  {key:"QKhi", label:"Q.k", v:"khi"}, {key:"TChinh", label:"T.c", v:"p303"},
];
function groupOf(l){ return QUAN_Y.includes(l.room) ? "QY" : l.room; }
function groupLabel(l){ const g = GROUPS.find(x=>x.key===groupOf(l)); return g ? g.label : (l.room||"—"); }
function periodCount(p){
  const m = String(p||"").match(/(\d+)\s*-\s*(\d+)/);
  if(m) return Math.max(1, (+m[2]) - (+m[1]) + 1);
  return p ? 1 : 0;
}
function teacherNameOf(code){ const t = teachers.find(x=>x.code.toLowerCase()===String(code).toLowerCase()); return t ? t.name : code; }
function toolData(){
  const f = state.tool;
  const rows = lessons.filter(l=>{
    if(l.isHoliday) return false;
    if(f.teacher && !(l.teacherCode && l.teacherCode.toLowerCase()===f.teacher.toLowerCase())) return false;
    if(f.group && groupOf(l)!==f.group) return false;
    if(f.from && l.date<f.from) return false;
    if(f.to && l.date>f.to) return false;
    return true;
  }).sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : sortLessons(a,b));
  const sumP = rows.reduce((s,l)=>s+periodCount(l.period),0);
  const days = new Set(rows.map(l=>l.date)).size;
  const byT = {};
  rows.forEach(l=>{ const k=l.teacher||"Chưa rõ"; const o = byT[k] || (byT[k]={name:k,n:0,p:0,d:new Set()}); o.n++; o.p+=periodCount(l.period); o.d.add(l.date); });
  const tRows = Object.values(byT).sort((a,b)=> b.p-a.p || a.name.localeCompare(b.name,"vi"));
  const gRows = GROUPS.map(g=>{
    const rs = rows.filter(l=>groupOf(l)===g.key);
    return {key:g.key, label:g.label, v:g.v, n:rs.length, p:rs.reduce((s,l)=>s+periodCount(l.period),0)};
  });
  const gl = f.group ? (GROUPS.find(g=>g.key===f.group)||{}).label : "Tất cả";
  const filterText = [
    "Giáo viên: " + (f.teacher ? teacherNameOf(f.teacher) : "Tất cả"),
    "Ngành: " + gl,
    "Thời gian: " + ((f.from||f.to) ? ((f.from?fmtVN(f.from):"…") + " – " + (f.to?fmtVN(f.to):"…")) : "Toàn bộ"),
  ].join("  ·  ");
  return {rows, sumP, days, tRows, gRows, filterText, nTeachers: tRows.filter(t=>t.name!=="Chưa rõ").length};
}
