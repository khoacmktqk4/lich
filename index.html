<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lịch giảng dạy — Khoa Chuyên môn Kỹ thuật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202B; --ink-2:#26333F; --paper:#F5F2EA; --paper-2:#EDE8DB; --card:#FFFFFF;
  --line:#DAD4C2; --line-soft:#E7E2D2; --muted:#6B7280;
  --gold:#C7922B; --gold-soft:#F2E2BE;
  --p301:#6E7B4F; --p301-soft:#E7EBDC; --p303:#A9683D; --p303-soft:#F2E4D6;
  --p302:#3E7C7B; --p302-soft:#DCECEB; --nhu:#B5602E; --nhu-soft:#F3E1D3;
  --khi:#3E6E8E; --khi-soft:#DCE7EE; --red:#A83B32; --red-soft:#F3DEDB;
  --radius-s:4px; --radius-m:8px;
  --font-serif:'Source Serif 4', Georgia, serif;
  --font-sans:'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDE8DB; --ink-2:#D8D2C0; --paper:#161A1E; --paper-2:#1D2229; --card:#1F252C;
    --line:#333B44; --line-soft:#2A3138; --muted:#9AA3AD;
    --p301-soft:#26301F; --p303-soft:#2E241A; --p302-soft:#1B2C2C;
    --nhu-soft:#2E2018; --khi-soft:#1B2733; --gold-soft:#332811; --red-soft:#301E1C;
  }
}
:root[data-theme="dark"]{
  --ink:#EDE8DB; --ink-2:#D8D2C0; --paper:#161A1E; --paper-2:#1D2229; --card:#1F252C;
  --line:#333B44; --line-soft:#2A3138; --muted:#9AA3AD;
  --p301-soft:#26301F; --p303-soft:#2E241A; --p302-soft:#1B2C2C;
  --nhu-soft:#2E2018; --khi-soft:#1B2733; --gold-soft:#332811; --red-soft:#301E1C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--font-sans); font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-serif); font-weight:600; margin:0;}
button{font-family:var(--font-sans); cursor:pointer;}

header.top{position:sticky; top:0; z-index:40; background:var(--ink); color:var(--paper); padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px; border-bottom:3px solid var(--gold);}
.top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; max-width:1180px; margin:0 auto; flex-wrap:wrap;}
.brand-eyebrow{font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; color:var(--gold); margin-bottom:2px;}
.brand h1{font-size:17px; color:#fff; line-height:1.2;}
.brand p{margin:3px 0 0; font-size:11.5px; color:#B9C2CC;}
.toolbar{display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%; margin-top:8px;}
select.sel{background:#1F2A36; color:#fff; border:1px solid #3A4753; border-radius:var(--radius-s); padding:8px 8px; font-size:13px; flex:1 1 140px; min-width:0;}
.btn{font-size:12.5px; font-weight:600; border-radius:var(--radius-s); border:1px solid transparent; padding:8px 11px; display:inline-flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap;}
.btn-gold{background:var(--gold); color:#1B1204; border-color:var(--gold);}
.btn-ghost{background:transparent; color:#fff; border-color:#3A4753;}
.btn-ghost:hover{background:#1F2A36;}
.btn-outline{background:var(--card); color:var(--ink); border-color:var(--line);}
.btn-sm{font-size:11px; padding:5px 9px;}

nav.tabs{display:flex; gap:3px; max-width:1180px; margin:9px auto 0; border-top:1px solid #2C3947; padding-top:7px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.tab{font-size:12.5px; font-weight:600; color:#B9C2CC; background:transparent; border:none; padding:7px 10px; border-radius:var(--radius-s) var(--radius-s) 0 0; white-space:nowrap; flex-shrink:0;}
.tab[aria-selected="true"]{color:#fff; background:var(--ink-2); box-shadow:inset 0 -2px 0 var(--gold);}

main{max-width:1180px; margin:0 auto; padding:12px 12px 60px;}

/* status panels */
.status-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; margin-bottom:16px;}
.status-panel h3{font-size:15px; margin-bottom:8px;}
.status-panel p{font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 8px;}
.status-panel ol{margin:8px 0 0; padding-left:20px; font-size:13px; color:var(--ink); line-height:1.8;}
.status-panel code{background:var(--paper-2); padding:1px 5px; border-radius:3px; font-family:var(--font-mono); font-size:12px;}
.spinner{width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.status-panel.error{border-color:var(--red); border-left:4px solid var(--red);}
.status-panel.setup{border-color:var(--gold); border-left:4px solid var(--gold);}

.pin{background:var(--card); border:1px solid var(--gold); border-left:5px solid var(--gold); border-radius:var(--radius-m); padding:10px 14px; margin-bottom:16px;}
.pin-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:10px;}
.pin-head-left{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;}
.pin-tag{font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; background:var(--gold); color:#1B1204; padding:2px 6px; border-radius:3px; font-weight:600;}
.pin-date{font-family:var(--font-serif); font-weight:600; font-size:15px;}
.pin-sub{font-size:12px; color:var(--muted);}
.pin-toggle{background:none; border:none; color:var(--muted); font-size:17px; padding:2px 6px;}
.pin-body{margin-top:10px;}
.pin-empty{font-size:13px; color:var(--muted); padding:5px 0;}
.pin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px;}
.pin-tasklink{margin-top:8px; font-size:12px; color:var(--muted); background:none; border:none; padding:0; text-decoration:underline; cursor:pointer; display:block;}

.chip{border-radius:var(--radius-s); padding:8px 10px; border:1px solid var(--line); position:relative; min-height:44px; cursor:pointer;}
.chip:active{transform:scale(.98);}
.chip-top{display:flex; align-items:center; gap:6px;}
.chip-track-tag{font-family:var(--font-mono); font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; background:rgba(0,0,0,.08); letter-spacing:.02em;}
.chip-code{font-family:var(--font-mono); font-size:10.5px; font-weight:600; opacity:.85;}
.chip-subject{font-size:13px; font-weight:600; margin-top:3px; line-height:1.3;}
.chip-teacher{font-size:11.5px; color:var(--muted); margin-top:3px;}
.chip.track-P301{background:var(--p301-soft); border-color:var(--p301);}
.chip.track-P303{background:var(--p303-soft); border-color:var(--p303);}
.chip.track-P302{background:var(--p302-soft); border-color:var(--p302);}
.chip.track-QNhu{background:var(--nhu-soft); border-color:var(--nhu);}
.chip.track-QKhi{background:var(--khi-soft); border-color:var(--khi);}
.chip.holiday{background:var(--red-soft); border-color:var(--red);}
.chip.dim{opacity:.28; filter:grayscale(.4);}
.chip.match{outline:2px solid var(--gold); outline-offset:1px;}

.bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.bar h2{font-size:16.5px;}
.nav-group{display:flex; align-items:center; gap:6px;}
.iconbtn{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:15px; display:flex; align-items:center; justify-content:center; color:var(--ink);}
.legend{display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-bottom:12px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.dot{width:9px; height:9px; border-radius:2px; display:inline-block;}

.day-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); margin-bottom:12px; overflow:hidden;}
.day-card.is-today{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
.day-head{display:flex; align-items:baseline; gap:10px; padding:9px 12px; background:var(--paper-2); border-bottom:1px solid var(--line);}
.day-head .wd{font-family:var(--font-serif); font-weight:600; font-size:14.5px;}
.day-head .dt{font-family:var(--font-mono); font-size:12px; color:var(--muted);}
.day-head .today-badge{margin-left:auto; font-family:var(--font-mono); font-size:9.5px; background:var(--gold); color:#1B1204; padding:2px 6px; border-radius:3px; font-weight:600;}
.slot-block{padding:10px 12px; border-top:1px solid var(--line-soft);}
.slot-block:first-child{border-top:none;}
.slot-head{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:7px; display:flex; align-items:center; justify-content:space-between;}
.slot-chips{display:flex; flex-wrap:wrap; gap:7px;}
.slot-chips > .chip{flex:1 1 220px;}
@media (max-width:560px){ .slot-chips > .chip{flex:1 1 100%;} }
.slot-empty{font-size:12px; color:var(--muted); padding:4px 2px;}

.month-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px;}
.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; min-width:520px;}
.month-grid .wd-label{font-family:var(--font-mono); font-size:10px; color:var(--muted); text-align:center; padding-bottom:2px;}
.month-cell{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-s); min-height:60px; padding:5px; cursor:pointer; display:flex; flex-direction:column; gap:4px;}
.month-cell.out{opacity:.35;}
.month-cell.is-today{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
.month-cell.selected{background:var(--gold-soft);}
.month-cell .num{font-family:var(--font-mono); font-size:12px; font-weight:600;}
.month-dots{display:flex; flex-wrap:wrap; gap:3px; margin-top:auto;}
.month-dots .dot{width:7px; height:7px;}
.month-count{font-size:9.5px; color:var(--muted); font-family:var(--font-mono);}
.day-detail{margin-top:14px;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px;}
.stat-card{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:var(--radius-m); padding:13px 15px;}
.stat-num{font-family:var(--font-serif); font-size:25px; font-weight:600; line-height:1;}
.stat-label{font-size:11.5px; color:var(--muted); margin-top:6px;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:14px;}
.panel h3{font-size:14px; margin-bottom:10px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:7px; font-size:12.5px;}
.bar-row .name{width:105px; flex-shrink:0; font-size:11.5px;}
.bar-row .track{flex:1; background:var(--paper-2); border-radius:3px; height:15px; position:relative; overflow:hidden;}
.bar-row .fill{background:var(--gold); height:100%; border-radius:3px;}
.bar-row .n{width:28px; text-align:right; font-family:var(--font-mono); font-size:11.5px; color:var(--muted); flex-shrink:0;}

/* Cong viec theo ngay (do Truong khoa ghi, doc tu Google Sheet) */
.log-nav{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.log-nav .datelabel{flex:1; font-family:var(--font-serif); font-weight:600; font-size:15px; text-align:center;}
.task-list{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
.task-item{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:var(--radius-s); padding:10px 12px;}
.task-title{font-size:14px; font-weight:600; line-height:1.4; word-break:break-word;}
.task-meta{font-size:12.5px; color:var(--ink-2); margin-top:5px; line-height:1.45;}
.task-meta .k, .task-note .k{font-family:var(--font-mono); font-size:10px; letter-spacing:.03em; color:var(--muted); margin-right:5px; text-transform:uppercase;}
.task-note{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45; word-break:break-word;}
.task-empty{font-size:13px; color:var(--muted); padding:10px 2px;}
.log-note{font-size:11.5px; color:var(--muted); margin-bottom:14px; line-height:1.6;}
.upcoming-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; font-size:13px;}
.upcoming-row:last-child{border-bottom:none;}
.upcoming-row .d{flex:1;}
.upcoming-row .n{font-family:var(--font-mono); font-size:11.5px; font-weight:700; color:var(--gold);}
.month-cell .month-task{font-size:9.5px; color:var(--gold); font-family:var(--font-mono); font-weight:600;}
.month-cell.teach-hit{background:var(--gold-soft); border-color:var(--gold); box-shadow:0 0 0 2px var(--gold);}
.month-cell.teach-hit .num{color:var(--gold);}
.month-cell.teach-hit .month-count{color:var(--ink); font-weight:600;}
.month-cell.teach-off:not(.out){opacity:.5;}
.teach-banner{font-size:12.5px; background:var(--gold-soft); border:1px solid var(--gold); border-radius:var(--radius-s); padding:7px 10px; margin-bottom:10px;}
.task-block{margin-top:14px;}

/* Read-only detail modal */
.overlay{position:fixed; inset:0; background:rgba(20,20,20,.5); display:none; align-items:flex-end; justify-content:center; z-index:200; padding:0;}
.overlay.show{display:flex;}
@media (min-width:641px){ .overlay{align-items:center; padding:16px;} }
.modal{background:var(--card); border-radius:var(--radius-m) var(--radius-m) 0 0; width:100%; max-width:420px; max-height:80vh; overflow-y:auto; box-shadow:0 -8px 24px rgba(0,0,0,.2);}
@media (min-width:641px){ .modal{border-radius:var(--radius-m);} }
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--ink); border-radius:var(--radius-m) var(--radius-m) 0 0;}
.modal-head h3{color:#fff; font-size:15px;}
.modal-close{background:none; border:none; color:#fff; font-size:20px; line-height:1; padding:2px 6px;}
.modal-body{padding:16px 18px;}
.kv{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted); flex-shrink:0;}
.kv .v{text-align:right; font-weight:600;}

#toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .2s, transform .2s; z-index:300; pointer-events:none;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

footer{max-width:1180px; margin:0 auto; padding:0 12px 30px; color:var(--muted); font-size:11px;}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <div class="brand-eyebrow">KHOA CHUYÊN MÔN KỸ THUẬT</div>
      <h1>Lịch giảng dạy năm 2026</h1>
      <p id="rangeLabel">Đang tải dữ liệu…</p>
    </div>
  </div>
  <div class="toolbar">
    <select id="teacherSelect" class="sel" aria-label="Lọc theo giáo viên"><option value="">Tất cả giáo viên</option></select>
    <button class="btn btn-ghost" id="refreshBtn">⟳ Làm mới</button>
    <button class="btn btn-ghost" id="todayBtn">Hôm nay</button>
    <button class="btn btn-ghost" id="themeBtn">◐</button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="week" aria-selected="true">Theo tuần</button>
    <button class="tab" role="tab" data-tab="month" aria-selected="false">Theo tháng</button>
    <button class="tab" role="tab" data-tab="stats" aria-selected="false">Thống kê</button>
    <button class="tab" role="tab" data-tab="tasks" aria-selected="false">Công việc</button>
  </nav>
</header>

<main>
  <div id="statusArea"></div>

  <section class="pin" id="pinToday" style="display:none">
    <div class="pin-head" id="pinHead">
      <div class="pin-head-left">
        <span class="pin-tag">GHIM · HÔM NAY</span>
        <span class="pin-date" id="pinDate">—</span>
        <span class="pin-sub" id="pinSub"></span>
      </div>
      <button class="pin-toggle" id="pinToggle" aria-label="Thu gọn">▾</button>
    </div>
    <div class="pin-body" id="pinBody"></div>
  </section>

  <div id="legend" class="legend"></div>

  <section id="view-week"></section>
  <section id="view-month" style="display:none"></section>
  <section id="view-stats" style="display:none"></section>
  <section id="view-tasks" style="display:none"></section>
</main>

<footer>Dữ liệu đọc trực tiếp từ Google Sheet do Trưởng khoa quản lý · Trang này chỉ hiển thị, không chỉnh sửa được dữ liệu lịch giảng dạy.</footer>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head"><h3>Chi tiết buổi học</h3><button class="modal-close" id="detailClose">&times;</button></div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* =====================================================================
   CẤU HÌNH — dán 3 link "Xuất bản lên web" (định dạng CSV) từ Google
   Sheet của bạn vào đây. Xem hướng dẫn Trưởng khoa đã nhận kèm file này.
   ===================================================================== */
const CSV_URL_LESSONS  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=589329369&single=true&output=csv";
const CSV_URL_SUBJECTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=418155342&single=true&output=csv";
const CSV_URL_TEACHERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1579967289&single=true&output=csv";
const CSV_URL_TASKS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1365016418&single=true&output=csv";  // <-- Dán link CSV của sheet "CongViec" (Công việc triển khai theo ngày) vào đây
/* ===================================================================== */
</script>
<script>
(function(){
"use strict";

/* ================= CSV parsing ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c=>c!==""));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = (r[i]!==undefined ? r[i].trim() : ""));
    return o;
  });
}
async function fetchCSV(url){
  const bust = url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now();
  const res = await fetch(bust, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  let text = await res.text();
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  return csvToObjects(text);
}

/* ================= Date parsing ================= */
function normalizeDate(s){
  if(!s) return null;
  s = s.trim().replace(/^"|"$/g,"");
  // ISO: 2026-06-19 or 2026/06/19
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  // D/M/Y or M/D/Y — ambiguous, resolve using validity (day<=31, month<=12)
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/);
  if(m){
    let a = parseInt(m[1],10), b = parseInt(m[2],10);
    const y = m[3];
    let day, month;
    if(a>12 && b<=12){ day=a; month=b; }               // must be D/M/Y
    else if(b>12 && a<=12){ day=b; month=a; }           // must be M/D/Y
    else { day=a; month=b; }                            // ambiguous -> assume D/M/Y (VN convention)
    if(month>=1 && month<=12 && day>=1 && day<=31){
      return y+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    }
  }
  return null;
}

/* ================= Build data model from sheet rows ================= */
function buildLessons(rows, subjMap, teachMap){
  const out = [];
  let id = 1;
  let skippedNoDate = 0, skippedNoCode = 0;
  rows.forEach(r=>{
    const rawDate = r["Ngày"] || r["Ngay"] || "";
    const date = normalizeDate(rawDate);
    const code = (r["Mã môn"]||r["Ma mon"]||"").trim();
    if(!date){ if(rawDate) skippedNoDate++; return; }
    if(!code){ skippedNoCode++; return; }
    const nhom = (r["Nhóm"]||r["Nhom"]||"").trim();
    const lop = (r["Lớp/Phòng"]||r["Lop/Phong"]||"").trim();
    let room = "";
    if(["P301","P303","P302"].includes(lop)) room = lop;
    else if(/quân nhu|quan nhu/i.test(nhom)) room = "QNhu";
    else if(/quân khí|quan khi/i.test(nhom)) room = "QKhi";
    else room = lop || "P301";

    const teacherCodeRaw = (r["Mã GV"]||r["Ma GV"]||"").trim();
    const subjFromMap = subjMap[code.toLowerCase()];
    const teachFromMap = teacherCodeRaw ? teachMap[teacherCodeRaw.toLowerCase()] : null;
    const sheetSubjectName = (r["Tên môn học"]||r["Ten mon hoc"]||"").trim();
    const sheetTeacherName = (r["Tên giáo viên"]||r["Ten giao vien"]||"").trim();
    const looksLikeError = (t)=> /^#|chưa có trong danh mục/i.test(t||"");

    out.push({
      id: id++,
      date,
      period: (r["Tiết"]||r["Tiet"]||"").trim(),
      room,
      code,
      subject: (subjFromMap && subjFromMap.name) || (!looksLikeError(sheetSubjectName) && sheetSubjectName) || code,
      teacherCode: teacherCodeRaw || null,
      teacher: (teachFromMap && teachFromMap.name) || (!looksLikeError(sheetTeacherName) && sheetTeacherName) || null,
      location: (r["Địa điểm / Ghi chú"]||r["Dia diem / Ghi chu"]||"").trim(),
      isHoliday: code === "NGHI_LE" || /nghỉ lễ/i.test(sheetSubjectName),
    });
  });
  return {lessons: out, skippedNoDate, skippedNoCode};
}
function buildCatalogMap(rows, codeKeys, nameKeys, extra){
  const map = {};
  rows.forEach(r=>{
    let code = "", name = "";
    for(const k of codeKeys){ if(r[k]){ code=r[k].trim(); break; } }
    for(const k of nameKeys){ if(r[k]){ name=r[k].trim(); break; } }
    if(code) map[code.toLowerCase()] = {code, name};
  });
  return map;
}
function buildSubjects(rows){
  return buildCatalogMap(rows, ["Mã môn","Ma mon"], ["Tên bài / môn học","Tên môn học","Ten bai / mon hoc"]);
}
function buildTeachers(rows){
  const map = buildCatalogMap(rows, ["Mã GV","Ma GV"], ["Tên giáo viên","Ten giao vien"]);
  return Object.values(map);
}

/* ================= Constants ================= */
const TRACKS = [
  {key:"P301", label:"Quân y · L1 (P301)"},
  {key:"P303", label:"Quân y · L2 (P303)"},
  {key:"P302", label:"Quân y · L3 (P302)"},
  {key:"QNhu", label:"Quân nhu"},
  {key:"QKhi", label:"Quân khí"},
];
const SLOTS = [
  {key:"s1", periods:["1-3","2-3"]},
  {key:"s2", periods:["4-5"]},
  {key:"s3", periods:["6-8"]},
];
function slotOf(period){ return SLOTS.find(s=>s.periods.includes(period)) || SLOTS[0]; }
function trackVar(key){ return {P301:"p301", P303:"p303", P302:"p302", QNhu:"nhu", QKhi:"khi"}[key]; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtVN(iso){ if(!iso) return ""; const d=parseISO(iso); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function mondayOf(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return toISO(d); }
function weekdayNameOf(iso){ const d=parseISO(iso); const names=["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"]; return names[d.getDay()]; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function periodStart(p){ return parseInt(String(p).split("-")[0],10) || 0; }
function sortLessons(a,b){ const pa=periodStart(a.period), pb=periodStart(b.period); if(pa!==pb) return pa-pb; return TRACKS.findIndex(t=>t.key===a.room)-TRACKS.findIndex(t=>t.key===b.room); }
const TODAY = todayISO();

let lessons = [];
let teachers = [];
let IDX = {byDate:{}, MIN_DATE:null, MAX_DATE:null};
function reindex(){
  const byDate = {}; let MIN_DATE=null, MAX_DATE=null;
  lessons.forEach(l=>{
    (byDate[l.date] = byDate[l.date] || []).push(l);
    if(!MIN_DATE || l.date<MIN_DATE) MIN_DATE=l.date;
    if(!MAX_DATE || l.date>MAX_DATE) MAX_DATE=l.date;
  });
  IDX = {byDate, MIN_DATE, MAX_DATE};
}

/* ================= Load data ================= */
async function loadAllData(){
  if(!isConfigured()){ showSetupInstructions(); return; }
  showLoading();
  document.getElementById("pinToday").style.display = "none";
  try{
    const [lessonRows, subjRows, teachRows] = await Promise.all([
      fetchCSV(CSV_URL_LESSONS), fetchCSV(CSV_URL_SUBJECTS), fetchCSV(CSV_URL_TEACHERS)
    ]);
    const subjMap = buildSubjects(subjRows);
    teachers = buildTeachers(teachRows);
    const teachMap = {}; teachers.forEach(t=>teachMap[t.code.toLowerCase()]=t);
    const built = buildLessons(lessonRows, subjMap, teachMap);
    lessons = built.lessons;
    reindex();
    clearStatus();
    document.getElementById("pinToday").style.display = "";
    const anchor = (IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE) ? TODAY : (IDX.MIN_DATE||TODAY);
    state.weekAnchor = mondayOf(anchor);
    state.monthAnchor = anchor.slice(0,7)+"-01";
    refreshTeacherSelect();
    renderAll();
    let msg = "Đã tải "+lessons.length+" buổi học.";
    if(built.skippedNoDate || built.skippedNoCode){
      msg += " (Bỏ qua "+(built.skippedNoDate+built.skippedNoCode)+" dòng thiếu ngày/mã môn.)";
    }
    toast(msg);
  }catch(err){
    showError(err.message || String(err));
  }
  await loadTasks();
}
async function loadTasks(){
  if(!CSV_URL_TASKS){ tasksStatus="nocfg"; tasks=[]; reindexTasks(); return; }
  tasksStatus = "loading";
  try{
    const rows = await fetchCSV(CSV_URL_TASKS);
    tasks = buildTasks(rows); reindexTasks(); tasksStatus = "ok";
  }catch(err){
    tasks = []; reindexTasks(); tasksStatus = "error"; tasksError = err.message || String(err);
  }
  renderAll();
}

  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹";

  next.addEventListener("click", ()=>{ const d=new Date(y,m,1); state.monthAnchor=toISO(d).slice(0,7)+"-01"; renderAll(); });
  navGroup.appendChild(prev); navGroup.appendChild(next); bar.appendChild(navGroup);
  root.appendChild(bar);

  const mine = (l)=> state.teacher && l.teacherCode && l.teacherCode.toLowerCase()===state.teacher.toLowerCase();
  if(state.teacher){
    const tName = (teachers.find(t=>t.code.toLowerCase()===state.teacher.toLowerCase())||{}).name || state.teacher;
    const prefix = state.monthAnchor.slice(0,7);
    const mm = lessons.filter(l=>l.date.startsWith(prefix) && mine(l));
    const nDays = new Set(mm.map(l=>l.date)).size;
    const banner = document.createElement("div"); banner.className="teach-banner";
    banner.textContent = "Đang tô sáng ngày dạy của "+tName+": "+nDays+" ngày · "+mm.length+" buổi trong tháng "+m+"/"+y+".";
    root.appendChild(banner);
  }
  const scrollWrap = document.createElement("div"); scrollWrap.className="month-scroll";
  const grid = document.createElement("div"); grid.className="month-grid";
  ["T2","T3","T4","T5","T6","T7","CN"].forEach(l=>{ const el=document.createElement("div"); el.className="wd-label"; el.textContent=l; grid.appendChild(el); });
  const firstDow = (monthDate.getDay()+6)%7;
  const startIso = toISO(new Date(y, m-1, 1-firstDow));
  for(let i=0;i<42;i++){
    const iso = addDays(startIso, i);
    const inMonth = iso.slice(0,7) === state.monthAnchor.slice(0,7);
    const cell = document.createElement("div");
    cell.className = "month-cell"+(inMonth?"":" out")+(iso===TODAY?" is-today":"")+(iso===state.selectedDay?" selected":"");
    const allDay = IDX.byDate[iso]||[];
    const dayLessons = state.teacher ? allDay.filter(mine) : allDay;
    if(state.teacher){ cell.classList.add(dayLessons.length ? "teach-hit" : "teach-off"); }
    const num = document.createElement("div"); num.className="num"; num.textContent=String(parseISO(iso).getDate());
    cell.appendChild(num);
    if(dayLessons.length){
      const dots = document.createElement("div"); dots.className="month-dots"; const seen={};
      dayLessons.forEach(l=>{ const k=l.isHoliday?"holiday":l.room; if(seen[k])return; seen[k]=1;
        const d=document.createElement("span"); d.className="dot"; d.style.background=l.isHoliday?"var(--red)":"var(--"+trackVar(l.room)+")"; dots.appendChild(d); });
      cell.appendChild(dots);
      const cnt = document.createElement("div"); cnt.className="month-count"; cnt.textContent=dayLessons.length+" buổi";
      cell.appendChild(cnt);
    }
    if(taskCountFor(iso)){
      const tk = document.createElement("div"); tk.className="month-task"; tk.textContent="📝 "+taskCountFor(iso);
      cell.appendChild(tk);
    }
    cell.addEventListener("click", ()=>{ state.selectedDay=iso; renderMonth(); renderDayDetail(); });
    grid.appendChild(cell);
  }
  scrollWrap.appendChild(grid); root.appendChild(scrollWrap);
  const detail = document.createElement("div"); detail.className="day-detail"; detail.id="monthDayDetail";
  root.appendChild(detail);
  renderDayDetail();
}
function renderDayDetail(){
  const el = document.getElementById("monthDayDetail");
  if(!el) return;
  const iso = state.selectedDay || ((IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE)?TODAY:(IDX.MIN_DATE||TODAY));
  const lessonsHere = (IDX.byDate[iso]||[]).slice().sort(sortLessons);
  const panel = document.createElement("div"); panel.className="panel";
  panel.innerHTML = "<h3>"+weekdayNameOf(iso)+", "+fmtVN(iso)+"</h3>";
  const wrap = document.createElement("div"); wrap.className="pin-grid";
  if(lessonsHere.length) lessonsHere.forEach(l=>wrap.appendChild(chipEl(l)));
  else { const e=document.createElement("div"); e.className="pin-empty"; e.textContent="Không có lịch học ngày này."; wrap.appendChild(e); }
  panel.appendChild(wrap);
  const dayTasks = TASKIDX[iso]||[];
  if(dayTasks.length){
    const tb = document.createElement("div"); tb.className="task-block";
    tb.innerHTML = "<h3>Công việc triển khai</h3>";
    const tl = document.createElement("div"); tl.className="task-list"; tl.style.marginTop="8px"; tl.style.marginBottom="0";
    dayTasks.forEach(t=>tl.appendChild(taskItemEl(t)));
    tb.appendChild(tl); panel.appendChild(tb);
  }
  el.innerHTML=""; el.appendChild(panel);
}

/* ================= Stats view ================= */
function renderStats(){
  const root = document.getElementById("view-stats");
  root.innerHTML = "";
  if(!IDX.MIN_DATE) return;
  const total = lessons.length;
  const weekEnd = addDays(state.weekAnchor,4);
  const thisWeek = lessons.filter(l=>l.date>=state.weekAnchor && l.date<=weekEnd).length;
  const monthPrefix = state.monthAnchor.slice(0,7);
  const thisMonth = lessons.filter(l=>l.date && l.date.startsWith(monthPrefix)).length;
  const wdCount = {}; lessons.forEach(l=>{ const wd=weekdayNameOf(l.date); wdCount[wd]=(wdCount[wd]||0)+1; });
  const busiest = Object.entries(wdCount).sort((a,b)=>b[1]-a[1])[0];
  const next = nextLessonFrom(TODAY) || (IDX.byDate[TODAY]&&IDX.byDate[TODAY][0]);

  const statGrid = document.createElement("div"); statGrid.className="stat-grid";
  [[total,"Tổng buổi học"],[thisWeek,"Buổi học tuần đang xem"],[thisMonth,"Buổi học tháng đang xem"],[busiest?busiest[0]:"—","Ngày bận nhất"]].forEach(([n,l])=>{
    const c=document.createElement("div"); c.className="stat-card";
    c.innerHTML = "<div class='stat-num'>"+n+"</div><div class='stat-label'>"+l+"</div>";
    statGrid.appendChild(c);
  });
  root.appendChild(statGrid);

  const teacherCount = {};
  lessons.forEach(l=>{ const key=l.teacher||"Chưa xác định"; teacherCount[key]=(teacherCount[key]||0)+1; });
  const teacherEntries = Object.entries(teacherCount).sort((a,b)=>b[1]-a[1]);
  const maxT = teacherEntries[0]?teacherEntries[0][1]:1;
  const teacherPanel = document.createElement("div"); teacherPanel.className="panel";
  teacherPanel.innerHTML = "<h3>Số buổi dạy theo giáo viên</h3>";
  teacherEntries.forEach(([name,n])=>{
    const row=document.createElement("div"); row.className="bar-row";
    row.innerHTML = "<div class='name'>"+escapeHtml(name)+"</div><div class='track'><div class='fill' style='width:"+(n/maxT*100)+"%'></div></div><div class='n'>"+n+"</div>";
    teacherPanel.appendChild(row);
  });
  root.appendChild(teacherPanel);

  const trackCount = {}; lessons.forEach(l=>{ trackCount[l.room]=(trackCount[l.room]||0)+1; });
  const maxTr = Math.max(1,...Object.values(trackCount));
  const trackPanel = document.createElement("div"); trackPanel.className="panel";
  trackPanel.innerHTML = "<h3>Số buổi học theo nhóm</h3>";
  TRACKS.forEach(t=>{
    const n=trackCount[t.key]||0;
    const row=document.createElement("div"); row.className="bar-row";
    row.innerHTML = "<div class='name'>"+t.label+"</div><div class='track'><div class='fill' style='width:"+(n/maxTr*100)+"%; background:var(--"+trackVar(t.key)+")'></div></div><div class='n'>"+n+"</div>";
    trackPanel.appendChild(row);
  });
  root.appendChild(trackPanel);

  const nextPanel = document.createElement("div"); nextPanel.className="panel";
  nextPanel.innerHTML = "<h3>Buổi học sắp tới gần nhất</h3>";
  if(next){ const wrap=document.createElement("div"); wrap.className="pin-grid"; wrap.appendChild(chipEl(next)); nextPanel.appendChild(wrap); }
  else nextPanel.innerHTML += "<div class='pin-empty'>Không có buổi học nào sắp tới.</div>";
  root.appendChild(nextPanel);
}

/* ================= Cong viec theo ngay (doc tu Google Sheet, chi xem) ================= */
let tasks = [];
let TASKIDX = {};
let tasksStatus = CSV_URL_TASKS ? "loading" : "nocfg";   // loading | ok | error | nocfg
let tasksError = "";
function buildTasks(rows){
  const out = [];
  rows.forEach(r=>{
    const date = normalizeDate(r["Ngày"]||r["Ngay"]||"");
    const title = (r["Nội dung công việc"]||r["Noi dung cong viec"]||"").trim();
    if(!date || !title) return;
    out.push({
      date, title,
      people: (r["Thành phần"]||r["Thanh phan"]||"").trim(),
      note: (r["Ghi chú"]||r["Ghi chu"]||"").trim(),
    });
  });
  return out;
}
function reindexTasks(){
  TASKIDX = {};
  tasks.forEach(t=>{ (TASKIDX[t.date] = TASKIDX[t.date] || []).push(t); });
}
function taskItemEl(t){
  const el = document.createElement("div"); el.className = "task-item";
  let h = "<div class='task-title'>"+escapeHtml(t.title)+"</div>";
  if(t.people) h += "<div class='task-meta'><span class='k'>Thành phần</span>"+escapeHtml(t.people)+"</div>";
  if(t.note) h += "<div class='task-note'><span class='k'>Ghi chú</span>"+escapeHtml(t.note)+"</div>";
  el.innerHTML = h;
  return el;
}
function renderTasks(){
  const root = document.getElementById("view-tasks");
  root.innerHTML = "";
  const bar = document.createElement("div"); bar.className="bar";
  bar.innerHTML = "<h2>Công việc triển khai theo ngày</h2>";
  root.appendChild(bar);

  if(tasksStatus === "nocfg"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel setup'><h3>Chưa kết nối sheet công việc</h3><p>Dán link CSV của sheet <code>CongViec</code> vào biến <code>CSV_URL_TASKS</code> ở đầu phần &lt;script&gt;.</p></div>");
    return;
  }
  if(tasksStatus === "loading"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel'><div class='spinner'></div><p>Đang tải công việc…</p></div>");
    return;
  }
  if(tasksStatus === "error"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel error'><h3>Không tải được công việc</h3><p>"+escapeHtml(tasksError)+"</p><p>Kiểm tra sheet <code>CongViec</code> đã được \"Xuất bản lên web\" (CSV) và link đúng gid chưa, rồi bấm Làm mới.</p></div>");
    return;
  }
  const note = document.createElement("p"); note.className="log-note";
  note.textContent = "Nội dung do Trưởng khoa ghi trong Google Sheet (sheet CongViec); trang này chỉ hiển thị.";
  root.appendChild(note);

  const nav = document.createElement("div"); nav.className="log-nav";
  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹";
  const next = document.createElement("button"); next.className="iconbtn"; next.textContent="›";
  prev.addEventListener("click", ()=>{ state.taskDate=addDays(state.taskDate,-1); renderTasks(); });
  next.addEventListener("click", ()=>{ state.taskDate=addDays(state.taskDate,1); renderTasks(); });
  const label = document.createElement("div"); label.className="datelabel";
  label.textContent = weekdayNameOf(state.taskDate)+", "+fmtVN(state.taskDate)+(state.taskDate===TODAY?"  ·  Hôm nay":"");
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
  root.appendChild(nav);

  if(state.taskDate !== TODAY){
    const jump = document.createElement("button"); jump.className="btn btn-outline btn-sm"; jump.style.marginBottom="12px"; jump.textContent="Về hôm nay";
    jump.addEventListener("click", ()=>{ state.taskDate=TODAY; renderTasks(); });
    root.appendChild(jump);
  }

  const list = document.createElement("div"); list.className="task-list";
  const items = TASKIDX[state.taskDate] || [];
  if(!items.length){
    const e=document.createElement("div"); e.className="task-empty"; e.textContent="Không có công việc nào được ghi cho ngày này."; list.appendChild(e);
  } else items.forEach(t=>list.appendChild(taskItemEl(t)));
  root.appendChild(list);

  const upDates = Object.keys(TASKIDX).filter(d=>d>=TODAY && d!==state.taskDate).sort().slice(0,20);
  if(upDates.length){
    const panel=document.createElement("div"); panel.className="panel";
    panel.innerHTML = "<h3>Các ngày sắp tới có công việc</h3>";
    upDates.forEach(d=>{
      const row=document.createElement("div"); row.className="upcoming-row";
      row.innerHTML = "<div class='d'>"+weekdayNameOf(d)+", "+fmtVN(d)+"</div><div class='n'>"+TASKIDX[d].length+" việc</div>";
      row.addEventListener("click", ()=>{ state.taskDate=d; renderTasks(); window.scrollTo({top:0,behavior:"smooth"}); });
      panel.appendChild(row);
    });
    root.appendChild(panel);
  }
}

/* ================= Orchestrator ================= */
function renderAll(){
  document.getElementById("rangeLabel").textContent = IDX.MIN_DATE
    ? ("Từ "+fmtVN(IDX.MIN_DATE)+" đến "+fmtVN(IDX.MAX_DATE)+" · "+lessons.length+" buổi học")
    : "Chưa có dữ liệu";
  renderLegend();
  renderPin();
  if(state.tab==="week") renderWeek();
  if(state.tab==="month") renderMonth();
  if(state.tab==="stats") renderStats();
  if(state.tab==="tasks") renderTasks();
}

loadAllData();

})();
</script>
