<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lịch giảng dạy — Khoa Chuyên môn Kỹ thuật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif; --font-num:'Chakra Petch','Be Vietnam Pro',sans-serif;
  --ink:#0C1A2E; --ink-2:#37475E; --muted:#68788F; --paper:#EDF1F8; --paper-2:#E1E8F3; --card:#FFFFFF; --line:#D3DCEA; --line-soft:#E5EBF4;
  --brand:#0A1A3A; --brand-2:#17357A; --hl:#3F4FD8; --on-hl:#fff; --hl-soft:#E6E9FC; --task-soft:#EEF0FD; --grid:rgba(63,79,216,.05);
  --amber:#FFB020; --gold:#B86E00; --gold-soft:#FFF0D2;
  --p301:#0E9F76; --p301-soft:#DDF5EC; --p302:#0A8FC2; --p302-soft:#D9F0FA; --p303:#D48806; --p303-soft:#FDF0D0;
  --nhu:#DC3F7C; --nhu-soft:#FBDFEA; --khi:#8B4FE6; --khi-soft:#EBE2FC; --red:#D93A31; --red-soft:#FCE0DD;
  --shadow:0 1px 2px rgba(12,26,46,.05),0 6px 18px rgba(12,26,46,.07); --shadow-lg:0 14px 34px rgba(12,26,46,.16);
  --radius-s:12px; --radius-m:18px; --ease:cubic-bezier(.22,.8,.24,1); --hdr-h:150px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E7EDF8; --ink-2:#BCC8DA; --muted:#8A9AB2; --paper:#070D1A; --paper-2:#101A2E; --card:#0E1627; --line:#1F2D47; --line-soft:#162239;
  --brand:#050C1D; --brand-2:#11265A; --hl:#8E9BFF; --on-hl:#0A1030; --hl-soft:#1A2150; --task-soft:#141C3A; --grid:rgba(142,155,255,.05);
  --gold:#FFB84D; --gold-soft:#35260C; --p301:#34D399; --p302:#38BDF8; --p303:#FBBF24; --nhu:#F472B6; --khi:#B18CFF; --red:#F87171;
  --p301-soft:#0F2C26; --p302-soft:#0F2A3A; --p303-soft:#33290F; --nhu-soft:#35172A; --khi-soft:#251F47; --red-soft:#3A1A1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 14px 34px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{
  --ink:#E7EDF8; --ink-2:#BCC8DA; --muted:#8A9AB2; --paper:#070D1A; --paper-2:#101A2E; --card:#0E1627; --line:#1F2D47; --line-soft:#162239;
  --brand:#050C1D; --brand-2:#11265A; --hl:#8E9BFF; --on-hl:#0A1030; --hl-soft:#1A2150; --task-soft:#141C3A; --grid:rgba(142,155,255,.05);
  --gold:#FFB84D; --gold-soft:#35260C; --p301:#34D399; --p302:#38BDF8; --p303:#FBBF24; --nhu:#F472B6; --khi:#B18CFF; --red:#F87171;
  --p301-soft:#0F2C26; --p302-soft:#0F2A3A; --p303-soft:#33290F; --nhu-soft:#35172A; --khi-soft:#251F47; --red-soft:#3A1A1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 14px 34px rgba(0,0,0,.55);}

/* ===== Nền & chữ ===== */
*{box-sizing:border-box;}
html{height:100%; scroll-behavior:smooth; scroll-padding-top:calc(var(--hdr-h) + 10px);}
html.theming *{transition:background-color .35s,color .35s,border-color .35s,box-shadow .35s !important;}
body{margin:0; min-height:100%; padding-top:var(--hdr-h); color:var(--ink); font:15px/1.5 var(--font); letter-spacing:-.003em; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px, linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px, var(--paper);}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:-.02em;}
button{font-family:var(--font); cursor:pointer;}
::selection{background:var(--hl); color:var(--on-hl);}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px;}

/* ===== Header ===== */
header.top{position:fixed; top:0; left:0; right:0; z-index:40; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2)); border-bottom:1px solid #ffffff1f; box-shadow:0 10px 30px rgba(10,26,58,.28);}
header.top::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/22px 22px, linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/22px 22px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 75%); mask-image:linear-gradient(90deg,transparent,#000 75%);}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1080px; margin:0 auto 10px;}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto;}
.brand-logo{flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(145deg,#ffffff38,#ffffff0d); border:1px solid #ffffff33;}
.brand-logo svg{width:22px; height:22px;}
.brand-text{min-width:0;}
.brand-eyebrow{font-size:11.5px; font-weight:500; color:#B3C2EA; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand h1{font-size:18px; line-height:1.15; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand h1 .yr{color:var(--amber);}
.clock{flex:none; text-align:right; padding:6px 12px 5px; border-radius:14px; background:#ffffff14; border:1px solid #ffffff26;}
.clock-time{font:700 22px/1.1 var(--font-num); letter-spacing:.04em; color:#fff; white-space:nowrap;}
.clock-time .colon{color:var(--amber); animation:blink 1s steps(1,end) infinite;}
.clock-date{font-size:10.5px; color:#B3C2EA; margin-top:2px; white-space:nowrap;}
@keyframes blink{50%{opacity:.25;}}
.toolbar-wrap{display:grid; grid-template-rows:1fr; max-width:1080px; margin:0 auto; transition:grid-template-rows .3s var(--ease),opacity .22s ease;}
.toolbar-wrap.is-hidden{grid-template-rows:0fr; opacity:0; pointer-events:none;}
.toolbar{display:flex; align-items:center; gap:8px; min-height:0; overflow:hidden; padding:2px;}
select.sel{flex:0 1 210px; min-width:0; height:34px; padding:0 12px; text-overflow:ellipsis; font:600 13px var(--font); color:#fff; background:#ffffff1a; border:1px solid #ffffff30; border-radius:12px;}
select.sel option{color:#0C1A2E; background:#fff;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; min-height:34px; padding:0 13px; font:600 13px var(--font); border-radius:12px; border:1px solid transparent; transition:transform .2s var(--ease),background .2s,box-shadow .2s;}
.btn:active,.iconbtn:active{transform:scale(.94);}
.btn-ghost{background:#ffffff1a; color:#fff; border-color:#ffffff30;}
.btn-ghost:hover{background:#ffffff2e;}
.btn-gold{background:var(--amber); color:#2B1A00;}
.btn-outline{background:var(--card); color:var(--ink); border-color:var(--line);}
.btn-sm{min-height:32px; font-size:12px; padding:0 12px;}
#refreshBtn,#themeBtn{width:40px; padding:0; font-size:15px;}

nav.tabs{display:flex; gap:4px; max-width:1080px; margin:10px auto 0; padding:4px; border-radius:14px; background:#00000040; border:1px solid #ffffff1a;}
.tab{flex:1; padding:9px 6px; font:700 13.5px var(--font); color:#C3D0F0; background:transparent; border:none; border-radius:11px; white-space:nowrap; transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--ease);}
.tab:active{transform:scale(.96);}
.tab[aria-selected="true"]{background:#fff; color:var(--brand); box-shadow:0 4px 14px rgba(0,0,0,.25);}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}}

/* ===== Khung chính ===== */
main{max-width:1080px; margin:0 auto; padding:16px 14px 60px;}
footer{max-width:1080px; margin:0 auto; padding:0 14px 110px; color:var(--muted); font-size:12px;}
.status-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; margin-bottom:16px; box-shadow:var(--shadow);}
.status-panel h3{font-size:15px; margin-bottom:6px;}
.status-panel p{font-size:13.5px; color:var(--muted); line-height:1.6; margin:0 0 8px;}
.status-panel ol{margin:8px 0 0; padding-left:20px; font-size:13px; line-height:1.8;}
.status-panel code{background:var(--paper-2); padding:1px 6px; border-radius:5px; font-size:12px;}
.status-panel.error{border-color:var(--red);} .status-panel.setup{border-color:var(--amber);}
.spinner{width:22px; height:22px; margin-bottom:10px; border:3px solid var(--line); border-top-color:var(--hl); border-right-color:var(--amber); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== Ô "Hôm nay" ===== */
body:not([data-tab="week"]) #pinToday{display:none !important;}
.pin{position:relative; overflow:hidden; margin-bottom:16px; padding:14px; color:#fff; border-radius:22px; border:1px solid #ffffff1f; box-shadow:0 16px 36px rgba(10,26,58,.3);
  background:radial-gradient(120% 140% at 100% 0%,#4F63FF55,transparent 55%),linear-gradient(150deg,var(--brand-2),var(--brand));}
.pin::before{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/22px 22px;}
.pin > *{position:relative;}
.pin-head,.pin-head-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pin-tag{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:800; padding:3px 11px 3px 9px; border-radius:999px; background:var(--amber); color:#2B1A00;}
.pin-tag::before{content:""; width:7px; height:7px; border-radius:50%; background:#2B1A00; animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,26,0,.55);}100%{box-shadow:0 0 0 7px rgba(43,26,0,0);}}
.pin-title{font-size:15px; font-weight:800; color:#fff;}
.pin-date{font-weight:800; font-size:16px;} .pin-sub{font-size:13px; color:#B3C2EA; width:100%;}
.pin-body{margin-top:12px;}
.pin-h{font-size:12.5px; font-weight:700; color:#B3C2EA; margin:0 0 8px;}
.pin-empty{font-size:13.5px; color:#B3C2EA; padding:2px 0;}
.pin-lessons{display:flex; align-items:center; gap:10px; width:100%; margin-top:0; padding:10px 12px; font:600 14px var(--font); color:#fff; background:#ffffff14; border:1px solid #ffffff26; border-radius:14px;}
.pin-lessons .pl-ico{font-size:16px;} .pin-lessons .pl-txt{font-size:14px; font-weight:600;}
.pin-lessons b{font:700 20px var(--font-num); color:var(--amber); margin-right:3px;}
.pin-lessons.none{color:#B3C2EA; font-weight:500;}
.pin-lessons + .pin-grid{margin-top:10px;}
.pin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px;}
.pin .chip{box-shadow:0 6px 16px rgba(0,0,0,.2); color:var(--ink);}
.pin .task-list{margin-bottom:0;}
.pin .task-item{box-shadow:0 8px 20px rgba(0,0,0,.22); border-color:transparent; align-items:center;}
.pin .task-num{background:var(--amber); color:#2B1A00;}
.pin-noterow{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px;}
.pin-noterow .task-note{margin:0; flex:1 1 auto; min-width:0; color:#B3C2EA;}
.pin-tasklink{display:inline-block; margin-top:10px; padding:6px 13px; font:700 12.5px var(--font); color:#fff; background:#ffffff1f; border:1px solid #ffffff2e; border-radius:999px; white-space:nowrap; transition:background .2s;}
.pin-tasklink:hover{background:#ffffff33;}
.pin-noterow .pin-tasklink{margin:0 0 0 auto;}

/* ===== Chú giải, thanh điều hướng ===== */
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:14px; padding:10px 14px; font-size:12.5px; color:var(--ink-2); background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow);}
.legend span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.legend-month{margin:10px 0 0;}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%;}
.bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.bar h2{font-size:17px;}
.nav-group{display:flex; gap:8px;}
.iconbtn{display:flex; align-items:center; justify-content:center; width:38px; height:38px; font-size:18px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; transition:transform .2s var(--ease),background .2s,border-color .2s;}
.iconbtn:hover{background:var(--hl-soft); border-color:var(--hl);}
#view-week .bar{flex-wrap:nowrap;} #view-week .bar h2{font-size:min(16px,4.2vw); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;} #view-week .bar .nav-group{flex-shrink:0;}
#view-tasks .bar{justify-content:center;} #view-tasks .bar h2{width:100%; text-align:center;}

/* ===== Tuần ===== */
.day-card{display:grid; grid-template-columns:68px 1fr; margin-bottom:12px; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow); transition:transform .3s var(--ease),box-shadow .3s var(--ease);}
.day-head{grid-row:1 / span 20; display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 4px; text-align:center; background:var(--paper-2); border-right:1px solid var(--line-soft);}
.day-head .wd{font-size:12px; font-weight:700; color:var(--muted);}
.day-head .dd{font:700 26px/1.05 var(--font-num);}
.day-head .dt{font-size:11px; color:var(--muted); white-space:nowrap;}
.day-card.is-today{border-color:var(--amber); box-shadow:0 0 0 2px var(--amber),0 14px 30px rgba(255,176,32,.25);}
.day-card.is-today .day-head{background:linear-gradient(170deg,#FFCB52,#FF9F1C); color:#2B1A00;}
.day-card.is-today .wd,.day-card.is-today .dt{color:#5A3A00;}
.today-badge{margin-top:6px; padding:1px 8px; font-size:10.5px; font-weight:800; white-space:nowrap; color:#FFD27A; background:#2B1A00; border-radius:999px;}
.slot-block{grid-column:2; padding:9px 11px; border-top:1px solid var(--line-soft);}
.slot-block:first-of-type{border-top:none;}
.slot-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px; font-weight:700; color:var(--muted);}
.slot-count{font-size:12px; font-weight:600; color:var(--muted);}
.slot-toggle{min-height:28px; padding:4px 12px; font:700 12px var(--font); color:var(--hl); background:var(--hl-soft); border:none; border-radius:999px;}
.slot-chips{display:flex; flex-wrap:wrap; gap:6px;}
.slot-chips > .chip{flex:1 1 210px;}
.slot-empty{grid-column:2; padding:12px !important; font-size:13px; color:var(--muted);}

/* ===== Thẻ buổi học ===== */
.chip{--tc:var(--muted); position:relative; cursor:pointer; padding:7px 10px 8px 17px; border:1px solid var(--line-soft); border-radius:14px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 13%,var(--card)),var(--card) 72%); transition:transform .22s var(--ease),box-shadow .22s var(--ease),opacity .3s;}
.chip::before{content:""; position:absolute; left:6px; top:8px; bottom:8px; width:4px; border-radius:4px; background:var(--tc);}
.chip:active{transform:scale(.985);}
.chip.track-P301{--tc:var(--p301);} .chip.track-P302{--tc:var(--p302);} .chip.track-P303{--tc:var(--p303);}
.chip.track-QNhu{--tc:var(--nhu);} .chip.track-QKhi{--tc:var(--khi);} .chip.holiday{--tc:var(--red); background:var(--red-soft);}
.chip-top{display:flex; align-items:center; flex-wrap:wrap; gap:3px 8px;}
.chip-track-tag{font-size:12px; font-weight:800; color:var(--tc);}
.chip-code{font-size:11.5px; font-weight:500; color:var(--muted);}
.chip-teacher{margin-left:auto; padding:1px 10px; font-size:12.5px; font-weight:700; line-height:1.5; color:var(--on-hl); background:var(--hl); border-radius:999px;}
.chip-teacher:empty{display:none;}
.chip-subject{margin-top:3px; font-size:13.5px; font-weight:600; line-height:1.3;}
.chip.match{box-shadow:0 0 0 2px var(--hl);} .chip.match .chip-teacher{background:var(--amber); color:#2B1A00;}
.chip.dim{opacity:.28;}

/* ===== Tháng ===== */
.month-scroll{margin:0;}
.month-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px;}
.wd-label{padding-bottom:2px; font-size:11px; font-weight:700; text-align:center; color:var(--muted);}
.month-grid > .wd-label:nth-child(7n+6){color:var(--gold);} .month-grid > .wd-label:nth-child(7n){color:var(--red);}
.month-cell{display:flex; flex-direction:column; gap:2px; min-height:44px; padding:4px; overflow:hidden; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:12px; transition:transform .2s var(--ease),box-shadow .2s,background .2s;}
.month-cell:active{transform:scale(.94);}
.month-grid > .month-cell:nth-child(7n+6){background:color-mix(in srgb,var(--amber) 11%,var(--card));}
.month-grid > .month-cell:nth-child(7n){background:color-mix(in srgb,var(--red) 9%,var(--card));}
.month-cell.out{opacity:.35;}
.month-cell .num{font:700 12.5px/1.2 var(--font-num);}
.month-dots{display:flex; gap:2px; min-height:6px; overflow:hidden;}
.month-dots .dot{width:6px; height:6px; flex:none;}
.month-count{font-size:11px; color:var(--muted);} .month-cell .month-task{font-size:10px; line-height:1.2; font-weight:700; color:var(--gold);}
.month-grid > .month-cell.is-today{border:2px solid var(--amber); padding:3px;}
.month-grid > .month-cell.selected{border:2px solid var(--hl); padding:3px; background:var(--hl-soft); box-shadow:0 0 0 3px color-mix(in srgb,var(--hl) 22%,transparent);}
.month-grid > .month-cell.teach-hit{background:linear-gradient(145deg,var(--hl),var(--brand-2)); border-color:var(--hl); color:var(--on-hl);}
.month-cell.teach-hit .num,.month-cell.teach-hit .month-count,.month-cell.teach-hit .month-task{color:var(--on-hl);}
.month-cell.teach-hit .num{font-size:13.5px;} .month-cell.teach-hit .dot{box-shadow:0 0 0 1.5px #fff;}
.month-cell.teach-off:not(.out){opacity:.5;}
.teach-banner{margin-bottom:12px; padding:9px 12px; font-size:13.5px; font-weight:600; background:var(--card); border:1px solid var(--hl); border-radius:var(--radius-s);}
#monthDayDetail{margin:0 0 8px; max-height:150px; overflow-y:auto; border-radius:14px;}
#monthDayDetail .panel{padding:9px 12px;} #monthDayDetail .panel h3{margin:0; font-size:13.5px; line-height:1.3;}
#monthDayDetail .task-block{margin:0;} #monthDayDetail .task-item{padding:6px 10px; gap:8px;} #monthDayDetail .task-num{display:none;}
#monthDayDetail .task-title{font-size:14px;} #monthDayDetail .task-meta,#monthDayDetail .task-note{font-size:12.5px; margin-top:3px;}
#monthLessonDetail{margin:10px 0 0;} #view-month .bar{margin-bottom:8px;}
#view-month .iconbtn{width:32px; height:32px; font-size:15px;}
.day-detail{margin-top:16px;} .task-block{margin-top:14px;}

/* ===== Thống kê ===== */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px;}
.stat-card,.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow);}
.stat-card{padding:14px 16px;} .panel{padding:14px 16px; margin-bottom:14px;} .panel h3{font-size:15px; margin-bottom:10px;}
.stat-num{font:700 28px/1.1 var(--font-num); color:var(--hl);} .stat-label{margin-top:5px; font-size:13px; color:var(--muted);}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
.bar-row .name{width:110px; flex:none; font-weight:600;} .bar-row .n{width:32px; flex:none; text-align:right; font:700 13px var(--font-num);}
.bar-row .track{flex:1; height:12px; overflow:hidden; background:var(--paper-2); border-radius:999px;}
.bar-row .fill{height:100%; background:var(--hl); border-radius:999px; transition:width .9s var(--ease);}

/* ===== Công việc ===== */
.log-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:6px 8px; background:linear-gradient(135deg,var(--brand-2),var(--brand)); border-radius:var(--radius-m); box-shadow:0 10px 24px rgba(10,26,58,.25);}
.log-nav .datelabel{flex:1; text-align:center; font-weight:800; font-size:15.5px; color:#fff;}

/* =====================================================================
   CẤU HÌNH — dán 4 link "Xuất bản lên web" (định dạng CSV) từ Google
   Sheet của bạn vào đây. Xem hướng dẫn Trưởng khoa đã nhận kèm file này.
   ===================================================================== */
const CSV_URL_LESSONS  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=589329369&single=true&output=csv";
const CSV_URL_SUBJECTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=418155342&single=true&output=csv";
const CSV_URL_TEACHERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1579967289&single=true&output=csv";
const CSV_URL_TASKS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1365016418&single=true&output=csv";

<script>
(function(){
"use strict";

/* ================= CSV parsing ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c=>c!==""));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = (r[i]!==undefined ? r[i].trim() : ""));
    return o;
  });
}
async function fetchCSV(url){
  const bust = url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now();
  const res = await fetch(bust, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  let text = await res.text();
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  return csvToObjects(text);
}

/* ================= Date parsing ================= */
function normalizeDate(s){
  if(!s) return null;
  s = s.trim().replace(/^"|"$/g,"");
  // ISO: 2026-06-19 or 2026/06/19
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  // D/M/Y or M/D/Y — ambiguous, resolve using validity (day<=31, month<=12)
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/);
  if(m){
    let a = parseInt(m[1],10), b = parseInt(m[2],10);
    const y = m[3];
    let day, month;
    if(a>12 && b<=12){ day=a; month=b; }               // must be D/M/Y
    else if(b>12 && a<=12){ day=b; month=a; }           // must be M/D/Y
    else { day=a; month=b; }                            // ambiguous -> assume D/M/Y (VN convention)
    if(month>=1 && month<=12 && day>=1 && day<=31){
      return y+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    }
  }
  return null;
}

/* ================= Build data model from sheet rows ================= */
function buildLessons(rows, subjMap, teachMap){
  const out = [];
  let id = 1;
  let skippedNoDate = 0, skippedNoCode = 0;
  rows.forEach(r=>{
    const rawDate = r["Ngày"] || r["Ngay"] || "";
    const date = normalizeDate(rawDate);
    const code = (r["Mã môn"]||r["Ma mon"]||"").trim();
    if(!date){ if(rawDate) skippedNoDate++; return; }
    if(!code){ skippedNoCode++; return; }
    const nhom = (r["Nhóm"]||r["Nhom"]||"").trim();
    const lop = (r["Lớp/Phòng"]||r["Lop/Phong"]||"").trim();
    let room = "";
    if(["P301","P303","P302"].includes(lop)) room = lop;
    else if(/quân nhu|quan nhu/i.test(nhom)) room = "QNhu";
    else if(/quân khí|quan khi/i.test(nhom)) room = "QKhi";
    else room = lop || "P301";

    const teacherCodeRaw = (r["Mã GV"]||r["Ma GV"]||"").trim();
    const subjFromMap = subjMap[code.toLowerCase()];
    const teachFromMap = teacherCodeRaw ? teachMap[teacherCodeRaw.toLowerCase()] : null;
    const sheetSubjectName = (r["Tên môn học"]||r["Ten mon hoc"]||"").trim();
    const sheetTeacherName = (r["Tên giáo viên"]||r["Ten giao vien"]||"").trim();
    const looksLikeError = (t)=> /^#|chưa có trong danh mục/i.test(t||"");

    out.push({
      id: id++,
      date,
      period: (r["Tiết"]||r["Tiet"]||"").trim(),
      room,
      code,
      subject: (subjFromMap && subjFromMap.name) || (!looksLikeError(sheetSubjectName) && sheetSubjectName) || code,
      teacherCode: teacherCodeRaw || null,
      teacher: (teachFromMap && teachFromMap.name) || (!looksLikeError(sheetTeacherName) && sheetTeacherName) || null,
      location: (r["Địa điểm / Ghi chú"]||r["Dia diem / Ghi chu"]||"").trim(),
      isHoliday: code === "NGHI_LE" || /nghỉ lễ/i.test(sheetSubjectName),
    });
  });
  return {lessons: out, skippedNoDate, skippedNoCode};
}
function buildCatalogMap(rows, codeKeys, nameKeys, extra){
  const map = {};
  rows.forEach(r=>{
    let code = "", name = "";
    for(const k of codeKeys){ if(r[k]){ code=r[k].trim(); break; } }
    for(const k of nameKeys){ if(r[k]){ name=r[k].trim(); break; } }
    if(code) map[code.toLowerCase()] = {code, name};
  });
  return map;
}
function buildSubjects(rows){
  return buildCatalogMap(rows, ["Mã môn","Ma mon"], ["Tên bài / môn học","Tên môn học","Ten bai / mon hoc"]);
}
function buildTeachers(rows){
  const map = buildCatalogMap(rows, ["Mã GV","Ma GV"], ["Tên giáo viên","Ten giao vien"]);
  return Object.values(map);
}

/* ================= Constants ================= */
const TRACKS = [
  {key:"P301", label:"Quân y · L1 (P301)"},
  {key:"P303", label:"Quân y · L2 (P303)"},
  {key:"P302", label:"Quân y · L3 (P302)"},
  {key:"QNhu", label:"Quân nhu"},
  {key:"QKhi", label:"Quân khí"},
];
const SLOTS = [
  {key:"s1", periods:["1-3","2-3"]},
  {key:"s2", periods:["4-5"]},
  {key:"s3", periods:["6-8"]},
];
function slotOf(period){ return SLOTS.find(s=>s.periods.includes(period)) || SLOTS[0]; }
function trackVar(key){ return {P301:"p301", P303:"p303", P302:"p302", QNhu:"nhu", QKhi:"khi"}[key]; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtVN(iso){ if(!iso) return ""; const d=parseISO(iso); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function mondayOf(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return toISO(d); }
function weekdayNameOf(iso){ const d=parseISO(iso); const names=["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"]; return names[d.getDay()]; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function periodStart(p){ return parseInt(String(p).split("-")[0],10) || 0; }
function sortLessons(a,b){ const pa=periodStart(a.period), pb=periodStart(b.period); if(pa!==pb) return pa-pb; return TRACKS.findIndex(t=>t.key===a.room)-TRACKS.findIndex(t=>t.key===b.room); }
const TODAY = todayISO();

let lessons = [];
let teachers = [];
let IDX = {byDate:{}, MIN_DATE:null, MAX_DATE:null};
function reindex(){
  const byDate = {}; let MIN_DATE=null, MAX_DATE=null;
  lessons.forEach(l=>{
    (byDate[l.date] = byDate[l.date] || []).push(l);
    if(!MIN_DATE || l.date<MIN_DATE) MIN_DATE=l.date;
    if(!MAX_DATE || l.date>MAX_DATE) MAX_DATE=l.date;
  });
  IDX = {byDate, MIN_DATE, MAX_DATE};
}

const state = {
  tab:"week", teacher:"", selectedDay:null,
  weekAnchor: TODAY, monthAnchor: TODAY.slice(0,7)+"-01",
  pinOpen: localStorage.getItem("pinOpen") !== "0",

}
function clearStatus(){ document.getElementById("statusArea").innerHTML = ""; }

}

  showStatus("error",

  );

/* ================= Load data ================= */
async function loadAllData(){
  if(!isConfigured()){ showSetupInstructions(); return; }
  showLoading();
  document.getElementById("pinToday").style.display = "none";
  try{
    const [lessonRows, subjRows, teachRows] = await Promise.all([
      fetchCSV(CSV_URL_LESSONS), fetchCSV(CSV_URL_SUBJECTS), fetchCSV(CSV_URL_TEACHERS)
    ]);
    const subjMap = buildSubjects(subjRows);
    teachers = buildTeachers(teachRows);
    const teachMap = {}; teachers.forEach(t=>teachMap[t.code.toLowerCase()]=t);
    const built = buildLessons(lessonRows, subjMap, teachMap);
    lessons = built.lessons;
    reindex();
    clearStatus();
    document.getElementById("pinToday").style.display = "";
    const anchor = (IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE) ? TODAY : (IDX.MIN_DATE||TODAY);
    state.weekAnchor = mondayOf(anchor);
    state.monthAnchor = anchor.slice(0,7)+"-01";
    refreshTeacherSelect();
    renderAll();
  }catch(err){
    showError(err.message || String(err));
  }
  await loadTasks();
}
async function loadTasks(){
  if(!CSV_URL_TASKS){ tasksStatus="nocfg"; tasks=[]; reindexTasks(); return; }
  tasksStatus = "loading";
  try{
    const rows = await fetchCSV(CSV_URL_TASKS);
    tasks = buildTasks(rows); reindexTasks(); tasksStatus = "ok";
  }catch(err){
    tasks = []; reindexTasks(); tasksStatus = "error"; tasksError = err.message || String(err);
  }
  renderAll();
}
document.getElementById("refreshBtn").addEventListener("click", loadAllData);

function openDetail(lesson){
  const body = document.getElementById("detailBody");
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  body.innerHTML = [
    ["Môn học", lesson.subject],
    ["Mã môn", lesson.code],
    ["Nhóm/Lớp", lesson.isHoliday ? "—" : (trackInfo?trackInfo.label:lesson.room)],
    ["Ngày", weekdayNameOf(lesson.date)+", "+fmtVN(lesson.date)],
    ["Tiết", lesson.period||"—"],
    ["Giáo viên", lesson.teacher || "Chưa rõ"],
    ["Địa điểm / Ghi chú", lesson.location || "—"],
  ].map(([k,v])=>"<div class='kv'><span class='k'>"+k+"</span><span class='v'>"+escapeHtml(v)+"</span></div>").join("");
  detailOverlay.classList.add("show");
}
function chipEl(lesson){
  const el = document.createElement("div");
  const trackClass = lesson.isHoliday ? "holiday" : "track-"+lesson.room;
  el.className = "chip " + trackClass;
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  const tagText = lesson.isHoliday ? "NGHỈ" : (trackInfo ? trackInfo.label.replace("Quân y · ","").replace("Quân ","Q.") : lesson.room);
  el.innerHTML =
    "<div class='chip-top'><span class='chip-track-tag'>"+escapeHtml(tagText)+"</span>" +
    "<span class='chip-code'>"+escapeHtml(lesson.code)+", tiết "+escapeHtml(lesson.period||"")+"</span>" +
    "<span class='chip-teacher'>"+escapeHtml(lesson.teacher || (lesson.isHoliday? "" : "GV: chưa rõ"))+"</span></div>" +
    "<div class='chip-subject'>"+escapeHtml(lesson.subject)+"</div>";
  if(state.teacher){
    if(lesson.teacherCode && lesson.teacherCode.toLowerCase() === state.teacher.toLowerCase()) el.classList.add("match");
    else el.classList.add("dim");
  }
  el.addEventListener("click", ()=>openDetail(lesson));
  return el;
}

/* ================= Pinned today ================= */
function nextLessonFrom(iso){
  const dates = Object.keys(IDX.byDate).filter(d=>d>iso).sort();
  for(const d of dates){ if(IDX.byDate[d].length) return IDX.byDate[d].slice().sort(sortLessons)[0]; }
  return null;
}
function taskCountFor(dateIso){ return (TASKIDX[dateIso]||[]).length; }
function renderPin(){
  const inRange = IDX.MIN_DATE && TODAY >= IDX.MIN_DATE && TODAY <= IDX.MAX_DATE;
  const todays = (IDX.byDate[TODAY] || []).slice().sort(sortLessons);
  const nT = taskCountFor(TODAY);
  const body = document.getElementById("pinBody");
  body.innerHTML = "";
  if(nT){
    const tl = document.createElement("div"); tl.className="task-list";
    TASKIDX[TODAY].forEach((t,i)=>tl.appendChild(taskItemEl(t,i)));
    body.appendChild(tl);
  } else {
    const p = document.createElement("div"); p.className="pin-empty";
    p.textContent = tasksStatus==="nocfg" ? "Chưa kết nối sheet công việc." : "Hôm nay chưa có công việc nào được ghi.";
    body.appendChild(p);
  }
  if(inRange){
    const line = document.createElement("div"); line.className = "pin-lessons" + (todays.length ? "" : " none");
    line.innerHTML = todays.length
      ? "<span class='pl-ico'>📚</span><span class='pl-txt'><b>" + todays.length + "</b> buổi học</span>"
      : "<span class='pl-ico'>📚</span><span class='pl-txt'>Không có buổi học</span>";
    const head = document.getElementById("pinHead");
    const old = head.querySelector(".pin-lessons"); if(old) old.remove();
    head.appendChild(line);
  }
  const linkBtn = document.createElement("button");
  linkBtn.className = "pin-tasklink";
  linkBtn.textContent = "Xem tất cả";
  linkBtn.setAttribute("aria-label","Xem tất cả công việc");
  linkBtn.addEventListener("click", (e)=>{ e.stopPropagation(); state.taskDate=TODAY; document.querySelector('.tab[data-tab="tasks"]').click(); });
  const lastBody = body.querySelector(".task-item:last-child .task-body");
  if(lastBody){
    const row = document.createElement("div"); row.className = "pin-noterow";
    const note = lastBody.querySelector(".task-note");
    if(note) row.appendChild(note);
    row.appendChild(linkBtn);
    lastBody.appendChild(row);
  } else {
    body.appendChild(linkBtn);
  }
}

/* ================= Week view ================= */
function renderWeek(){
  const root = document.getElementById("view-week");
  root.innerHTML = "";
  if(!IDX.MIN_DATE) return;
  const bar = document.createElement("div"); bar.className="bar";
  const weekEnd = addDays(state.weekAnchor,4);
  bar.innerHTML = "<h2>Tuần "+fmtVN(state.weekAnchor)+" – "+fmtVN(weekEnd)+"</h2>";
  const navGroup = document.createElement("div"); navGroup.className="nav-group";
  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹";
  const next = document.createElement("button"); next.className="iconbtn"; next.textContent="›";
  prev.addEventListener("click", ()=>{ state.weekAnchor=addDays(state.weekAnchor,-7); renderAll(); });
  next.addEventListener("click", ()=>{ state.weekAnchor=addDays(state.weekAnchor,7); renderAll(); });
  navGroup.appendChild(prev); navGroup.appendChild(next); bar.appendChild(navGroup);
  root.appendChild(bar);

  for(let i=0;i<5;i++){
    const iso = addDays(state.weekAnchor, i);
    const dayLessons = IDX.byDate[iso]||[];
    const card = document.createElement("div");
    card.className = "day-card" + (iso===TODAY?" is-today":"");
    const head = document.createElement("div"); head.className="day-head";
    head.innerHTML = "<span class='wd'>"+weekdayNameOf(iso)+"</span><span class='dd'>"+parseISO(iso).getDate()+"</span><span class='dt'>"+String(parseISO(iso).getMonth()+1).padStart(2,"0")+"/"+parseISO(iso).getFullYear()+"</span>"+(iso===TODAY?"<span class='today-badge'>Hôm nay</span>":"");
    card.appendChild(head);
    SLOTS.forEach(slot=>{
      const slotLessons = dayLessons.filter(l=>l.period && slotOf(l.period).key===slot.key).sort((a,b)=>TRACKS.findIndex(t=>t.key===a.room)-TRACKS.findIndex(t=>t.key===b.room));
      if(!slotLessons.length) return;
      const periodLabel = slotLessons[0].period;
      const block = document.createElement("div"); block.className="slot-block";
      const headline = (slot.key==="s3"?"Chiều":"Sáng")+", tiết "+periodLabel;
      block.innerHTML = "<div class='slot-head'><span>"+escapeHtml(headline)+"</span><span class='slot-count'>"+slotLessons.length+" buổi</span></div>";
      const chips = document.createElement("div"); chips.className="slot-chips";
      slotLessons.forEach(l=>chips.appendChild(chipEl(l)));
      block.appendChild(chips);
      card.appendChild(block);
    });
    if(!dayLessons.length){
      const empty = document.createElement("div"); empty.className="slot-empty"; empty.style.padding="12px"; empty.textContent="Không có lịch học.";
      card.appendChild(empty);
    }
    root.appendChild(card);
  }
}

/* ================= Month view ================= */
function renderMonth(){
  const root = document.getElementById("view-month");
  root.innerHTML = "";
  if(!IDX.MIN_DATE) return;
  const [y,m] = state.monthAnchor.split("-").map(Number);
  const monthDate = new Date(y, m-1, 1);
  const bar = document.createElement("div"); bar.className="bar";
  bar.innerHTML = "<h2>Tháng "+m+"/"+y+"</h2>";
  const navGroup = document.createElement("div"); navGroup.className="nav-group";
  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹";
  const next = document.createElement("button"); next.className="iconbtn"; next.textContent="›";
  prev.addEventListener("click", ()=>{ const d=new Date(y,m-2,1); state.monthAnchor=toISO(d).slice(0,7)+"-01"; renderAll(); });
  next.addEventListener("click", ()=>{ const d=new Date(y,m,1); state.monthAnchor=toISO(d).slice(0,7)+"-01"; renderAll(); });
  navGroup.appendChild(prev); navGroup.appendChild(next); bar.appendChild(navGroup);
  const detail = document.createElement("div"); detail.className="day-detail"; detail.id="monthDayDetail";
  root.appendChild(detail);
  root.appendChild(bar);

  const mine = (l)=> state.teacher && l.teacherCode && l.teacherCode.toLowerCase()===state.teacher.toLowerCase();
  if(state.teacher){
    const tName = (teachers.find(t=>t.code.toLowerCase()===state.teacher.toLowerCase())||{}).name || state.teacher;
    const prefix = state.monthAnchor.slice(0,7);
    const mm = lessons.filter(l=>l.date.startsWith(prefix) && mine(l));
    const nDays = new Set(mm.map(l=>l.date)).size;
    const banner = document.createElement("div"); banner.className="teach-banner";
    banner.textContent = "Đang tô sáng ngày dạy của "+tName+": "+nDays+" ngày · "+mm.length+" buổi trong tháng "+m+"/"+y+".";
    root.appendChild(banner);
  }
  const scrollWrap = document.createElement("div"); scrollWrap.className="month-scroll";
  const grid = document.createElement("div"); grid.className="month-grid";
  ["T2","T3","T4","T5","T6","T7","CN"].forEach(l=>{ const el=document.createElement("div"); el.className="wd-label"; el.textContent=l; grid.appendChild(el); });
  const firstDow = (monthDate.getDay()+6)%7;
  const startIso = toISO(new Date(y, m-1, 1-firstDow));
  for(let i=0;i<42;i++){
    const iso = addDays(startIso, i);
    const inMonth = iso.slice(0,7) === state.monthAnchor.slice(0,7);
    const cell = document.createElement("div");
    cell.className = "month-cell"+(inMonth?"":" out")+(iso===TODAY?" is-today":"")+(iso===state.selectedDay?" selected":"");
    const allDay = IDX.byDate[iso]||[];
    const dayLessons = state.teacher ? allDay.filter(mine) : allDay;
    if(state.teacher){ cell.classList.add(dayLessons.length ? "teach-hit" : "teach-off"); }
    const num = document.createElement("div"); num.className="num"; num.textContent=String(parseISO(iso).getDate());
    cell.appendChild(num);
    {
      const dots = document.createElement("div"); dots.className="month-dots"; const seen={};
      dayLessons.forEach(l=>{ const k=l.isHoliday?"holiday":l.room; if(seen[k])return; seen[k]=1;
        const d=document.createElement("span"); d.className="dot"; d.style.background=l.isHoliday?"var(--red)":"var(--"+trackVar(l.room)+")"; dots.appendChild(d); });
      cell.appendChild(dots);
      if(dayLessons.length){
        const cnt = document.createElement("div"); cnt.className="month-count"; cnt.textContent=dayLessons.length+" buổi";
        cell.appendChild(cnt);
      }
    }
    if(taskCountFor(iso)){
      const tk = document.createElement("div"); tk.className="month-task"; tk.textContent="📝 "+taskCountFor(iso);
      cell.appendChild(tk);
    }
    cell.addEventListener("click", ()=>{ state.selectedDay=iso; renderMonth(); renderDayDetail(); });
    grid.appendChild(cell);
  }
  scrollWrap.appendChild(grid); root.appendChild(scrollWrap);
  const lgM = document.createElement("div"); lgM.className="legend legend-month";
  lgM.innerHTML = TRACKS.map(t=>"<span><span class='dot' style='background:var(--"+trackVar(t.key)+")'></span>"+t.label+"</span>").join("");
  root.appendChild(lgM);
  const lessonDetail = document.createElement("div"); lessonDetail.className="day-detail"; lessonDetail.id="monthLessonDetail";
  root.appendChild(lessonDetail);
  renderDayDetail();
}
function renderDayDetail(){
  const elT = document.getElementById("monthDayDetail");
  const elL = document.getElementById("monthLessonDetail");
  if(!elT && !elL) return;
  const iso = state.selectedDay || ((IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE)?TODAY:(IDX.MIN_DATE||TODAY));

    const panel = document.createElement("div"); panel.className="panel";
    panel.innerHTML = "<h3>Lịch học · "+dateLabel+"</h3>";
    const wrap = document.createElement("div"); wrap.className="pin-grid";
    if(lessonsHere.length) lessonsHere.forEach(l=>wrap.appendChild(chipEl(l)));
    else { const e=document.createElement("div"); e.className="pin-empty"; e.textContent="Không có lịch học ngày này."; wrap.appendChild(e); }
    panel.appendChild(wrap);
    elL.innerHTML=""; elL.appendChild(panel);
  }

/* ================= Stats view ================= */
function renderStats(){
  const root = document.getElementById("view-stats");
  root.innerHTML = "";
  if(!IDX.MIN_DATE) return;
  const total = lessons.length;
  const weekEnd = addDays(state.weekAnchor,4);
  const thisWeek = lessons.filter(l=>l.date>=state.weekAnchor && l.date<=weekEnd).length;
  const monthPrefix = state.monthAnchor.slice(0,7);
  const thisMonth = lessons.filter(l=>l.date && l.date.startsWith(monthPrefix)).length;
  const wdCount = {}; lessons.forEach(l=>{ const wd=weekdayNameOf(l.date); wdCount[wd]=(wdCount[wd]||0)+1; });
  const busiest = Object.entries(wdCount).sort((a,b)=>b[1]-a[1])[0];
  const next = nextLessonFrom(TODAY) || (IDX.byDate[TODAY]&&IDX.byDate[TODAY][0]);

  const statGrid = document.createElement("div"); statGrid.className="stat-grid";
  [[total,"Tổng buổi học"],[thisWeek,"Buổi học tuần đang xem"],[thisMonth,"Buổi học tháng đang xem"],[busiest?busiest[0]:"—","Ngày bận nhất"]].forEach(([n,l])=>{
    const c=document.createElement("div"); c.className="stat-card";
    c.innerHTML = "<div class='stat-num'>"+n+"</div><div class='stat-label'>"+l+"</div>";
    statGrid.appendChild(c);
  });
  root.appendChild(statGrid);

  const teacherCount = {};
  lessons.forEach(l=>{ const key=l.teacher||"Chưa xác định"; teacherCount[key]=(teacherCount[key]||0)+1; });
  const teacherEntries = Object.entries(teacherCount).sort((a,b)=>b[1]-a[1]);
  const maxT = teacherEntries[0]?teacherEntries[0][1]:1;
  const teacherPanel = document.createElement("div"); teacherPanel.className="panel";
  teacherPanel.innerHTML = "<h3>Số buổi dạy theo giáo viên</h3>";
  teacherEntries.forEach(([name,n])=>{
    const row=document.createElement("div"); row.className="bar-row";
    row.innerHTML = "<div class='name'>"+escapeHtml(name)+"</div><div class='track'><div class='fill' style='width:"+(n/maxT*100)+"%'></div></div><div class='n'>"+n+"</div>";
    teacherPanel.appendChild(row);
  });
  root.appendChild(teacherPanel);

  const trackCount = {}; lessons.forEach(l=>{ trackCount[l.room]=(trackCount[l.room]||0)+1; });
  const maxTr = Math.max(1,...Object.values(trackCount));
  const trackPanel = document.createElement("div"); trackPanel.className="panel";
  trackPanel.innerHTML = "<h3>Số buổi học theo nhóm</h3>";
  TRACKS.forEach(t=>{
    const n=trackCount[t.key]||0;
    const row=document.createElement("div"); row.className="bar-row";
    row.innerHTML = "<div class='name'>"+t.label+"</div><div class='track'><div class='fill' style='width:"+(n/maxTr*100)+"%; background:var(--"+trackVar(t.key)+")'></div></div><div class='n'>"+n+"</div>";
    trackPanel.appendChild(row);
  });
  root.appendChild(trackPanel);

  const nextPanel = document.createElement("div"); nextPanel.className="panel";
  nextPanel.innerHTML = "<h3>Buổi học sắp tới gần nhất</h3>";
  if(next){ const wrap=document.createElement("div"); wrap.className="pin-grid"; wrap.appendChild(chipEl(next)); nextPanel.appendChild(wrap); }
  else nextPanel.innerHTML += "<div class='pin-empty'>Không có buổi học nào sắp tới.</div>";
  root.appendChild(nextPanel);
}

/* ================= Cong viec theo ngay (doc tu Google Sheet, chi xem) ================= */
let tasks = [];
let TASKIDX = {};
let tasksStatus = CSV_URL_TASKS ? "loading" : "nocfg";   // loading | ok | error | nocfg
let tasksError = "";
function buildTasks(rows){
  const out = [];
  rows.forEach(r=>{
    const date = normalizeDate(r["Ngày"]||r["Ngay"]||"");
    const title = (r["Nội dung công việc"]||r["Noi dung cong viec"]||"").trim();
    if(!date || !title) return;
    out.push({
      date, title,
      people: (r["Thành phần"]||r["Thanh phan"]||"").trim(),
      note: (r["Ghi chú"]||r["Ghi chu"]||"").trim(),
    });
  });
  return out;
}
function reindexTasks(){
  TASKIDX = {};
  tasks.forEach(t=>{ (TASKIDX[t.date] = TASKIDX[t.date] || []).push(t); });
}
function taskItemEl(t, idx){
  const el = document.createElement("div"); el.className = "task-item";
  let h = "<div class='task-num'>"+(idx!=null?idx+1:"•")+"</div><div class='task-body'>";
  h += "<div class='task-title'>"+escapeHtml(t.title)+"</div>";
  if(t.people) h += "<div class='task-meta'><span class='k'>Thành phần</span>"+escapeHtml(t.people)+"</div>";
  if(t.note) h += "<div class='task-note'><span class='k'>Ghi chú</span>"+escapeHtml(t.note)+"</div>";
  h += "</div>";
  el.innerHTML = h;
  return el;
}
function renderTasks(){
  const root = document.getElementById("view-tasks");
  root.innerHTML = "";
  const bar = document.createElement("div"); bar.className="bar";
  bar.innerHTML = "<h2>Công việc triển khai theo ngày</h2>";
  root.appendChild(bar);

  if(tasksStatus === "nocfg"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel setup'><h3>Chưa kết nối sheet công việc</h3><p>Dán link CSV của sheet <code>CongViec</code> vào biến <code>CSV_URL_TASKS</code> ở đầu phần &lt;script&gt;.</p></div>");
    return;
  }
  if(tasksStatus === "loading"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel'><div class='spinner'></div><p>Đang tải công việc…</p></div>");
    return;
  }
  if(tasksStatus === "error"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel error'><h3>Không tải được công việc</h3><p>"+escapeHtml(tasksError)+"</p><p>Kiểm tra sheet <code>CongViec</code> đã được \"Xuất bản lên web\" (CSV) và link đúng gid chưa, rồi bấm Làm mới.</p></div>");
    return;
  }

  const nav = document.createElement("div"); nav.className="log-nav";
  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹";
  const next = document.createElement("button"); next.className="iconbtn"; next.textContent="›";
  prev.addEventListener("click", ()=>{ state.taskDate=addDays(state.taskDate,-1); renderTasks(); });
  next.addEventListener("click", ()=>{ state.taskDate=addDays(state.taskDate,1); renderTasks(); });
  const label = document.createElement("div"); label.className="datelabel";
  label.textContent = weekdayNameOf(state.taskDate)+", "+fmtVN(state.taskDate)+(state.taskDate===TODAY?" (hôm nay)":"");
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
  root.appendChild(nav);

  if(state.taskDate !== TODAY){
    const jump = document.createElement("button"); jump.className="btn btn-outline btn-sm"; jump.style.marginBottom="12px"; jump.textContent="Về hôm nay";
    jump.addEventListener("click", ()=>{ state.taskDate=TODAY; renderTasks(); });
    root.appendChild(jump);
  }

  const items = TASKIDX[state.taskDate] || [];
  if(!items.length){
    const e=document.createElement("div"); e.className="task-empty"; e.textContent="Không có công việc nào được ghi cho ngày này."; root.appendChild(e);
  } else {
    const tl = document.createElement("div"); tl.className="task-list";
    items.forEach((t,i)=>tl.appendChild(taskItemEl(t,i)));
    root.appendChild(tl);
  }

  const up = tasks.filter(t=>t.date>=TODAY && t.date!==state.taskDate).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0).slice(0,30);
  if(up.length){
    const t = document.createElement("h3"); t.className="tbl-title"; t.style.marginTop="8px"; t.textContent="Công việc các ngày sắp tới";
    root.appendChild(t);
    const w = taskTable(up,true);
    w.querySelectorAll("tr[data-date]").forEach(tr=>tr.addEventListener("click", ()=>{ state.taskDate=tr.dataset.date; renderTasks(); window.scrollTo({top:0,behavior:"smooth"}); }));
    root.appendChild(w);
  }
}
function countdownHtml(iso){
  const n = Math.round((parseISO(iso) - parseISO(TODAY)) / 86400000);
  if(n < 0) return "";
  const cls = n === 0 ? "cd now" : (n === 1 ? "cd soon" : (n <= 3 ? "cd near" : "cd"));
  const txt = n === 0 ? "Hôm nay" : (n === 1 ? "Ngày mai" : "Còn " + n + " ngày");
  return "<span class='" + cls + "'>" + txt + "</span>";
}
function taskTable(items, withDate){
  const wrap = document.createElement("div"); wrap.className="tbl-wrap";
  const cell = (label,val,cls)=>"<td class='"+(cls||"")+"' data-label='"+label+"'"+(val?"":" data-e='1'")+">"+(val?escapeHtml(val):"–")+"</td>";
  let h = "<table class='tbl'><thead><tr><th class='c-stt'>STT</th>"+(withDate?"<th class='c-date'>Ngày</th>":"")+"<th>Nội dung công việc</th><th>Thành phần</th><th>Ghi chú</th></tr></thead><tbody>";
  items.forEach((x,i)=>{
    h += "<tr"+(withDate?" data-date='"+x.date+"'":"")+"><td class='c-stt' data-label='STT'>"+(i+1)+"</td>"
      + (withDate?"<td class='c-date' data-label='Ngày'>"+escapeHtml(weekdayNameOf(x.date)+", "+fmtVN(x.date))+countdownHtml(x.date)+"</td>":"")
      + cell("Nội dung",x.title,"c-main")+cell("Thành phần",x.people)+cell("Ghi chú",x.note)+"</tr>";
  });
  wrap.innerHTML = h+"</tbody></table>";
  return wrap;
}

/* ================= Orchestrator ================= */
function updateTaskTabLabel(){
  const n = (typeof taskCountFor === "function" && tasksStatus === "ok") ? taskCountFor(TODAY) : 0;
  const tab = document.querySelector('.tab[data-tab="tasks"]');
  if(tab) tab.textContent = "Công việc" + (n ? " ("+n+")" : "");
}
function renderAll(){
  document.body.dataset.tab = state.tab;
  updateTaskTabLabel();
  renderLegend();
  renderPin();
  if(state.tab==="week") renderWeek();
  if(state.tab==="month") renderMonth();
  if(state.tab==="tasks") renderTasks();
}

/* ================= Header: ẩn thanh công cụ khi cuộn xuống ================= */
(function(){
  const hdr = document.querySelector("header.top"), wrap = document.getElementById("toolbarWrap");
  if(!hdr || !wrap) return;
  let hidden = false, busy = false, lastY = window.scrollY || 0, busyTimer = null;
  function measure(){ if(hidden || busy) return; document.documentElement.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); }
  function setHidden(v){
    if(v === hidden) return;
    hidden = v; busy = true;
    wrap.classList.toggle("is-hidden", hidden);
    clearTimeout(busyTimer);
    busyTimer = setTimeout(()=>{ busy = false; measure(); }, 340);
  }
  window.addEventListener("scroll", ()=>{
    const y = Math.max(0, window.scrollY || 0), dy = y - lastY;
    if(Math.abs(dy) < 6) return;
    lastY = y;
    if(y <= 24 || dy < 0) setHidden(false);
    else if(y > 120 && dy > 0 && document.activeElement !== document.getElementById("teacherSelect")) setHidden(true);
  }, {passive:true});
  window.addEventListener("resize", ()=>{ setHidden(false); setTimeout(measure, 360); });
  if(window.ResizeObserver) new ResizeObserver(measure).observe(hdr);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();
})();

/* ================= Đồng hồ số ================= */
(function(){
  const t = document.getElementById("clockTime"), d = document.getElementById("clockDate");
  if(!t || !d) return;
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const now = new Date();
    t.innerHTML = pad(now.getHours()) + '<span class="colon">:</span>' + pad(now.getMinutes()) + '<span class="colon">:</span>' + pad(now.getSeconds());
    d.textContent = weekdayNameOf(toISO(now)) + ", " + pad(now.getDate()) + "/" + pad(now.getMonth()+1);
  }
  tick();
  setInterval(tick, 1000);
})();

loadAllData();

})();
</script>
