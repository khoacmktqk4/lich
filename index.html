<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lịch giảng dạy — Khoa Chuyên môn Kỹ thuật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13202D; --ink-2:#3B4C5E; --paper:#F1F5F9; --paper-2:#E6ECF3; --card:#FFFFFF;
  --line:#D9E1EA; --line-soft:#E8EEF4; --muted:#64768A; --brand:#0B3556; --brand-2:#14708A; --hl:#0F7B8F; --on-hl:#fff;
  --gold:#E2761B; --gold-soft:#FDECD8;
  --p301:#13966C; --p301-soft:#DDF3EB; --p303:#D98A0B; --p303-soft:#FBEFD2; --p302:#2B6CD4; --p302-soft:#DCE8FA;
  --nhu:#C2406B; --nhu-soft:#F9DFE8; --khi:#7A5BD6; --khi-soft:#E9E3F9; --red:#CC3A2E; --red-soft:#FADFDC;
  --shadow:0 1px 2px rgba(19,32,45,.05),0 4px 14px rgba(19,32,45,.06);
  --shadow-lg:0 10px 30px rgba(19,32,45,.14);
  --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-serif:var(--font); --font-sans:var(--font); --font-mono:var(--font);
  --radius-s:10px; --radius-m:16px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E8EEF5; --ink-2:#C2CEDB; --paper:#0A1017; --paper-2:#16212D; --card:#111A24; --line:#223140; --line-soft:#1A2733; --muted:#8CA0B3;
  --brand:#08202F; --brand-2:#0C4A5C; --hl:#3CC4D4; --on-hl:#06161C; --gold:#F59A45; --gold-soft:#3A2713;
  --p301:#2FD3A0; --p303:#F0AA35; --p302:#6FA3F5; --nhu:#F07CA0; --khi:#A68EF5; --red:#F0766B;
  --p301-soft:#12302A; --p303-soft:#33270F; --p302-soft:#142640; --nhu-soft:#341823; --khi-soft:#241F3E; --red-soft:#3A1B18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{
  --ink:#E8EEF5; --ink-2:#C2CEDB; --paper:#0A1017; --paper-2:#16212D; --card:#111A24; --line:#223140; --line-soft:#1A2733; --muted:#8CA0B3;
  --brand:#08202F; --brand-2:#0C4A5C; --hl:#3CC4D4; --on-hl:#06161C; --gold:#F59A45; --gold-soft:#3A2713;
  --p301:#2FD3A0; --p303:#F0AA35; --p302:#6FA3F5; --nhu:#F07CA0; --khi:#A68EF5; --red:#F0766B;
  --p301-soft:#12302A; --p303-soft:#33270F; --p302-soft:#142640; --nhu-soft:#341823; --khi-soft:#241F3E; --red-soft:#3A1B18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.55);}
html{scroll-padding-top:96px; height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;}
h1,h2,h3{font-weight:700; margin:0; letter-spacing:-.01em;}
button{font-family:var(--font); cursor:pointer;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

header.top{position:sticky; top:0; z-index:40; background:var(--brand); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;}
.top-row{display:flex; justify-content:space-between; gap:8px; max-width:1080px; margin:0 auto;}
.brand-eyebrow{font-size:11.5px; font-weight:500; color:#9CC4B8; margin-bottom:1px; letter-spacing:.01em;}
.brand h1{font-size:18px; color:#fff; line-height:1.15;}
.toolbar{display:flex; gap:8px; align-items:center; max-width:1080px; margin:9px auto 0;}
select.sel{background:#fff1; color:#fff; border:1px solid #ffffff33; border-radius:999px; padding:8px 14px; font:500 13.5px var(--font); flex:1 1 auto; min-width:0; appearance:auto;}
select.sel option{color:#111;}
.btn{font:600 13px var(--font); border-radius:999px; border:1px solid transparent; padding:8px 13px; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; min-height:36px;}
.btn-gold{background:var(--gold); color:#fff;}
.btn-ghost{background:#ffffff14; color:#fff; border-color:#ffffff2e;}
.btn-ghost:hover{background:#ffffff26;}
.btn-outline{background:var(--card); color:var(--ink); border-color:var(--line);}
.btn-sm{font-size:12px; padding:6px 12px; min-height:32px;}

nav.tabs{display:flex; max-width:1080px; margin:10px auto 0; gap:4px; background:#ffffff14; padding:4px; border-radius:999px;}
.tab{flex:1; font:600 13.5px var(--font); color:#C4D6D0; background:transparent; border:none; padding:8px 6px; border-radius:999px; white-space:nowrap;}
.tab[aria-selected="true"]{background:#fff; color:var(--brand);}
@media (max-width:640px){
  nav.tabs{position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); margin:0; background:var(--brand); box-shadow:0 6px 24px #0006; z-index:60; padding:5px;}
  .tab{padding:11px 4px; font-size:13px;}
  main{padding-bottom:110px !important;}
}
main{max-width:1080px; margin:0 auto; padding:16px 14px 60px;}

.status-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; margin-bottom:16px;}
.status-panel h3{font-size:15px; margin-bottom:6px;}
.status-panel p{font-size:13.5px; color:var(--muted); line-height:1.6; margin:0 0 8px;}
.status-panel ol{margin:8px 0 0; padding-left:20px; font-size:13px; line-height:1.8;}
.status-panel code{background:var(--paper-2); padding:1px 6px; border-radius:5px; font-size:12px;}
.spinner{width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none;}}
.status-panel.error{border-left:5px solid var(--red);}
.status-panel.setup{border-left:5px solid var(--gold);}

/* Hôm nay: khối nổi bật đầu trang */
.pin{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 16px; margin-bottom:18px; box-shadow:0 1px 0 var(--line);}
.pin-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:10px;}
.pin-head-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pin-tag{font-size:12px; font-weight:700; background:var(--gold); color:#fff; padding:3px 10px; border-radius:999px;}
.pin-date{font-weight:700; font-size:18px;}
.pin-sub{font-size:13px; color:var(--muted); width:100%;}
.pin-toggle{background:var(--paper-2); border:none; color:var(--ink); font-size:14px; width:32px; height:32px; border-radius:50%; flex-shrink:0;}
.pin-body{margin-top:12px;}
.pin-empty{font-size:14px; color:var(--muted); padding:4px 0;}
.pin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px;}
.pin-tasklink{margin-top:12px; font:600 13px var(--font); color:var(--gold); background:none; border:none; padding:6px 0; cursor:pointer; display:block;}

/* Thẻ buổi học: vạch màu theo nhóm */
.chip{background:var(--card); border-radius:var(--radius-s); border:1px solid var(--line); border-left:5px solid var(--muted); padding:9px 12px; min-height:48px; cursor:pointer; position:relative;}
.chip:active{background:var(--paper-2);}
.chip-top{display:flex; align-items:center; gap:6px;}
.chip-track-tag{font-size:12px; font-weight:700;}
.chip-code{font-size:12px; color:var(--muted); font-weight:500; margin-top:1px;}
.chip-subject{font-size:14.5px; font-weight:600; margin-top:3px; line-height:1.35;}
.chip-teacher{display:inline-block; margin-top:7px; font-size:14px; font-weight:700; color:var(--on-hl); background:var(--hl); padding:3px 12px; border-radius:999px; line-height:1.4;}
.chip-teacher:empty{display:none;}
.chip.match .chip-teacher{background:var(--gold); color:#fff;}
.slot-count{font-size:12.5px; font-weight:600; color:var(--muted);}
.chip.track-P301{border-left-color:var(--p301); background:linear-gradient(90deg,var(--p301-soft),var(--card) 55%);} .track-P301 .chip-track-tag{color:var(--p301);}
.chip.track-P303{border-left-color:var(--p303); background:linear-gradient(90deg,var(--p303-soft),var(--card) 55%);} .track-P303 .chip-track-tag{color:var(--p303);}
.chip.track-P302{border-left-color:var(--p302); background:linear-gradient(90deg,var(--p302-soft),var(--card) 55%);} .track-P302 .chip-track-tag{color:var(--p302);}
.chip.track-QNhu{border-left-color:var(--nhu); background:linear-gradient(90deg,var(--nhu-soft),var(--card) 55%);} .track-QNhu .chip-track-tag{color:var(--nhu);}
.chip.track-QKhi{border-left-color:var(--khi); background:linear-gradient(90deg,var(--khi-soft),var(--card) 55%);} .track-QKhi .chip-track-tag{color:var(--khi);}
.chip.holiday{border-left-color:var(--red); background:var(--red-soft);} .holiday .chip-track-tag{color:var(--red);}
.chip.dim{opacity:.3;}
.chip.match{box-shadow:0 0 0 2px var(--hl);}

.bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.bar h2{font-size:18px;}
.nav-group{display:flex; gap:8px;}
.iconbtn{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:18px; display:flex; align-items:center; justify-content:center; color:var(--ink);}
.legend{display:flex; gap:6px 14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); margin-bottom:14px; overflow-x:auto;}
.legend span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block;}

/* Tuần: cột ngày bên trái, buổi học bên phải */
.day-card{display:grid; grid-template-columns:72px 1fr; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); margin-bottom:12px; overflow:hidden;}
.day-card.is-today{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold);}
.day-head{grid-row:1 / span 20; flex-direction:column; align-items:center; text-align:center; padding:12px 4px; background:var(--paper-2); border-right:1px solid var(--line); display:flex; gap:2px;}
.day-card.is-today .day-head{background:var(--gold); color:#fff;}
.day-head .wd{font-size:12.5px; font-weight:600;}
.day-head .dd{font-size:26px; font-weight:700; line-height:1.1;}
.day-head .dt{font-size:11.5px; color:var(--muted); font-weight:500; white-space:nowrap;}
.day-card.is-today .dt{color:#fff;}
.day-head .today-badge{margin:6px 0 0; font-size:11px; white-space:nowrap; background:#fff; color:var(--gold); padding:1px 7px; border-radius:999px; font-weight:700;}
.slot-block{padding:10px 12px; border-top:1px solid var(--line-soft); grid-column:2;}
.slot-block:first-of-type{border-top:none;}
.slot-head{font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between;}
.slot-chips{display:flex; flex-wrap:wrap; gap:8px;}
.slot-chips > .chip{flex:1 1 230px;}
.slot-empty{grid-column:2; font-size:13px; color:var(--muted); padding:14px 12px !important;}

/* Tháng: lưới gọn, vừa màn hình điện thoại */
.month-scroll{margin:0;}
.month-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px;}
.month-grid .wd-label{font-size:12px; font-weight:600; color:var(--muted); text-align:center; padding-bottom:2px;}
.month-cell{background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:62px; padding:5px; cursor:pointer; display:flex; flex-direction:column; gap:3px; overflow:hidden;}
.month-cell.out{opacity:.35;}
.month-cell.is-today{border:2px solid var(--gold);}
.month-cell.selected{background:var(--gold-soft);}
.month-cell .num{font-size:13px; font-weight:700;}
.month-dots{display:flex; flex-wrap:wrap; gap:3px; margin-top:auto;}
.month-dots .dot{width:7px; height:7px;}
.month-count{font-size:11px; color:var(--muted); font-weight:500;}
.month-cell .month-task{font-size:11px; color:var(--gold); font-weight:600;}
.month-cell.teach-hit{background:var(--hl); border-color:var(--hl); box-shadow:none; color:var(--on-hl);}
.month-cell.teach-hit .num, .month-cell.teach-hit .month-count, .month-cell.teach-hit .month-task{color:var(--on-hl);}
.month-cell.teach-hit .dot{box-shadow:0 0 0 1.5px #fff;}
.month-cell.teach-off:not(.out){opacity:.55;}
.teach-banner{font-size:13.5px; font-weight:500; background:var(--card); border:1px solid var(--hl); border-left:5px solid var(--hl); border-radius:var(--radius-s); padding:9px 12px; margin-bottom:12px;}
@media (max-width:480px){ .month-count{display:none;} .month-cell{min-height:54px; padding:4px;} .month-cell.teach-hit .num{font-size:15px;} }
.day-detail{margin-top:16px;} .task-block{margin-top:14px;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px;}
.stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px;}
.stat-num{font-size:26px; font-weight:700; line-height:1.1; color:var(--hl);}
.stat-label{font-size:13px; color:var(--muted); margin-top:5px;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:14px;}
.panel h3{font-size:15px; margin-bottom:10px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
.bar-row .name{width:110px; flex-shrink:0; font-size:13px; font-weight:500;}
.bar-row .track{flex:1; background:var(--paper-2); border-radius:999px; height:12px; overflow:hidden;}
.bar-row .fill{background:var(--hl); height:100%; border-radius:999px;}
.bar-row .n{width:32px; text-align:right; font-weight:600; flex-shrink:0;}

/* Công việc */
.log-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 8px;}
.log-nav .datelabel{flex:1; font-weight:700; font-size:15.5px; text-align:center;}
.task-list{display:flex; flex-direction:column; gap:9px; margin-bottom:20px;}
.task-item{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 14px 12px 16px; position:relative; display:flex; gap:11px;}
.task-item::before{content:""; position:absolute; left:0; top:10px; bottom:10px; width:4px; border-radius:4px; background:var(--gold);}
.task-num{flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--gold-soft); color:var(--gold); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.task-body{flex:1; min-width:0;}
.task-title{font-size:15px; font-weight:600; line-height:1.4; word-break:break-word;}
.task-meta{font-size:13.5px; color:var(--ink-2); margin-top:5px;}
.task-meta .k, .task-note .k{font-size:12.5px; font-weight:600; color:var(--muted); margin-right:6px;}
.task-meta .k::after, .task-note .k::after{content:":";}
.task-note{font-size:13.5px; color:var(--muted); margin-top:3px; word-break:break-word;}
.task-empty{font-size:14px; color:var(--muted); padding:16px 2px; text-align:center; background:var(--card); border:1px dashed var(--line); border-radius:var(--radius-m);}
.log-note{font-size:12.5px; color:var(--muted); margin-bottom:14px;}
.upcoming-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; font-size:14px;}
.upcoming-row:last-child{border-bottom:none;}
.upcoming-row .d{flex:1;} .upcoming-row .n{font-size:12.5px; font-weight:700; color:var(--gold);}

/* Chi tiết: dạng ngăn kéo từ dưới lên trên điện thoại */
.overlay{position:fixed; inset:0; background:rgba(10,16,13,.55); display:none; align-items:flex-end; justify-content:center; z-index:200;}
.overlay.show{display:flex;}
@media (min-width:641px){ .overlay{align-items:center; padding:16px;} }
.modal{background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:440px; max-height:85vh; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom,0px);}
@media (min-width:641px){ .modal{border-radius:22px;} }
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px;}
.modal-head h3{font-size:17px;}
.modal-close{background:var(--paper-2); border:none; color:var(--ink); font-size:20px; width:34px; height:34px; border-radius:50%;}
.modal-body{padding:6px 20px 20px;}
.kv{display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:14.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted); flex-shrink:0;} .kv .v{text-align:right; font-weight:600;}

#toast{position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s, transform .2s; z-index:300; pointer-events:none; max-width:90vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
footer{max-width:1080px; margin:0 auto; padding:0 14px 110px; color:var(--muted); font-size:12px;}

.slot-toggle{font:600 12.5px var(--font); color:var(--hl); background:var(--paper-2); border:none; border-radius:999px; padding:5px 12px; min-height:30px;}
.slot-head{align-items:center;}
.slot-block .slot-chips{margin-top:2px;}
.pin-lessons{display:flex; align-items:center; justify-content:space-between; width:100%; margin-top:12px; font:600 14px var(--font); color:var(--ink); background:var(--paper-2); border:none; border-radius:12px; padding:11px 14px;}
.pin-lessons + .pin-grid{margin-top:10px;}
.pin-h{font-size:13px; font-weight:700; color:var(--muted); margin:0 0 8px;}
.pin-body .task-list{margin-bottom:0;}
.tbl-wrap{margin-bottom:18px;}
.tbl{width:100%; border-collapse:separate; border-spacing:0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
.tbl th{background:var(--brand); color:#fff; text-align:left; font:600 13px var(--font); padding:11px 14px;}
.tbl td{padding:12px 14px; border-top:1px solid var(--line-soft); vertical-align:top; font-size:14px; word-break:break-word;}
.tbl tbody tr:nth-child(even) td{background:var(--paper-2);}
.tbl tbody tr[data-date]{cursor:pointer;}
.tbl .c-stt{width:52px; text-align:center; color:var(--muted); font-weight:600;}
.tbl .c-date{width:150px; white-space:nowrap; font-weight:600; color:var(--gold);}
.tbl .c-main{font-weight:600; min-width:220px;}
.tbl-title{font-size:15px; font-weight:700; margin:0 0 10px;}
@media (max-width:640px){
  .tbl, .tbl tbody, .tbl tr, .tbl td{display:block; width:100%;}
  .tbl{border:none; background:none; border-radius:0;}
  .tbl thead{display:none;}
  .tbl tbody tr{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--gold); border-radius:var(--radius-s); margin-bottom:8px; padding:6px 0;}
  .tbl tbody tr:nth-child(even) td{background:none;}
  .tbl td{border-top:none; padding:4px 14px; font-size:14px;}
  .tbl td::before{content:attr(data-label) ": "; font-weight:600; color:var(--muted); font-size:12.5px;}
  .tbl td.c-stt{display:none;}
  .tbl td.c-date{width:auto; font-size:13px;} .tbl td.c-date::before{content:"";}
  .tbl td.c-main{font-size:15px; min-width:0;} .tbl td.c-main::before{content:"";}
  .tbl td[data-e]{display:none;}
}

/* ===== Giao diện mới ===== */
body{background:var(--paper);}
header.top{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); box-shadow:0 6px 24px rgba(8,32,47,.28); padding-bottom:12px;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-logo{width:44px; height:44px; flex-shrink:0; border-radius:13px; background:linear-gradient(145deg,#ffffff30,#ffffff10); border:1px solid #ffffff3a; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 #ffffff30;}
.brand-logo svg{width:24px; height:24px;}
.brand-text{min-width:0;}
.brand-eyebrow{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#BFE6EE; background:#ffffff18; border:1px solid #ffffff22; padding:2px 9px; border-radius:999px; margin-bottom:5px;}
.brand h1{font-size:21px; font-weight:800; line-height:1.15; letter-spacing:-.02em; color:#fff;}
.brand h1 .yr{color:#FFD29A;}
@media (min-width:641px){ .brand h1{font-size:26px;} .brand-logo{width:50px; height:50px;} }
select.sel{background:#ffffff1c; border:1px solid #ffffff38; font-weight:600; border-radius:12px;}
.btn{border-radius:12px; transition:background .15s, transform .1s;}
.btn:active{transform:scale(.97);}
.btn-ghost{background:#ffffff1c; border-color:#ffffff38;}
#themeBtn{padding:8px 14px; font-size:16px;}
nav.tabs{background:#00000030; border-radius:14px; padding:4px;}
.tab{border-radius:11px; color:#CFE3EA; transition:background .15s,color .15s;}
.tab[aria-selected="true"]{background:#fff; color:var(--brand); box-shadow:0 2px 8px rgba(0,0,0,.2);}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}}
@media (max-width:640px){
  .toolbar{flex-wrap:wrap;}
  select.sel{flex:1 1 100%;}
  .toolbar .btn{flex:1 1 0;}
  #themeBtn{flex:0 0 52px;}
  nav.tabs{border-radius:18px; background:var(--brand); border:1px solid #ffffff22; box-shadow:0 8px 28px rgba(0,0,0,.4);}
}
main{padding-top:18px;}
.pin{border-radius:20px; border:1px solid var(--line); box-shadow:var(--shadow); background:linear-gradient(180deg,var(--card),var(--card)); position:relative; overflow:hidden;}
.pin::before{content:""; position:absolute; left:0; right:0; top:0; height:4px; background:linear-gradient(90deg,var(--gold),var(--hl));}
.pin-tag{background:linear-gradient(135deg,var(--gold),#F0A24B); box-shadow:0 2px 6px rgba(226,118,27,.35);}
.pin-toggle{background:var(--paper-2);}
.chip{border-radius:12px; box-shadow:0 1px 2px rgba(19,32,45,.04); transition:transform .12s, box-shadow .12s;}
.chip:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
.chip-teacher{background:var(--hl);}
.legend{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; box-shadow:var(--shadow);}
.bar h2{font-size:19px; font-weight:800;}
.iconbtn{box-shadow:var(--shadow); transition:background .15s;}
.iconbtn:hover{background:var(--paper-2);}
.day-card{border-radius:18px; box-shadow:var(--shadow); border:1px solid var(--line);}
.day-card.is-today{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold),var(--shadow);}
.day-head{background:linear-gradient(180deg,var(--paper-2),var(--card));}
.day-card.is-today .day-head{background:linear-gradient(180deg,var(--gold),#F0A24B); color:#fff;}
.day-head .dd{font-weight:800;}
.slot-head{text-transform:none; letter-spacing:0;}
.slot-toggle{background:var(--paper-2);}
.month-cell{border-radius:12px; box-shadow:0 1px 2px rgba(19,32,45,.04);}
.month-cell.is-today{border:2px solid var(--gold); background:var(--gold-soft);}
.month-cell.selected{background:var(--gold-soft); border-color:var(--gold);}
.month-cell.teach-hit{background:linear-gradient(145deg,var(--hl),var(--brand-2));}
.teach-banner{border-radius:12px; box-shadow:var(--shadow);}
.stat-card{border-radius:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg,var(--hl),var(--gold));}
.stat-num{font-weight:800;}
.panel, .status-panel, .log-nav, .task-item{box-shadow:var(--shadow);}
.panel{border-radius:18px;}
.bar-row .fill{background:linear-gradient(90deg,var(--hl),var(--brand-2));}
.task-item{border-radius:14px;}
.tbl{box-shadow:var(--shadow);}
.tbl th{background:linear-gradient(135deg,var(--brand),var(--brand-2));}
.modal{box-shadow:var(--shadow-lg); border:1px solid var(--line);}
.overlay{backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);}
#toast{background:var(--ink); color:var(--paper);}
::selection{background:var(--hl); color:var(--on-hl);}

/* ===== Header cố định + thanh công cụ tự ẩn khi cuộn ===== */
:root{padding-top:0 !important; --hdr-h:190px;
  --pin-a:#0E7C93; --pin-b:#0B3556; --task-soft:#DDF2F6;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pin-a:#0F6479; --pin-b:#08202F; --task-soft:#0F2F39;}}
:root[data-theme="dark"]{--pin-a:#0F6479; --pin-b:#08202F; --task-soft:#0F2F39;}
html{scroll-padding-top:calc(var(--hdr-h) + 10px);}
header.top{position:fixed; top:0; left:0; right:0; z-index:40;}
body{padding-top:var(--hdr-h);}
.toolbar-wrap{display:grid; grid-template-rows:1fr; max-width:1080px; margin:0 auto; transition:grid-template-rows .28s ease, opacity .22s ease;}
.toolbar-wrap > .toolbar{min-height:0; overflow:hidden; margin:0; max-width:none; padding:0;}
.toolbar-wrap.is-hidden{grid-template-rows:0fr; opacity:0; pointer-events:none;}
.top-row{margin-bottom:9px;}
@media (prefers-reduced-motion:reduce){.toolbar-wrap{transition:none;}}

/* ===== Ghim "Công việc hôm nay" nổi bật ===== */
.pin{background:linear-gradient(135deg,var(--pin-a) 0%,var(--pin-b) 100%); border:1px solid #ffffff22; box-shadow:0 12px 32px rgba(11,53,86,.28);}
.pin::before{height:5px; background:linear-gradient(90deg,#FFB35C,#FFE0B3,#FFB35C);}
.pin::after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#ffffff22,transparent 70%); pointer-events:none;}
.pin-date{color:#fff; font-weight:800;}
.pin-sub{color:#CDE7EE;}
.pin-tag{background:linear-gradient(135deg,#FF9A3D,#FFC27A); color:#3A1D00; box-shadow:0 2px 8px rgba(0,0,0,.25);}
.pin-toggle{background:#ffffff26; color:#fff;}
.pin-h{color:#BFE6EE; text-transform:uppercase; letter-spacing:.07em; font-size:12px;}
.pin-empty{color:#D5EAF0;}
.pin-tasklink{color:#FFD29A;}
.pin-lessons{background:#ffffff1f; color:#fff; border:1px solid #ffffff2e;}
.pin .task-item{border:none; background:var(--card); box-shadow:0 6px 16px rgba(0,0,0,.2);}
.pin .task-item::before{background:linear-gradient(180deg,#FF9A3D,#E2761B); width:5px;}
.pin .task-num{background:linear-gradient(135deg,#FF9A3D,#E2761B); color:#fff;}
.pin .pin-grid .chip{box-shadow:0 4px 12px rgba(0,0,0,.18);}

/* ===== Tab Công việc: danh sách trong ngày + sắp tới ===== */
#view-tasks .log-nav{background:linear-gradient(135deg,var(--pin-a),var(--pin-b)); border:none; box-shadow:0 8px 22px rgba(11,53,86,.25);}
#view-tasks .log-nav .datelabel{color:#fff; font-weight:800;}
#view-tasks .log-nav .iconbtn{background:#ffffff26; border-color:#ffffff33; color:#fff; box-shadow:none;}
#view-tasks .log-nav .iconbtn:hover{background:#ffffff3d;}
#view-tasks .task-item{background:linear-gradient(90deg,var(--task-soft),var(--card) 75%); border:1px solid var(--line); box-shadow:var(--shadow);}
#view-tasks .task-item::before{background:linear-gradient(180deg,var(--hl),var(--brand-2)); width:5px;}
#view-tasks .task-num{background:var(--hl); color:var(--on-hl); box-shadow:0 2px 6px rgba(15,123,143,.35);}
#view-tasks .task-title{font-weight:700;}
#view-tasks .task-empty{background:var(--task-soft); border:1px dashed var(--hl); color:var(--ink-2);}
.tbl-title{display:flex; align-items:center; gap:9px; font-size:16px; font-weight:800;}
.tbl-title::before{content:""; width:5px; height:20px; border-radius:4px; background:linear-gradient(180deg,#FF9A3D,#E2761B);}
.tbl{border-color:var(--gold); box-shadow:0 8px 22px rgba(226,118,27,.14);}
.tbl th{background:linear-gradient(135deg,#D9680F,#F0A24B); color:#fff;}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--gold-soft) 55%,var(--card));}
.tbl tbody tr[data-date]:hover td{background:var(--gold-soft);}
.tbl .c-date{color:var(--gold); font-weight:700;}
@media (max-width:640px){
  .tbl tbody tr{background:linear-gradient(90deg,var(--gold-soft),var(--card) 65%); border:1px solid var(--line); border-left:5px solid var(--gold); box-shadow:var(--shadow);}
  .tbl tbody tr:nth-child(even) td, .tbl tbody tr[data-date]:hover td{background:none;}
}

/* ===== Thẻ tiết học gọn hơn ===== */
.chip{padding:7px 10px; min-height:0;}
.chip-top{display:flex; align-items:center; flex-wrap:wrap; gap:3px 8px;}
.chip-top .chip-code{margin:0; font-size:11.5px;}
.chip-top .chip-teacher{margin:0 0 0 auto; font-size:12.5px; padding:1px 10px;}
.chip-subject{font-size:13.5px; margin-top:3px; line-height:1.3;}
.slot-block{padding:8px 10px;}
.slot-head{margin-bottom:6px; font-size:12px;}
.slot-chips{gap:6px;}
.slot-chips > .chip{flex:1 1 210px;}
.day-card{margin-bottom:10px; grid-template-columns:64px 1fr;}
.day-head{padding:10px 4px;}
.day-head .dd{font-size:22px;}
.slot-empty{padding:10px !important;}

/* ===== Ô chọn giáo viên ngắn + đồng hồ số ===== */
.top-row{align-items:center; gap:10px;}
.brand{min-width:0; flex:1 1 auto;}
select.sel{flex:0 1 190px; min-width:0; padding:8px 12px; text-overflow:ellipsis;}
.clock{flex:0 0 auto; text-align:center; background:linear-gradient(160deg,#00000052,#00000030); border:1px solid #FFC46B55; border-radius:14px; padding:6px 12px 5px; box-shadow:0 0 18px rgba(255,160,50,.22), inset 0 1px 0 #ffffff1a;}
.clock-time{font-weight:800; font-size:24px; line-height:1.1; letter-spacing:.04em; color:#FFC46B; text-shadow:0 0 10px rgba(255,170,60,.65),0 0 24px rgba(255,140,30,.35); font-variant-numeric:tabular-nums; white-space:nowrap;}
.clock-time .colon{animation:blink 1s steps(1,end) infinite; padding:0 1px;}
@keyframes blink{50%{opacity:.25;}}
.clock-date{font-size:10.5px; font-weight:600; color:#DCEFF4; letter-spacing:.03em; margin-top:2px; white-space:nowrap;}
@media (prefers-reduced-motion:reduce){.clock-time .colon{animation:none;}}
@media (min-width:641px){ .clock-time{font-size:30px;} .clock-date{font-size:12px;} .clock{padding:7px 16px 6px;} }
@media (max-width:640px){
  .toolbar{flex-wrap:nowrap;}
  select.sel{flex:1 1 120px; max-width:none;}
  .toolbar .btn{flex:0 0 auto; padding:8px 11px;}
  #themeBtn{flex:0 0 auto;}
  #refreshBtn .lbl{display:none;}
  #refreshBtn{font-size:16px; padding:8px 13px;}
}
@media (max-width:400px){
  .brand-logo{display:none;}
  .brand h1{font-size:19px;}
  .brand-eyebrow{font-size:9.5px; letter-spacing:.05em;}
  .clock{padding:5px 9px 4px;}
  .clock-time{font-size:19px;}
}

/* ===== Ô ghim hôm nay: không thu gọn, không ngày tháng ===== */
.pin-head{cursor:default; justify-content:flex-start;}
.pin-title{color:#fff; font-weight:800; font-size:16px; letter-spacing:-.01em;}
.pin-body{margin-top:12px;}
.pin-lessons{cursor:default; justify-content:flex-start; margin-top:12px; font-size:14px; font-weight:700;}
.pin-lessons.none{font-weight:500; color:#D5EAF0;}

/* ===== Tiêu đề mỗi dòng 1 hàng ===== */
.brand-text{min-width:0;}
.brand-eyebrow, .brand h1{white-space:nowrap;}
@media (max-width:640px){
  .brand-eyebrow{font-size:min(10px,2.8vw); letter-spacing:.04em; padding:2px 8px;}
  .brand h1{font-size:min(20px,4.3vw); overflow:hidden; text-overflow:ellipsis;}
  .brand-text{overflow:hidden;}
}
@media (max-width:520px){ .brand-logo{display:none;} }
@media (max-width:400px){
  .brand h1{font-size:4.2vw;}
  .brand-eyebrow{font-size:2.7vw;}
  .clock-time{font-size:17px;}
}

/* ===== Đếm ngược ngày ===== */
.cd{display:inline-block; margin-top:5px; font-size:11.5px; font-weight:700; line-height:1.4; padding:2px 10px; border-radius:999px; color:#fff; background:linear-gradient(135deg,#0F7B8F,#14708A); box-shadow:0 1px 4px rgba(15,123,143,.35); white-space:nowrap;}
.cd.near{background:linear-gradient(135deg,#D9680F,#F0A24B); box-shadow:0 1px 4px rgba(226,118,27,.4);}
.cd.soon{background:linear-gradient(135deg,#CC3A2E,#E8604F); box-shadow:0 1px 4px rgba(204,58,46,.4);}
.cd.now{background:linear-gradient(135deg,#13966C,#2FD3A0); color:#06241B; box-shadow:0 1px 4px rgba(19,150,108,.4);}
@media (max-width:640px){ .tbl td.c-date .cd{margin:0 0 0 8px;} }

/* ===== Tiêu đề điện thoại: bỏ chữ "năm" để không bị cắt ===== */
@media (max-width:640px){
  .brand h1 .nam{display:none;}
  .brand h1{font-size:min(21px,5.2vw); text-overflow:clip;}
}
@media (max-width:400px){ .brand h1{font-size:5vw;} }

/* ===== Ô ghim hôm nay: bảng màu tím chàm – hồng ===== */
:root{--pin2-a:#5B3FD8; --pin2-b:#2A2380; --people-ink:#5B3FD8;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pin2-a:#4B3BB5; --pin2-b:#1A1550; --people-ink:#B7A4FF;}}
:root[data-theme="dark"]{--pin2-a:#4B3BB5; --pin2-b:#1A1550; --people-ink:#B7A4FF;}
.pin{background:linear-gradient(140deg,var(--pin2-a) 0%,var(--pin2-b) 100%); border:1px solid #ffffff2a; box-shadow:0 14px 34px rgba(42,35,128,.35);}
.pin::before{height:5px; background:linear-gradient(90deg,#FFB347,#FF6FA8,#8E7BFF);}
.pin::after{background:radial-gradient(circle,#FF6FA838,transparent 70%);}
.pin-sub{color:#DAD4FF;}
.pin-h{color:#D4CCFF;}
.pin-empty{color:#E3DEFF;}
.pin-tag{background:linear-gradient(135deg,#FFB347,#FF8A3D); color:#3A1D00;}
.pin .task-item{background:var(--card); box-shadow:0 8px 20px rgba(10,8,60,.28);}
.pin .task-item::before{background:linear-gradient(180deg,#8E7BFF,#FF6FA8);}
.pin .task-num{background:linear-gradient(135deg,#8E7BFF,#FF6FA8); color:#fff; box-shadow:0 2px 8px rgba(142,123,255,.45);}
.pin-lessons{display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,#ffffff2e,#ffffff14); border:1px solid #ffffff3d; border-radius:14px; padding:10px 14px; color:#fff; box-shadow:inset 0 1px 0 #ffffff33;}
.pin-lessons .pl-ico{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#FFB347,#FF8A3D); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; box-shadow:0 2px 8px rgba(255,138,61,.45);}
.pin-lessons .pl-txt{font-size:14px; font-weight:600;}
.pin-lessons b{font-size:20px; font-weight:800; color:#FFD27A; margin-right:3px; text-shadow:0 0 12px rgba(255,190,90,.5);}
.pin-lessons.none{color:#E3DEFF;}
.pin-tasklink{color:#FFD9A0;}

/* ===== "Thành phần" nổi bật ===== */
.task-meta{display:block; background:var(--khi-soft); border-left:4px solid var(--khi); border-radius:8px; padding:6px 10px; margin-top:7px; font-weight:600; color:var(--ink);}
.task-meta .k{color:var(--people-ink); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-right:6px;}
.tbl tbody tr td[data-label="Thành phần"]{background:var(--khi-soft); color:var(--ink); font-weight:600; box-shadow:inset 3px 0 0 var(--khi);}
@media (max-width:640px){
  .tbl tbody tr td[data-label="Thành phần"]{margin:2px 0; padding:6px 14px; box-shadow:inset 4px 0 0 var(--khi);}
  .tbl td[data-label="Thành phần"]::before{color:var(--people-ink); font-weight:800; text-transform:uppercase; font-size:11px; letter-spacing:.06em;}
}

/* =====================================================
   GIAO DIỆN MỚI v2 — Nunito · xanh lá
   ===================================================== */
:root{
  --font:'Mulish','Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-serif:var(--font); --font-sans:var(--font); --font-mono:'Chakra Petch',var(--font);
  --ink:#0F2417; --ink-2:#3E5A48; --muted:#688574; --paper:#F1F7F2; --paper-2:#E0EEE3; --card:#FFFFFF; --line:#D3E4D8; --line-soft:#E4EFE7;
  --brand:#0B4F2A; --brand-2:#16A04F; --hl:#15803D; --on-hl:#fff;
  --gold:#F97316; --gold-soft:#FFEBDA;
  --p301:#0EA371; --p301-soft:#D9F5EA; --p303:#D69A06; --p303-soft:#FBF0CC; --p302:#0891B2; --p302-soft:#D5F2F8;
  --nhu:#E11D74; --nhu-soft:#FBDCEA; --khi:#8B5CF6; --khi-soft:#EBE3FE; --red:#EF4444; --red-soft:#FDE0E0;
  --pin-a:#15803D; --pin-b:#0B4F2A; --task-soft:#D8F0DF; --people-ink:#0F766E; --people-soft:#D7F4EE; --people:#14B8A6;
  --pin2-a:#FB7A2B; --pin2-b:#C2185B;
  --radius-s:12px; --radius-m:20px;
  --shadow:0 1px 2px rgba(11,79,42,.05),0 6px 20px rgba(11,79,42,.08);
  --shadow-lg:0 16px 40px rgba(11,79,42,.2);
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E8F5EC; --ink-2:#BFD8C8; --muted:#8DAE99; --paper:#07110B; --paper-2:#0F1D14; --card:#0C170F; --line:#1D3324; --line-soft:#14261A;
  --brand:#052E16; --brand-2:#0F6B34; --hl:#4ADE80; --on-hl:#04210F; --gold:#FB923C; --gold-soft:#3A2412;
  --p301:#34D399; --p303:#FBBF24; --p302:#38BDF8; --nhu:#F472B6; --khi:#A78BFA; --red:#F87171;
  --p301-soft:#10302A; --p303-soft:#33290F; --p302-soft:#0F2E3A; --nhu-soft:#35172A; --khi-soft:#251F47; --red-soft:#3A1A1C;
  --pin-a:#15803D; --pin-b:#052E16; --task-soft:#0F2A1A; --people-ink:#5EEAD4; --people-soft:#0F2F2E; --people:#2DD4BF;
  --pin2-a:#B8460E; --pin2-b:#7A1448; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --ink:#E8F5EC; --ink-2:#BFD8C8; --muted:#8DAE99; --paper:#07110B; --paper-2:#0F1D14; --card:#0C170F; --line:#1D3324; --line-soft:#14261A;
  --brand:#052E16; --brand-2:#0F6B34; --hl:#4ADE80; --on-hl:#04210F; --gold:#FB923C; --gold-soft:#3A2412;
  --p301:#34D399; --p303:#FBBF24; --p302:#38BDF8; --nhu:#F472B6; --khi:#A78BFA; --red:#F87171;
  --p301-soft:#10302A; --p303-soft:#33290F; --p302-soft:#0F2E3A; --nhu-soft:#35172A; --khi-soft:#251F47; --red-soft:#3A1A1C;
  --pin-a:#15803D; --pin-b:#052E16; --task-soft:#0F2A1A; --people-ink:#5EEAD4; --people-soft:#0F2F2E; --people:#2DD4BF;
  --pin2-a:#B8460E; --pin2-b:#7A1448; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);}
html{scroll-behavior:smooth;}
html.theming *{transition:background-color .35s,color .35s,border-color .35s,box-shadow .35s !important;}
body{font-family:var(--font); font-size:15px; letter-spacing:-.005em; -webkit-font-smoothing:antialiased; background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--hl) 10%,transparent),transparent 60%),var(--paper);}
h1,h2,h3,.bar h2,.tbl-title,.pin-title{font-family:var(--font); letter-spacing:-.02em;}

/* Header */
header.top{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); border-bottom:1px solid #ffffff1f; box-shadow:0 8px 30px rgba(11,79,42,.3);}
.brand-eyebrow{color:#BDF0CE; background:#ffffff1a;}
.brand h1{font-weight:800;}
.brand h1 .yr{color:#FFC48A;}
.brand-logo{background:linear-gradient(145deg,#ffffff38,#ffffff12); border-radius:14px;}
.clock{border-color:#FFB26B66; background:linear-gradient(160deg,#00000066,#00000038); border-radius:16px;}
.clock-time{font-family:var(--font-mono); font-weight:700; color:#FFB26B; letter-spacing:.02em;}
select.sel,.btn-ghost{background:#ffffff1f; border:1px solid #ffffff3d; border-radius:14px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
select.sel option{color:#0F2417;}
nav.tabs{background:#00000038; border:1px solid #ffffff1a;}
.tab{font-weight:600; border-radius:12px; transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--ease);}
.tab:active{transform:scale(.96);}
.tab[aria-selected="true"]{background:#fff; color:var(--brand-2); box-shadow:0 4px 14px rgba(0,0,0,.25);}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--hl); color:var(--on-hl);}}
@media (max-width:640px){
  nav.tabs{background:color-mix(in srgb,var(--card) 88%,transparent); backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4); border:1px solid var(--line); border-radius:22px; box-shadow:0 12px 36px rgba(11,79,42,.28);}
  .tab{color:var(--muted);}
  .tab[aria-selected="true"]{background:linear-gradient(135deg,var(--hl),var(--brand-2)); color:#fff; box-shadow:0 6px 16px rgba(21,128,61,.4);}
  main{padding-left:14px; padding-right:14px;}
}

/* Thẻ & khối chung */
.day-card,.panel,.stat-card,.status-panel,.tbl,.modal,.legend,.log-nav,.task-item{border-radius:var(--radius-m);}
.day-card{border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden; transition:transform .3s var(--ease),box-shadow .3s var(--ease);}
.day-head{background:linear-gradient(180deg,var(--paper-2),var(--card)); border-right:1px solid var(--line-soft);}
.day-card.is-today{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold),0 12px 28px color-mix(in srgb,var(--gold) 30%,transparent); animation:glow 3s ease-in-out infinite;}
.day-card.is-today .day-head{background:linear-gradient(160deg,#FB923C,#F97316); color:#fff;}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--gold),0 14px 34px color-mix(in srgb,var(--gold) 45%,transparent);}}
.chip{border-radius:14px; border:1px solid var(--line-soft); box-shadow:0 1px 3px rgba(11,79,42,.05); transition:transform .22s var(--ease),box-shadow .22s var(--ease);}
.chip:active{transform:scale(.985);}
.chip-teacher{background:linear-gradient(135deg,var(--hl),var(--brand-2)); color:#fff;}
.slot-head{color:var(--muted); font-weight:700;}
.legend{background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);}
.iconbtn{border-radius:12px; border:1px solid var(--line); transition:transform .2s var(--ease),background .2s;}
.iconbtn:active{transform:scale(.92);}
.month-cell{border-radius:14px; transition:transform .2s var(--ease),box-shadow .2s var(--ease);}
.month-cell:active{transform:scale(.95);}
.month-cell.teach-hit{background:linear-gradient(145deg,var(--hl),var(--brand-2));}
.stat-card::before,.bar-row .fill{background:linear-gradient(90deg,var(--hl),var(--brand-2));}
.stat-card::before{background:linear-gradient(180deg,var(--hl),var(--gold));}
.bar-row .fill{transition:width .8s var(--ease);}

/* Ô ghim hôm nay: cam – hồng */
.pin{background:linear-gradient(140deg,var(--pin2-a) 0%,var(--pin2-b) 100%); border:1px solid #ffffff33; border-radius:24px; box-shadow:0 16px 38px color-mix(in srgb,var(--pin2-b) 45%,transparent);}
.pin::before{background:linear-gradient(90deg,#FFE29A,#fff,#FFE29A);}
.pin::after{background:radial-gradient(circle,#ffffff2e,transparent 70%);}
.pin-tag{background:#fff; color:#C2410C; box-shadow:0 3px 10px rgba(0,0,0,.2);}
.pin-title,.pin-date{color:#fff;}
.pin-empty{color:#FFE9DD;}
.pin-tasklink{color:#FFF1C9; font-weight:700;}
.pin .task-item{background:var(--card); border:none; box-shadow:0 10px 22px rgba(60,10,40,.28);}
.pin .task-item::before{background:linear-gradient(180deg,#FB923C,#EC4899);}
.pin .task-num{background:linear-gradient(135deg,#FB923C,#EC4899); box-shadow:0 3px 10px rgba(236,72,153,.4);}
.pin-lessons{background:linear-gradient(135deg,#ffffff38,#ffffff18); border:1px solid #ffffff4a;}
.pin-lessons .pl-ico{background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.2);}
.pin-lessons b{color:#fff; text-shadow:0 0 14px rgba(255,255,255,.5);}
.pin-lessons.none{color:#FFE9DD;}

/* Tab Công việc */
#view-tasks .log-nav{background:linear-gradient(135deg,var(--pin-a),var(--pin-b));}
#view-tasks .task-item{background:linear-gradient(90deg,var(--task-soft),var(--card) 78%); border:1px solid var(--line);}
#view-tasks .task-item::before{background:linear-gradient(180deg,var(--hl),var(--brand-2));}
#view-tasks .task-num{background:linear-gradient(135deg,var(--hl),var(--brand-2)); color:#fff; box-shadow:0 3px 10px rgba(21,128,61,.4);}
#view-tasks .task-empty{background:var(--task-soft); border-color:var(--hl);}
.task-meta{background:var(--people-soft); border-left-color:var(--people);}
.task-meta .k,.tbl td[data-label="Thành phần"]::before{color:var(--people-ink);}
.tbl tbody tr td[data-label="Thành phần"]{background:var(--people-soft); box-shadow:inset 3px 0 0 var(--people);}
.tbl{border:1px solid var(--gold);}
.tbl th{background:linear-gradient(135deg,#F97316,#EC4899);}
.cd{background:linear-gradient(135deg,var(--hl),var(--brand-2)); box-shadow:0 2px 8px rgba(21,128,61,.35);}
.cd.near{background:linear-gradient(135deg,#F97316,#FBBF24); color:#3A1D00;}
.cd.soon{background:linear-gradient(135deg,#EF4444,#F97316);}
.cd.now{background:linear-gradient(135deg,#0EA371,#34D399); color:#04251A;}

/* Hiệu ứng xuất hiện mượt */
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.985);} to{opacity:1; transform:none;}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
#view-week > *, #view-month > *, #view-tasks > *, .pin{animation:rise .5s var(--ease) both;}
#view-week .day-card:nth-child(2),#view-tasks > *:nth-child(2){animation-delay:.04s;}
#view-week .day-card:nth-child(3),#view-tasks > *:nth-child(3){animation-delay:.08s;}
#view-week .day-card:nth-child(4),#view-tasks > *:nth-child(4){animation-delay:.12s;}
#view-week .day-card:nth-child(5),#view-tasks > *:nth-child(5){animation-delay:.16s;}
#view-week .day-card:nth-child(6),#view-tasks > *:nth-child(6){animation-delay:.2s;}
.overlay{animation:fadeIn .25s ease both;} .modal{animation:rise .35s var(--ease) both;}
.spinner{border-top-color:var(--hl); border-right-color:var(--gold); animation:spin .7s linear infinite;}
@media (hover:hover){.day-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);} .chip:hover{transform:translateY(-2px);}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important; scroll-behavior:auto !important;}}

/* ===== Ô ghim hôm nay v2: gọn, sáng, chỉ ở tab Theo tuần ===== */
body:not([data-tab="week"]) #pinToday{display:none !important;}
.pin{background:linear-gradient(135deg,var(--gold-soft),var(--card) 60%); border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line)); border-radius:20px; padding:12px 14px 12px 18px; box-shadow:var(--shadow); color:var(--ink);}
.pin::before{left:0; top:0; bottom:0; right:auto; width:5px; height:auto; background:linear-gradient(180deg,#FB923C,#EC4899);}

.pin-head{display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px;}
.pin-head-left{display:flex; align-items:center; gap:8px; min-width:0;}

.pin-title{color:var(--ink); font-size:15px; font-weight:800;}
.pin-lessons{margin:0 0 0 auto; display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; background:var(--card); border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line)); color:var(--ink); box-shadow:none; font-size:12.5px; font-weight:600;}
.pin-lessons .pl-ico{width:auto; height:auto; background:none; box-shadow:none; font-size:13px; border-radius:0;}
.pin-lessons .pl-txt{font-size:12.5px; font-weight:600;}
.pin-lessons b{color:var(--gold); font-size:16px; font-weight:800; text-shadow:none; margin-right:2px;}
.pin-lessons.none{color:var(--muted);}
.pin-body{margin-top:10px;}
.pin-empty{color:var(--muted); font-size:13.5px;}
.pin .task-list{gap:8px;}
.pin .task-item{background:var(--card); border:1px solid var(--line); box-shadow:none; padding:9px 12px 9px 14px; border-radius:14px;}
.pin .task-item::before{width:4px; background:linear-gradient(180deg,#FB923C,#EC4899);}
.pin .task-num{width:26px; height:26px; font-size:12.5px; box-shadow:none; background:linear-gradient(135deg,#FB923C,#F97316);}
.pin-tasklink{display:block; margin:8px 0 0 auto; color:var(--hl); font-weight:700; font-size:12.5px; text-shadow:none;}
@media (max-width:420px){ .pin-title{font-size:14px;} .pin-lessons{padding:3px 10px;} }

/* ===== Bỏ viền dày bên trái của các ô ===== */
.chip, .chip[class*="track-"], .chip.holiday{border-left:1px solid var(--line-soft);}
.status-panel.error, .status-panel.setup{border-left:1px solid var(--line);}
.teach-banner{border-left:1px solid var(--hl);}
.task-item::before, .pin .task-item::before, #view-tasks .task-item::before, .pin::before, .stat-card::before{display:none !important;}
.task-item, .pin .task-item{padding-left:14px;}

}

/* ===== Nội dung công việc: chữ đậm nổi bật; đếm ngược sát phải thẻ ===== */

.pin .task-title{text-align:center; font-weight:800; font-size:16.5px;}
/* Tiêu đề 3 tab đậm */
.tab{font-weight:800 !important;}

/* ===== Tiêu đề trang: nền khác, các nút cao bằng nhau ===== */
header.top{background:linear-gradient(135deg,#062B33 0%,#0A4F55 52%,#10897A 100%) !important; border-bottom:1px solid #ffffff22 !important; box-shadow:0 8px 28px rgba(6,43,51,.35) !important;}

<script>
/* =====================================================================
   CẤU HÌNH — dán 4 link "Xuất bản lên web" (định dạng CSV) từ Google
   Sheet của bạn vào đây. Xem hướng dẫn Trưởng khoa đã nhận kèm file này.
   ===================================================================== */
const CSV_URL_LESSONS  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=589329369&single=true&output=csv";
const CSV_URL_SUBJECTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=418155342&single=true&output=csv";
const CSV_URL_TEACHERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1579967289&single=true&output=csv";
const CSV_URL_TASKS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHb0FFwu74XdGNSEVVheaD1XhJU2DFb4AxpxA8g_9aD5lBl00Srfy33_AkQ-nzyA/pub?gid=1365016418&single=true&output=csv";
/* ===================================================================== */
</script>
<script>
(function(){
"use strict";

/* ================= CSV parsing ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c=>c!==""));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = (r[i]!==undefined ? r[i].trim() : ""));
    return o;
  });
}
async function fetchCSV(url){
  const bust = url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now();
  const res = await fetch(bust, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  let text = await res.text();
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  return csvToObjects(text);
}

/* ================= Date parsing ================= */
function normalizeDate(s){
  if(!s) return null;
  s = s.trim().replace(/^"|"$/g,"");
  // ISO: 2026-06-19 or 2026/06/19
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  // D/M/Y or M/D/Y — ambiguous, resolve using validity (day<=31, month<=12)
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/);
  if(m){
    let a = parseInt(m[1],10), b = parseInt(m[2],10);
    const y = m[3];
    let day, month;
    if(a>12 && b<=12){ day=a; month=b; }               // must be D/M/Y
    else if(b>12 && a<=12){ day=b; month=a; }           // must be M/D/Y
    else { day=a; month=b; }                            // ambiguous -> assume D/M/Y (VN convention)
    if(month>=1 && month<=12 && day>=1 && day<=31){
      return y+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    }
  }
  return null;
}

/* ================= Build data model from sheet rows ================= */
function buildLessons(rows, subjMap, teachMap){
  const out = [];
  let id = 1;
  let skippedNoDate = 0, skippedNoCode = 0;
  rows.forEach(r=>{
    const rawDate = r["Ngày"] || r["Ngay"] || "";
    const date = normalizeDate(rawDate);
    const code = (r["Mã môn"]||r["Ma mon"]||"").trim();
    if(!date){ if(rawDate) skippedNoDate++; return; }
    if(!code){ skippedNoCode++; return; }
    const nhom = (r["Nhóm"]||r["Nhom"]||"").trim();
    const lop = (r["Lớp/Phòng"]||r["Lop/Phong"]||"").trim();
    let room = "";
    if(["P301","P303","P302"].includes(lop)) room = lop;
    else if(/quân nhu|quan nhu/i.test(nhom)) room = "QNhu";
    else if(/quân khí|quan khi/i.test(nhom)) room = "QKhi";
    else room = lop || "P301";

    const teacherCodeRaw = (r["Mã GV"]||r["Ma GV"]||"").trim();
    const subjFromMap = subjMap[code.toLowerCase()];
    const teachFromMap = teacherCodeRaw ? teachMap[teacherCodeRaw.toLowerCase()] : null;
    const sheetSubjectName = (r["Tên môn học"]||r["Ten mon hoc"]||"").trim();
    const sheetTeacherName = (r["Tên giáo viên"]||r["Ten giao vien"]||"").trim();
    const looksLikeError = (t)=> /^#|chưa có trong danh mục/i.test(t||"");

    out.push({
      id: id++,
      date,
      period: (r["Tiết"]||r["Tiet"]||"").trim(),
      room,
      code,
      subject: (subjFromMap && subjFromMap.name) || (!looksLikeError(sheetSubjectName) && sheetSubjectName) || code,
      teacherCode: teacherCodeRaw || null,
      teacher: (teachFromMap && teachFromMap.name) || (!looksLikeError(sheetTeacherName) && sheetTeacherName) || null,
      location: (r["Địa điểm / Ghi chú"]||r["Dia diem / Ghi chu"]||"").trim(),
      isHoliday: code === "NGHI_LE" || /nghỉ lễ/i.test(sheetSubjectName),
    });
  });
  return {lessons: out, skippedNoDate, skippedNoCode};
}
function buildCatalogMap(rows, codeKeys, nameKeys, extra){
  const map = {};
  rows.forEach(r=>{
    let code = "", name = "";
    for(const k of codeKeys){ if(r[k]){ code=r[k].trim(); break; } }
    for(const k of nameKeys){ if(r[k]){ name=r[k].trim(); break; } }
    if(code) map[code.toLowerCase()] = {code, name};
  });
  return map;
}
function buildSubjects(rows){
  return buildCatalogMap(rows, ["Mã môn","Ma mon"], ["Tên bài / môn học","Tên môn học","Ten bai / mon hoc"]);
}
function buildTeachers(rows){
  const map = buildCatalogMap(rows, ["Mã GV","Ma GV"], ["Tên giáo viên","Ten giao vien"]);
  return Object.values(map);
}

/* ================= Constants ================= */
const TRACKS = [
  {key:"P301", label:"Quân y · L1 (P301)"},
  {key:"P303", label:"Quân y · L2 (P303)"},
  {key:"P302", label:"Quân y · L3 (P302)"},
  {key:"QNhu", label:"Quân nhu"},
  {key:"QKhi", label:"Quân khí"},
];
const SLOTS = [
  {key:"s1", periods:["1-3","2-3"]},
  {key:"s2", periods:["4-5"]},
  {key:"s3", periods:["6-8"]},
];
function slotOf(period){ return SLOTS.find(s=>s.periods.includes(period)) || SLOTS[0]; }
function trackVar(key){ return {P301:"p301", P303:"p303", P302:"p302", QNhu:"nhu", QKhi:"khi"}[key]; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtVN(iso){ if(!iso) return ""; const d=parseISO(iso); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function mondayOf(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return toISO(d); }
function weekdayNameOf(iso){ const d=parseISO(iso); const names=["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"]; return names[d.getDay()]; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function periodStart(p){ return parseInt(String(p).split("-")[0],10) || 0; }
function sortLessons(a,b){ const pa=periodStart(a.period), pb=periodStart(b.period); if(pa!==pb) return pa-pb; return TRACKS.findIndex(t=>t.key===a.room)-TRACKS.findIndex(t=>t.key===b.room); }
const TODAY = todayISO();

let lessons = [];
let teachers = [];
let IDX = {byDate:{}, MIN_DATE:null, MAX_DATE:null};
function reindex(){
  const byDate = {}; let MIN_DATE=null, MAX_DATE=null;
  lessons.forEach(l=>{
    (byDate[l.date] = byDate[l.date] || []).push(l);
    if(!MIN_DATE || l.date<MIN_DATE) MIN_DATE=l.date;
    if(!MAX_DATE || l.date>MAX_DATE) MAX_DATE=l.date;
  });
  IDX = {byDate, MIN_DATE, MAX_DATE};
}

const state = {
  tab:"week", teacher:"", selectedDay:null,
  weekAnchor: TODAY, monthAnchor: TODAY.slice(0,7)+"-01",
  pinOpen: localStorage.getItem("pinOpen") !== "0",
  taskDate: TODAY, openSlots: {}, pinLessons: false,
};

/* ================= Toast ================= */
let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

/* ================= Theme ================= */
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme(localStorage.getItem("theme") || "");
document.getElementById("themeBtn").addEventListener("click", ()=>{
  document.documentElement.classList.add("theming"); setTimeout(()=>document.documentElement.classList.remove("theming"),450);
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
  applyTheme(next);
  try{ localStorage.setItem("theme", next); }catch(e){}
});

/* ================= Status panel (loading / setup / error) ================= */
function showStatus(kind, html){
  const el = document.getElementById("statusArea");
  el.innerHTML = "<div class='status-panel "+(kind||"")+"'>"+html+"</div>";
}
function clearStatus(){ document.getElementById("statusArea").innerHTML = ""; }
function isConfigured(){
  return CSV_URL_LESSONS && !CSV_URL_LESSONS.includes("PASTE_LINK") &&
         CSV_URL_SUBJECTS && !CSV_URL_SUBJECTS.includes("PASTE_LINK") &&
         CSV_URL_TEACHERS && !CSV_URL_TEACHERS.includes("PASTE_LINK");
}
function showSetupInstructions(){
  showStatus("setup",
    "<h3>Chưa kết nối dữ liệu</h3>" +
    "<p>Trang này cần 4 link CSV từ Google Sheet của Trưởng khoa. Mở file HTML này bằng trình soạn thảo văn bản, tìm phần <code>CẤU HÌNH</code> ở đầu &lt;script&gt; và dán 4 link đã lấy từ Google Sheet (File → Chia sẻ → Xuất bản lên web → chọn từng sheet → định dạng CSV) vào 4 biến:</p>" +
    "<ol><li><code>CSV_URL_LESSONS</code> — sheet \"Lich giang day\"</li>" +
    "<li><code>CSV_URL_SUBJECTS</code> — sheet \"DanhMucMonHoc\"</li>" +
    "<li><code>CSV_URL_TEACHERS</code> — sheet \"DanhMucGiaoVien\"</li></ol>"
  );
}
function showLoading(){
  showStatus("", "<div class='spinner'></div><p>Đang tải dữ liệu từ Google Sheet…</p>");
}
function showError(msg){
  showStatus("error",
    "<h3>Không tải được dữ liệu</h3><p>"+escapeHtml(msg)+"</p>" +
    "<p>Kiểm tra: link CSV đã được \"Xuất bản lên web\" đúng sheet chưa, và mạng có đang chặn docs.google.com không.</p>" +
    "<button class='btn btn-outline btn-sm' id='retryBtn'>Thử lại</button>"
  );
  const b = document.getElementById("retryBtn");
  if(b) b.addEventListener("click", loadAllData);
}

/* ================= Load data ================= */
async function loadAllData(){
  if(!isConfigured()){ showSetupInstructions(); return; }
  showLoading();
  document.getElementById("pinToday").style.display = "none";
  try{
    const [lessonRows, subjRows, teachRows] = await Promise.all([
      fetchCSV(CSV_URL_LESSONS), fetchCSV(CSV_URL_SUBJECTS), fetchCSV(CSV_URL_TEACHERS)
    ]);
    const subjMap = buildSubjects(subjRows);
    teachers = buildTeachers(teachRows);
    const teachMap = {}; teachers.forEach(t=>teachMap[t.code.toLowerCase()]=t);
    const built = buildLessons(lessonRows, subjMap, teachMap);
    lessons = built.lessons;
    reindex();
    clearStatus();
    document.getElementById("pinToday").style.display = "";
    const anchor = (IDX.MIN_DATE && IDX.MIN_DATE<=TODAY && TODAY<=IDX.MAX_DATE) ? TODAY : (IDX.MIN_DATE||TODAY);
    state.weekAnchor = mondayOf(anchor);
    state.monthAnchor = anchor.slice(0,7)+"-01";
    refreshTeacherSelect();
    renderAll();
  }catch(err){
    showError(err.message || String(err));
  }
  await loadTasks();
}
async function loadTasks(){
  if(!CSV_URL_TASKS){ tasksStatus="nocfg"; tasks=[]; reindexTasks(); return; }
  tasksStatus = "loading";
  try{
    const rows = await fetchCSV(CSV_URL_TASKS);
    tasks = buildTasks(rows); reindexTasks(); tasksStatus = "ok";
  }catch(err){
    tasks = []; reindexTasks(); tasksStatus = "error"; tasksError = err.message || String(err);
  }
  renderAll();
}
document.getElementById("refreshBtn").addEventListener("click", loadAllData);

/* ================= Teacher select ================= */
function refreshTeacherSelect(){
  const sel = document.getElementById("teacherSelect");
  const cur = sel.value;
  sel.innerHTML = '<option value="">Tất cả giáo viên</option>';
  teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'vi')).forEach(t=>{
    const opt=document.createElement("option"); opt.value=t.code; opt.textContent=t.name; sel.appendChild(opt);
  });
  sel.value = cur;
}
document.getElementById("teacherSelect").addEventListener("change", (e)=>{ state.teacher = e.target.value; renderAll(); });

/* ================= Chip + detail modal ================= */
const detailOverlay = document.getElementById("detailOverlay");
document.getElementById("detailClose").addEventListener("click", ()=>detailOverlay.classList.remove("show"));
detailOverlay.addEventListener("click", (e)=>{ if(e.target===detailOverlay) detailOverlay.classList.remove("show"); });

function openDetail(lesson){
  const body = document.getElementById("detailBody");
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  body.innerHTML = [
    ["Môn học", lesson.subject],
    ["Mã môn", lesson.code],
    ["Nhóm/Lớp", lesson.isHoliday ? "—" : (trackInfo?trackInfo.label:lesson.room)],
    ["Ngày", weekdayNameOf(lesson.date)+", "+fmtVN(lesson.date)],
    ["Tiết", lesson.period||"—"],
    ["Giáo viên", lesson.teacher || "Chưa rõ"],
    ["Địa điểm / Ghi chú", lesson.location || "—"],
  ].map(([k,v])=>"<div class='kv'><span class='k'>"+k+"</span><span class='v'>"+escapeHtml(v)+"</span></div>").join("");
  detailOverlay.classList.add("show");
}
function chipEl(lesson){
  const el = document.createElement("div");
  const trackClass = lesson.isHoliday ? "holiday" : "track-"+lesson.room;
  el.className = "chip " + trackClass;
  const trackInfo = TRACKS.find(t=>t.key===lesson.room);
  const tagText = lesson.isHoliday ? "NGHỈ" : (trackInfo ? trackInfo.label.replace("Quân y · ","").replace("Quân ","Q.") : lesson.room);
  el.innerHTML =
    "<div class='chip-top'><span class='chip-track-tag'>"+escapeHtml(tagText)+"</span>" +
    "<span class='chip-code'>"+escapeHtml(lesson.code)+", tiết "+escapeHtml(lesson.period||"")+"</span>" +
    "<span class='chip-teacher'>"+escapeHtml(lesson.teacher || (lesson.isHoliday? "" : "GV: chưa rõ"))+"</span></div>" +
    "<div class='chip-subject'>"+escapeHtml(lesson.subject)+"</div>";
  if(state.teacher){
    if(lesson.teacherCode && lesson.teacherCode.toLowerCase() === state.teacher.toLowerCase()) el.classList.add("match");
    else el.classList.add("dim");
  }
  el.addEventListener("click", ()=>openDetail(lesson));
  return el;
}

/* ================= Legend ================= */
function renderLegend(){
  const lg = document.getElementById("legend");
  lg.style.display = "none";

}
function taskCountFor(dateIso){ return (TASKIDX[dateIso]||[]).length; }

/* ================= Cong viec theo ngay (doc tu Google Sheet, chi xem) ================= */
let tasks = [];
let TASKIDX = {};
let tasksStatus = CSV_URL_TASKS ? "loading" : "nocfg";   // loading | ok | error | nocfg
let tasksError = "";
function buildTasks(rows){
  const out = [];
  rows.forEach(r=>{
    const date = normalizeDate(r["Ngày"]||r["Ngay"]||"");
    const title = (r["Nội dung công việc"]||r["Noi dung cong viec"]||"").trim();
    if(!date || !title) return;
    out.push({
      date, title,
      people: (r["Thành phần"]||r["Thanh phan"]||"").trim(),
      note: (r["Ghi chú"]||r["Ghi chu"]||"").trim(),
    });
  });
  return out;
}
function reindexTasks(){
  TASKIDX = {};
  tasks.forEach(t=>{ (TASKIDX[t.date] = TASKIDX[t.date] || []).push(t); });
}
function taskItemEl(t, idx){
  const el = document.createElement("div"); el.className = "task-item";
  let h = "<div class='task-num'>"+(idx!=null?idx+1:"•")+"</div><div class='task-body'>";
  h += "<div class='task-title'>"+escapeHtml(t.title)+"</div>";
  if(t.people) h += "<div class='task-meta'><span class='k'>Thành phần</span>"+escapeHtml(t.people)+"</div>";
  if(t.note) h += "<div class='task-note'><span class='k'>Ghi chú</span>"+escapeHtml(t.note)+"</div>";
  h += "</div>";
  el.innerHTML = h;
  return el;
}
function renderTasks(){
  const root = document.getElementById("view-tasks");
  root.innerHTML = "";
  const bar = document.createElement("div"); bar.className="bar";
  bar.innerHTML = "<h2>Công việc triển khai theo ngày</h2>";
  root.appendChild(bar);

  if(tasksStatus === "nocfg"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel setup'><h3>Chưa kết nối sheet công việc</h3><p>Dán link CSV của sheet <code>CongViec</code> vào biến <code>CSV_URL_TASKS</code> ở đầu phần &lt;script&gt;.</p></div>");
    return;
  }
  if(tasksStatus === "loading"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel'><div class='spinner'></div><p>Đang tải công việc…</p></div>");
    return;
  }
  if(tasksStatus === "error"){
    root.insertAdjacentHTML("beforeend","<div class='status-panel error'><h3>Không tải được công việc</h3><p>"+escapeHtml(tasksError)+"</p><p>Kiểm tra sheet <code>CongViec</code> đã được \"Xuất bản lên web\" (CSV) và link đúng gid chưa, rồi bấm Làm mới.</p></div>");
    return;
  }

  const nav = document.createElement("div"); nav.className="log-nav";
  const prev = document.createElement("button"); prev.className="iconbtn"; prev.textContent="‹";
  const next = document.createElement("button"); next.className="iconbtn"; next.textContent="›";
  prev.addEventListener("click", ()=>{ state.taskDate=addDays(state.taskDate,-1); renderTasks(); });
  next.addEventListener("click", ()=>{ state.taskDate=addDays(state.taskDate,1); renderTasks(); });
  const label = document.createElement("div"); label.className="datelabel";
  label.textContent = weekdayNameOf(state.taskDate)+", "+fmtVN(state.taskDate)+(state.taskDate===TODAY?" (hôm nay)":"");
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
  root.appendChild(nav);

  if(state.taskDate !== TODAY){
    const jump = document.createElement("button"); jump.className="btn btn-outline btn-sm"; jump.style.marginBottom="12px"; jump.textContent="Về hôm nay";
    jump.addEventListener("click", ()=>{ state.taskDate=TODAY; renderTasks(); });
    root.appendChild(jump);
  }

  const items = TASKIDX[state.taskDate] || [];
  if(!items.length){
    const e=document.createElement("div"); e.className="task-empty"; e.textContent="Không có công việc nào được ghi cho ngày này."; root.appendChild(e);
  } else {
    const tl = document.createElement("div"); tl.className="task-list";
    items.forEach((t,i)=>tl.appendChild(taskItemEl(t,i)));
    root.appendChild(tl);
  }

  const up = tasks.filter(t=>t.date>=TODAY && t.date!==state.taskDate).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0).slice(0,30);
  if(up.length){
    const t = document.createElement("h3"); t.className="tbl-title"; t.style.marginTop="8px"; t.textContent="Công việc các ngày sắp tới";
    root.appendChild(t);

    w.querySelectorAll("tr[data-date]").forEach(tr=>tr.addEventListener("click", ()=>{ state.taskDate=tr.dataset.date; renderTasks(); window.scrollTo({top:0,behavior:"smooth"}); }));
    root.appendChild(w);
  }

function countdownHtml(iso){
  const n = Math.round((parseISO(iso) - parseISO(TODAY)) / 86400000);
  if(n < 0) return "";
  const cls = n === 0 ? "cd now" : (n === 1 ? "cd soon" : (n <= 3 ? "cd near" : "cd"));
  const txt = n === 0 ? "Hôm nay" : (n === 1 ? "Ngày mai" : "Còn " + n + " ngày");
  return "<span class='" + cls + "'>" + txt + "</span>";
}
function taskTable(items, withDate){
  const wrap = document.createElement("div"); wrap.className="tbl-wrap";
  const cell = (label,val,cls)=>"<td class='"+(cls||"")+"' data-label='"+label+"'"+(val?"":" data-e='1'")+">"+(val?escapeHtml(val):"–")+"</td>";
  let h = "<table class='tbl'><thead><tr><th class='c-stt'>STT</th>"+(withDate?"<th class='c-date'>Ngày</th>":"")+"<th>Nội dung công việc</th><th>Thành phần</th><th>Ghi chú</th></tr></thead><tbody>";
  items.forEach((x,i)=>{
    h += "<tr"+(withDate?" data-date='"+x.date+"'":"")+"><td class='c-stt' data-label='STT'>"+(i+1)+"</td>"
      + (withDate?"<td class='c-date' data-label='Ngày'>"+escapeHtml(weekdayNameOf(x.date)+", "+fmtVN(x.date))+countdownHtml(x.date)+"</td>":"")
      + cell("Nội dung",x.title,"c-main")+cell("Thành phần",x.people)+cell("Ghi chú",x.note)+"</tr>";
  });
  wrap.innerHTML = h+"</tbody></table>";
  return wrap;
}

/* ================= Header: ẩn thanh công cụ khi cuộn xuống ================= */
(function(){
  const hdr = document.querySelector("header.top"), wrap = document.getElementById("toolbarWrap");
  if(!hdr || !wrap) return;
  let hidden = false, busy = false, lastY = window.scrollY || 0, busyTimer = null;
  function measure(){ if(hidden || busy) return; document.documentElement.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); }
  function setHidden(v){
    if(v === hidden) return;
    hidden = v; busy = true;
    wrap.classList.toggle("is-hidden", hidden);
    clearTimeout(busyTimer);
    busyTimer = setTimeout(()=>{ busy = false; measure(); }, 340);
  }
  window.addEventListener("scroll", ()=>{
    const y = Math.max(0, window.scrollY || 0), dy = y - lastY;
    if(Math.abs(dy) < 6) return;
    lastY = y;
    if(y <= 24 || dy < 0) setHidden(false);
    else if(y > 120 && dy > 0 && document.activeElement !== document.getElementById("teacherSelect")) setHidden(true);
  }, {passive:true});
  window.addEventListener("resize", ()=>{ setHidden(false); setTimeout(measure, 360); });
  if(window.ResizeObserver) new ResizeObserver(measure).observe(hdr);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();
})();

/* ================= Đồng hồ số ================= */
(function(){
  const t = document.getElementById("clockTime"), d = document.getElementById("clockDate");
  if(!t || !d) return;
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const now = new Date();
    t.innerHTML = pad(now.getHours()) + '<span class="colon">:</span>' + pad(now.getMinutes()) + '<span class="colon">:</span>' + pad(now.getSeconds());
    d.textContent = weekdayNameOf(toISO(now)) + ", " + pad(now.getDate()) + "/" + pad(now.getMonth()+1);
  }
  tick();
  setInterval(tick, 1000);
})();

loadAllData();

})();
</script>
